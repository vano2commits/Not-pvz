          const gp = cellOf(wall);
          burst(gp.x + CELL / 2, gp.y + CELL * 0.6, 16,
                { colors: ["#6fbf5b", "#3f8a4a", "#2b5e33"], spread: 240, size: [1.6, 4] });
          kick(2.6); stop(0.03); Sound.play("kill");
        }
        continue;
      }

      f.x -= f.speed * jeer * dt;
      f.step += Math.abs(prev - f.x);
      if (f.step > 26) {
        f.step = 0;
        burst(f.x + 5, laneY(f.lane) + CELL * 0.82, 2,
              { colors: ["#3b3340", "#4a4150"], spread: 30, size: [1, 2], gravity: 120, life: [0.18, 0.36] });
      }

      if (f.x <= OX) {
        // A bear trap is a safety net for a hero, not an answer to the ending. Letting it
        // one-shot the Reeve meant a board stacked into one lane simply won: the boss
        // walked around the guns into an empty lane, as designed, and the trap in that
        // lane killed it for free.
        if (d.boss) {
          f.hp -= 900; f.hitT = 0.3; f.squash = 1.2;
          if (S.traps[f.lane]) {
            S.traps[f.lane] = false; S.laneQuiet[f.lane] = 2;
            popText(OX + 40, laneY(f.lane) + 6, "IT SHRUGS IT OFF", "#d1553f");
            ring(OX + 22, laneY(f.lane) + CELL * 0.6, 150, "rgba(232,192,90,.7)", 4, 0.4);
            kick(9); Sound.play("trap");
          }
          // it does not stop at the caravan - it turns round and comes again
          f.x = W + 20; f.lane = emptiestLane(); f.laneF = f.lane;
          if (S.cart > 0) S.cart--;
          continue;
        }
        if (S.traps[f.lane]) {
          S.traps[f.lane] = false;
          S.laneQuiet[f.lane] = 2;
          for (const v of S.foes)
            if (v.lane === f.lane && v.hp > 0 && !FOES[v.type].boss) { v.hp = 0; v.byTrap = true; }
          ring(OX + 22, laneY(f.lane) + CELL * 0.6, 190, "rgba(232,192,90,.8)", 5, 0.45);
          burst(OX + 22, laneY(f.lane) + CELL * 0.6, 24,
                { colors: ["#e8c05a", "#fff3cf", "#8f8698"], spread: 380, size: [1.8, 4.6] });
          kick(12); stop(0.08); flash(0.3); Sound.play("trap");
        } else if (S.cart > 0) {
          // it gets through, and the caravan pays for it
          S.cart--;
          f.hp = 0; f.byTrap = true;
          for (const v of S.foes)
            if (v.lane === f.lane && v.hp > 0 && v.x < OX + CELL && !FOES[v.type].boss) {
              v.hp = 0; v.byTrap = true;
            }
          ring(OX + 22, laneY(f.lane) + CELL * 0.6, 220, "rgba(209,85,63,.9)", 6, 0.5);
          burst(OX + 10, H / 2, 26,
                { colors: ["#e8c05a", "#8a7134", "#d1553f"], spread: 380 });
          popText(OX + 40, OY + 18, S.cart + " LEFT", "#d1553f");
          kick(16); stop(0.12); flash(0.38); Sound.play("trap");
        } else defeat();
      }
    }

    for (const f of S.foes) {
      if (f.hp > 0 || f.dead) continue;
      f.dead = true; S.killed++; S.killLanes[f.lane] = true;
      const y = laneY(f.lane) + CELL * 0.5;
      burst(f.x, y, f.byTrap ? 8 : 14,
            { colors: ["#c9ced8", "#8b93a2", "#5a5560"], spread: 280, size: [1.6, 4], life: [0.3, 0.7] });
      if (!f.byTrap) { kick(1.6); Sound.play("kill"); }
      // The Rot does not make you poorer, it changes where money comes from.
      let purse = Math.round(FOES[f.type].purse * world().purse);
      // A Tollkeeper is a Digger that mines corpses, and it is paid on the same terms:
      // the further right it stands the bigger the cut, and every cut draws down the same
      // pocket a Digger would be draining. Kill income gets the geometry digging already
      // had - the money is to the right and so is everything that kills you - instead of
      // being a flat lane-wide multiplier that runs all level and never cares where it is.
      const scav = S.goblins.filter(g => g.row === f.lane)
                            .reduce((a, g) => a + gobSmall(g, "scav"), 0);
      // Coin-tipped: the shot that landed it was fitted by a Digger
      if (f.tipped) purse = Math.round(purse * 1.5);
      let toll = 0;
      for (const g of S.goblins) {
        if (g.row !== f.lane) continue;
        const n = countOf(g, "tollkeep") + (gobHas(g, "sniffer") ? 0.5 : 0);
        if (!n) continue;
        const vk = g.col + "," + g.row;
        if (S.veins[vk] === undefined) S.veins[vk] = 1;
        const left = S.veins[vk];
        const gp = cellOf(g);
        if (left <= 0.02) {
          popText(gp.x + CELL / 2, gp.y + 6, "NOTHING LEFT", "#8a8095");
          continue;
        }
        toll += n * (yieldAt(g.col) / RICH_MAX()) * left;
        S.veins[vk] = Math.max(0, left - (1 / VEIN_PULLS) * n * world().bore * 0.55);
        // and it has to be visible, or nobody believes it is working
        popText(gp.x + CELL / 2, gp.y + 6, "TOLL", "#e8c05a");
        ring(gp.x + CELL / 2, gp.y + CELL / 2, 44, "rgba(232,192,90,.7)", 3, 0.3);
        g.squash = 1;
      }
      if (toll) purse = Math.round(purse * (1 + 2.2 * toll));
      purse += 6 * scav + (f.bounty || 0);   // the shot's own cut, from a Tollkeeper in the body
      spill(f.x, y, purse);      // heroes still pay a little, immediately
    }
    S.foes = S.foes.filter(f => f.hp > 0);

    // ---- gold flies home by itself
    for (const c of S.loot) {
      c.t += dt; c.spin += c.spinV * dt;
      if (c.t < c.hop) {
        c.vy += 1150 * dt;
        c.x += c.vx * dt; c.y += c.vy * dt;
      } else {
        const k = Math.min(1, dt * 7.5);
        c.x += (28 - c.x) * k;
        c.y += (-30 - c.y) * k;
        if (c.y < 6) {
          S.coins += c.value; c.gone = true;
          Sound.play("coin"); bumpCoins();
        }
      }
    }
    S.loot = S.loot.filter(c => !c.gone);

    for (const p of S.parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt; }
    S.parts = S.parts.filter(p => p.life > 0);
    for (const r of S.rings) r.t += dt;
    S.rings = S.rings.filter(r => r.t < r.life);
    for (const p of S.pops) p.t += dt;
    S.pops = S.pops.filter(p => p.t < p.life);
  }

  // =================================================================== drawing
  const cv = document.getElementById("board");
  const cx = cv.getContext("2d");

  // A crew, not a stack of the same sprite. Each goblin in a body gets its own spot,
  // its own size and a dark rim so the silhouettes separate; a Barricade is planking
  // bolted on the hero-facing side rather than another green blob.
  const FORMATION = {
    1: [[0, 0, 1]],
    2: [[-27, -13, 0.84], [13, 5, 1]],
    3: [[-32, -19, 0.72], [-5, -8, 0.85], [21, 6, 1]],
  };
  // Two goblins in one cell have to fit in one cell, so the group shrinks as it grows.
  const GROUP = { 1: 1, 2: 0.85, 3: 0.74 };
  const RIM = "#191320";

  function goblinFace(sc, tint, look, blink) {
    cx.save(); cx.scale(sc, sc);
    const rw = 26, rh = 28;
    cx.lineJoin = "round";
    cx.strokeStyle = RIM; cx.lineWidth = 5 / sc;
    cx.fillStyle = tint;
    // ears, then head, stroked together so the rim wraps the whole silhouette
    cx.beginPath(); cx.moveTo(-rw + 3, -6); cx.lineTo(-rw - 15, -20); cx.lineTo(-rw - 2, 4); cx.closePath();
    cx.stroke(); cx.fill();
    cx.beginPath(); cx.moveTo(rw - 3, -6); cx.lineTo(rw + 15, -20); cx.lineTo(rw + 2, 4); cx.closePath();
    cx.stroke(); cx.fill();
    cx.beginPath(); cx.ellipse(0, 0, rw, rh, 0, 0, 6.284); cx.stroke(); cx.fill();
    cx.fillStyle = "rgba(0,0,0,.22)";
    cx.beginPath(); cx.ellipse(0, rh * 0.45, rw * 0.92, rh * 0.4, 0, 0, 6.284); cx.fill();
    const ey = -rh * 0.22;
    if (blink) {
      cx.strokeStyle = "#14110f"; cx.lineWidth = 2.4;
      cx.beginPath(); cx.moveTo(-15, ey); cx.lineTo(-3, ey); cx.moveTo(3, ey); cx.lineTo(15, ey); cx.stroke();
    } else {
      cx.fillStyle = "#fdfbf4";
      cx.beginPath(); cx.ellipse(-9, ey, 7.5, 8.5, 0, 0, 6.284); cx.fill();
      cx.beginPath(); cx.ellipse(9, ey, 7.5, 8.5, 0, 0, 6.284); cx.fill();
      cx.fillStyle = "#14110f";
      cx.beginPath(); cx.arc(-9 + look, ey + 1, 3.4, 0, 6.284); cx.fill();
      cx.beginPath(); cx.arc(9 + look, ey + 1, 3.4, 0, 6.284); cx.fill();
    }
    cx.strokeStyle = "#14110f"; cx.lineWidth = 2; cx.lineCap = "round";
    cx.beginPath(); cx.arc(0, rh * 0.12, 9, 0.25, Math.PI - 0.25); cx.stroke();
    cx.fillStyle = "#fdfbf4";
    cx.fillRect(-5, rh * 0.12 + 5, 3.5, 4);
    cx.fillRect(2, rh * 0.12 + 5, 3.5, 4);
    cx.restore();
  }

  // Planking, one board per Barricade part, stood on the side the heroes come from.
  function drawPlanks(n, x0, hurt) {
    cx.save();
    const h = 30 + n * 8;
    cx.strokeStyle = RIM; cx.lineWidth = 4;
    for (let i = 0; i < n; i++) {
      const x = x0 + i * 9;
      cx.fillStyle = i % 2 ? mixHex("#6b4e2c", "#fff3cf", hurt * 0.8)
                           : mixHex("#8a6234", "#fff3cf", hurt * 0.8);
      cx.beginPath(); cx.rect(x, -h / 2, 8, h); cx.stroke(); cx.fill();
    }
    cx.strokeStyle = "#3f2f1c"; cx.lineWidth = 2.6;
    cx.beginPath(); cx.moveTo(x0 - 2, -h * 0.22); cx.lineTo(x0 + n * 9, -h * 0.22); cx.stroke();
    cx.beginPath(); cx.moveTo(x0 - 2, h * 0.22); cx.lineTo(x0 + n * 9, h * 0.22); cx.stroke();
    cx.restore();
  }

  // The one "this body has room" mark. Ring plus plus sign, same geometry either way.
  function drawFuseSlot(gp, pulse) {
    const gx = gp.x + CELL / 2, gy = gp.y + CELL / 2;
    cx.strokeStyle = "rgba(232,192,90," + (0.2 + pulse * 0.26) + ")";
    cx.lineWidth = 1.6;
    cx.beginPath(); cx.arc(gx, gy, CELL * 0.42, 0, 6.284); cx.stroke();
    cx.strokeStyle = "rgba(232,192,90," + (0.3 + pulse * 0.34) + ")";
    cx.lineWidth = 2; cx.lineCap = "round";
    const s = 5, py = gp.y + 11, px = gp.x + CELL - 11;
    cx.beginPath();
    cx.moveTo(px - s, py); cx.lineTo(px + s, py);
    cx.moveTo(px, py - s); cx.lineTo(px, py + s);
    cx.stroke();
  }

  function drawGoblin(g) {
    const p = cellOf(g);
    const cxp = p.x + CELL / 2, cyp = p.y + CELL * 0.58;
    const sq = g.squash > 0 ? ease(clamp(g.squash, 0, 1)) : 0;
    const landing = g.land > 0 ? ease(clamp(g.land, 0, 1)) : 0;
    const sx = (1 + sq * 0.24 + landing * 0.3) * K;
    const sy = (1 - sq * 0.18 - landing * 0.24) * K;
    const lean = (g.recoil > 0 ? -g.recoil * 13 : 0) + (g.wind ? g.wind * 7 : 0);

    // A steady ramp, not a strobe. The old version toggled on sin(t*60) — about ten
    // flips a second, aliasing against the frame rate into a flicker.
    const hurt = clamp(g.hurtT * 2.6, 0, 1);

    const bars = countOf(g, "barricade");
    const crew = g.parts.filter(t => t !== "barricade");
    const cn = countOf(g, "chucker");
    const bodies = crew.length || 1;      // an all-Barricade body still shows one goblin
    const form = FORMATION[bodies];

    if (S.selGob === g) {
      cx.strokeStyle = "rgba(232,192,90," + (0.55 + Math.sin(S.t * 7) * 0.3) + ")";
      cx.lineWidth = 2; cx.setLineDash([6, 5]); cx.lineDashOffset = -S.t * 22;
      cx.strokeRect(p.x + 3, p.y + 3, CELL - 6, CELL - 6);
      cx.setLineDash([]);
    }

    cx.fillStyle = "rgba(0,0,0,.34)";
    cx.beginPath();
    cx.ellipse(cxp, cyp + 30 * K, (24 + bodies * 5) * sx, 6 * K, 0, 0, 6.284);
    cx.fill();

    cx.save();
    cx.translate(cxp + lean, cyp);
    cx.scale(sx, sy);

    const gs = GROUP[bodies];
    cx.save();
    cx.translate(-bars * 7, 0);
    cx.scale(gs, gs);
    // back of the crew first, so the front goblin overlaps the ones behind it
    for (let i = 0; i < bodies; i++) {
      const [dx, dy, fsc] = form[i];
      const type = crew[i] || "barricade";
      const base = (UNITS[type] && UNITS[type].tint) || "#6fbf5b";
      const tint = mixHex(base, "#fff3cf", hurt * 0.85);
      cx.save();
      cx.translate(dx, dy);
      // a goblin two ranks back is further away, not just smaller
      cx.globalAlpha = i < bodies - 1 ? 0.93 : 1;
      goblinFace(fsc, tint, type === "digger" ? -2 : 2, false);
      if (type === "digger") {
        cx.save(); cx.scale(fsc, fsc);
        cx.strokeStyle = RIM; cx.lineWidth = 5; cx.lineCap = "round";
        cx.beginPath(); cx.moveTo(-20, 16); cx.lineTo(-34, 30); cx.stroke();
        cx.strokeStyle = "#9c7643"; cx.lineWidth = 3; cx.stroke();
        cx.strokeStyle = RIM; cx.lineWidth = 6;
        cx.beginPath(); cx.moveTo(-40, 22); cx.lineTo(-28, 34); cx.stroke();
        cx.strokeStyle = "#b9c0cc"; cx.lineWidth = 3.4; cx.stroke();
        cx.restore();
      }
      cx.restore();
    }
    cx.globalAlpha = 1;
    cx.restore();

    // planking clears whatever the crew occupies, so it never lands on a face
    if (bars) drawPlanks(bars, 26 + (bodies - 1) * 6 - bars * 7, hurt);

    // A Hollerer throws sound, so draw the sound.
    if (countOf(g, "hollerer") > 0) {
      const pulse = (S.t * 1.6) % 1;
      cx.strokeStyle = "rgba(154,127,196," + (0.55 * (1 - pulse)) + ")";
      cx.lineWidth = 3; cx.lineCap = "round";
      for (let i = 0; i < 3; i++) {
        const rr = 26 + pulse * 26 + i * 9;
        cx.beginPath(); cx.arc(6, -4, rr, -0.75, 0.75); cx.stroke();
      }
    }

    // The shared weapon sits in front of the whole crew — it is what they are for.
    if (cn === 2) {
      cx.strokeStyle = RIM; cx.lineWidth = 7; cx.lineCap = "round";
      cx.beginPath(); cx.arc(24, 2, 26, -1.15, 1.15); cx.stroke();
      cx.strokeStyle = "#8a6234"; cx.lineWidth = 4.5; cx.stroke();
      cx.strokeStyle = "#d9cdb4"; cx.lineWidth = 1.6;
      cx.beginPath(); cx.moveTo(35, -22); cx.lineTo(35, 26); cx.stroke();
    } else if (cn === 3) {
      cx.lineJoin = "round"; cx.strokeStyle = RIM; cx.lineWidth = 5;
      cx.fillStyle = "#6b4e2c";
      cx.beginPath(); cx.rect(4, -9, 44, 11); cx.stroke(); cx.fill();
      cx.fillStyle = "#9c7643";
      cx.beginPath(); cx.rect(0, -19, 12, 30); cx.stroke(); cx.fill();
      cx.strokeStyle = RIM; cx.lineWidth = 8; cx.lineCap = "round";
      cx.beginPath(); cx.moveTo(34, -28); cx.lineTo(34, 28); cx.stroke();
      cx.strokeStyle = "#8a6234"; cx.lineWidth = 5; cx.stroke();
      cx.strokeStyle = "#d9cdb4"; cx.lineWidth = 1.8;
      cx.beginPath(); cx.moveTo(34, -26); cx.lineTo(10, -4); cx.lineTo(34, 26); cx.stroke();
    }
    cx.restore();

    const mx = maxHpOf(g);
    if (g.hp < mx) {
      const w = 44, fr = clamp(g.hp / mx, 0, 1);
      cx.fillStyle = "rgba(0,0,0,.55)"; cx.fillRect(cxp - w / 2, p.y + CELL - 12, w, 4);
      cx.fillStyle = fr > 0.4 ? "#6fbf5b" : "#d1553f"; cx.fillRect(cxp - w / 2, p.y + CELL - 12, w * fr, 4);
    }
    if (g.parts.length > 1) {
      cx.font = "bold 10px " + FONT; cx.fillStyle = "#f5dc9c"; cx.textAlign = "center";
      cx.fillText(nameOf(g), cxp, p.y + CELL - 1);
    }

    // Dead ground under a Digger is the single most missable thing on the board, so it
    // gets an empty pan over its head and stops looking busy.
    if (countOf(g, "digger") > 0) {
      const vk = S.veins[g.col + "," + g.row];
      if (vk !== undefined && vk <= 0.08) {
        const bx = cxp, by = p.y + 13 + Math.sin(S.t * 2.2) * 2;
        cx.globalAlpha = 0.6 + Math.sin(S.t * 2.2) * 0.25;
        cx.strokeStyle = "#a89b8c"; cx.lineWidth = 2.4; cx.lineCap = "round";
        cx.beginPath(); cx.arc(bx, by, 7, 0.15, Math.PI - 0.15); cx.stroke();
        cx.beginPath(); cx.moveTo(bx + 7, by + 1); cx.lineTo(bx + 12, by - 4); cx.stroke();
        cx.strokeStyle = "#d1553f"; cx.lineWidth = 2.6;
        cx.beginPath(); cx.moveTo(bx - 9, by - 8); cx.lineTo(bx + 9, by + 8); cx.stroke();
        cx.globalAlpha = 1;
      }
    }
  }

  // A goblin on the road. Same body as on the grid but off its cell, jogging, and
  // carrying a health bar - because the point of the march is that you watch it not
  // always make it.
  function drawWalker(w) {
    const hop = Math.abs(Math.sin(w.step)) * 5;
    cx.save();
    cx.translate(w.x, w.y - hop);
    cx.fillStyle = "rgba(0,0,0,.34)";
    cx.beginPath(); cx.ellipse(0, 16 + hop, 15, 5, 0, 0, 6.284); cx.fill();
    cx.fillStyle = w.hurtT > 0 ? "#fff3cf" : tintOf({ parts: w.parts });
    cx.beginPath(); cx.ellipse(0, 0, 15, 16, 0, 0, 6.284); cx.fill();
    cx.strokeStyle = "rgba(232,192,90,.85)"; cx.lineWidth = 2;
    cx.beginPath(); cx.ellipse(0, 0, 16.5, 17.5, 0, 0, 6.284); cx.stroke();
    cx.fillStyle = "#1a1520";
    cx.beginPath(); cx.ellipse(-5, -3, 2.4, 2.8, 0, 0, 6.284); cx.fill();
    cx.beginPath(); cx.ellipse(5, -3, 2.4, 2.8, 0, 0, 6.284); cx.fill();
    // one pip per body it is carrying, so a three-part crew still reads as three
    for (let i = 0; i < w.parts.length; i++) {
      cx.fillStyle = "#e8c05a";
      cx.beginPath();
      cx.ellipse(-(w.parts.length - 1) * 4 + i * 8, -22, 2.6, 2.6, 0, 0, 6.284); cx.fill();
    }
    const fr = clamp(w.hp / w.maxHp, 0, 1);
    if (fr < 1) {
      cx.fillStyle = "rgba(0,0,0,.55)"; cx.fillRect(-16, 22, 32, 3.5);
      cx.fillStyle = fr < 0.35 ? "#d1553f" : "#6fbf5b"; cx.fillRect(-16, 22, 32 * fr, 3.5);
    }
    cx.restore();
  }

  function drawFoe(f) {
    const laneOf = f.laneF !== undefined ? f.laneF : f.lane;
    const y = OY + laneOf * CELL + CELL * 0.56;
    const hop = f.vault !== undefined ? -Math.sin(f.vault * Math.PI) * 44 : 0;
    const bob = Math.sin(f.bob) * (f.type === "scout" ? 3 : 2) + hop;
    if (f.slowT > 0) {
      cx.fillStyle = "rgba(154,127,196,.28)";
      cx.beginPath(); cx.ellipse(f.x, OY + laneOf * CELL + CELL * 0.78, 17, 5, 0, 0, 6.284); cx.fill();
    }
    const tint = f.type === "scout" ? "#8d8496" : f.type === "sergeant" ? "#b98a4e"
               : f.type === "leaper" ? "#a9c0d8" : f.type === "pavise" ? "#7e8a9c"
               : f.type === "runner" ? "#d8c9a0" : f.type === "reeve" ? "#8f4634" : "#c9ced8";
    const scale = (f.type === "scout" ? 0.9 : f.type === "sergeant" ? 1.16
                 : f.type === "leaper" ? 0.94 : f.type === "pavise" ? 1.1
                 : f.type === "runner" ? 0.8 : f.type === "reeve" ? 1.75 : 1) * K;
    const sq = f.squash > 0 ? ease(clamp(f.squash, 0, 1)) : 0;

    cx.fillStyle = "rgba(0,0,0,.3)";
    cx.beginPath(); cx.ellipse(f.x, y + 30 * K, 14 * scale, 4 * K, 0, 0, 6.284); cx.fill();

    cx.save();
    cx.translate(f.x, y + bob);
    cx.scale(scale * (1 + sq * 0.22), scale * (1 - sq * 0.2));
    // Scouts and Runners are lean, so their torso is narrow as well as small. Shape, not
    // size: a scaled-down copy of the same outline still reads as the same hero.
    const bw = f.type === "scout" ? 0.72 : f.type === "runner" ? 0.76 : 1;
    const paint = flat => {
      cx.fillStyle = flat || tint;
      cx.beginPath();
      cx.moveTo(-13 * bw, 26); cx.lineTo(-9 * bw, -8);
      cx.lineTo(9 * bw, -8); cx.lineTo(13 * bw, 26); cx.closePath(); cx.fill();
      if (f.bleeding) {
        cx.fillStyle = flat || "#9a8f84";
        cx.beginPath(); cx.arc(0, -13, 9, 0, 6.284); cx.fill();
        cx.fillStyle = flat || "#d1553f"; cx.fillRect(-7, -8, 14, 3);
      } else {
        cx.fillStyle = flat || tint;
        cx.beginPath(); cx.arc(0, -14, 12, Math.PI, 0); cx.fill();
        cx.fillRect(-12, -14, 24, 9);
        if (!flat) { cx.fillStyle = f.type === "scout" ? "#d1553f" : "#0e0c11"; cx.fillRect(-9, -12, 18, 4); }
      }
      cx.fillStyle = flat || "#5a5560";
      cx.fillRect(-9, 26, 6, 8 + Math.sin(f.bob) * 3);
      cx.fillRect(3, 26, 6, 8 - Math.sin(f.bob) * 3);
      if (f.type === "leaper" && !f.leapt) {
        cx.strokeStyle = flat || "#8a6234"; cx.lineWidth = 3.4; cx.lineCap = "round";
        cx.beginPath(); cx.moveTo(-14, -18); cx.lineTo(-2, 30); cx.stroke();
        cx.fillStyle = flat || "#d8c9a0";
        cx.beginPath(); cx.rect(-9, 2, 18, 5); cx.fill();
      }
      if (f.type === "runner" && !f.bleeding) {
        cx.fillStyle = flat || "#c2a45e";
        cx.beginPath(); cx.rect(-11, 2, 22, 4); cx.fill();
        // hair streaming back off a bare head: a wedge behind the skull, nothing on top
        cx.fillStyle = flat || "#8a7a55";
        cx.beginPath();
        cx.moveTo(6, -22); cx.lineTo(26, -15); cx.lineTo(24, -7); cx.lineTo(6, -10);
        cx.closePath(); cx.fill();
      }
      if (f.type === "squire" && !f.bleeding) {
        // a round shield on the near arm - the plainest hero needs an outline too, or it
        // is only "the one with nothing on it", which is not a silhouette
        cx.fillStyle = flat || "#6d6a76";
        cx.beginPath(); cx.arc(-16, 8, 11, 0, 6.284); cx.fill();
        cx.fillStyle = flat || "#3f3d47";
        cx.beginPath(); cx.arc(-16, 8, 4.2, 0, 6.284); cx.fill();
      }
      if (f.type === "scout" && !f.bleeding) {
        // a plume, twice the height of the head, leaning with the run
        cx.strokeStyle = flat || "#8a3f2f"; cx.lineWidth = 4; cx.lineCap = "round";
        cx.beginPath(); cx.moveTo(-1, -22); cx.quadraticCurveTo(9, -40, 20, -44); cx.stroke();
        cx.fillStyle = flat || "#d1553f";
        cx.beginPath(); cx.ellipse(21, -44, 6, 3.4, -0.4, 0, 6.284); cx.fill();
      }
      if (f.type === "pavise" && !f.bleeding) {
        cx.fillStyle = flat || "#5b6472";
        cx.beginPath(); cx.rect(-19, -14, 8, 38); cx.fill();
        cx.fillStyle = flat || "#8996a8";
        cx.beginPath(); cx.rect(-19, -14, 8, 8); cx.fill();
      }
      if (f.type === "sergeant" && !f.bleeding) {
        // pauldrons: a wide flat shelf across the shoulders, so the top of the shape is
        // square where every other hero's is round
        cx.fillStyle = flat || "#8a6234";
        cx.beginPath(); cx.rect(-21, -9, 42, 10); cx.fill();
        cx.fillStyle = flat || "#d3a468";
        cx.beginPath(); cx.rect(-21, -9, 42, 3); cx.fill();
        cx.fillStyle = flat || "#8a6234";
        cx.beginPath(); cx.moveTo(-10, -4); cx.lineTo(10, -4); cx.lineTo(8, 16); cx.lineTo(-8, 16); cx.closePath(); cx.fill();
        cx.fillStyle = flat || "#d3a468"; cx.fillRect(-10, -4, 20, 3);
      }
    };
    paint(null);
    if (f.hitT > 0.05) { cx.globalAlpha = clamp((f.hitT - 0.05) * 12, 0, 0.9); paint("#fffdf4"); cx.globalAlpha = 1; }
    cx.restore();

    const fr = clamp(f.hp / f.maxHp, 0, 1);
    if (fr < 1) {
      cx.fillStyle = "rgba(0,0,0,.55)"; cx.fillRect(f.x - 16, y + 32 * K, 32, 3.5);
      cx.fillStyle = "#d1553f"; cx.fillRect(f.x - 16, y + 32 * K, 32 * fr, 3.5);
    }
  }

  const FONT = "'Trebuchet MS', sans-serif";

  function render() {
    cx.clearRect(0, 0, W, H);
    cx.fillStyle = "#141119"; cx.fillRect(0, 0, W, H);
    cx.save();
    if (S.shake > 0.1) {
      const a = Math.random() * 6.283;
      cx.translate(Math.cos(a) * S.shake, Math.sin(a) * S.shake);
    }

    for (let r = 0; r < ROWS; r++) {
      cx.fillStyle = r % 2 ? "#241f26" : "#2a2430";
      cx.fillRect(OX, OY + r * CELL, COLS * CELL, CELL);
    }
    // Gold seamed through the rock, thickening toward the far end. Nothing says
    // "deeper pays more" — you can see it in the ground before you place anything.
    const rot = world().dig < 1;
    for (let c = 0; c < COLS; c++) {
      const depth = c / (COLS - 1);
      const warm = (0.012 + depth * 0.055) * (rot ? 0.25 : 1);
      for (let r = 0; r < ROWS; r++) {
        const lv = S.veins[c + "," + r];
        const dug = lv === undefined ? 1 : lv;
        cx.fillStyle = rot ? "rgba(150,150,160," + warm * dug + ")"
                           : "rgba(232,192,90," + warm * dug + ")";
        cx.fillRect(OX + c * CELL, OY + r * CELL, CELL, CELL);
      }
      const n = Math.round(depth * depth * 9);
      for (let r = 0; r < ROWS; r++) {
        const leftV = S.veins[c + "," + r];
        const dug = leftV === undefined ? 1 : leftV;
        const shown = Math.round(n * dug);
        if (dug <= 0.1) {
          // spent ground: a dark hatch you can read at any column
          cx.save();
          cx.beginPath(); cx.rect(OX + c * CELL, OY + r * CELL, CELL, CELL); cx.clip();
          cx.strokeStyle = "rgba(120,112,130,.28)"; cx.lineWidth = 2;
          for (let k = -CELL; k < CELL; k += 11) {
            cx.beginPath();
            cx.moveTo(OX + c * CELL + k, OY + r * CELL);
            cx.lineTo(OX + c * CELL + k + CELL, OY + r * CELL + CELL);
            cx.stroke();
          }
          cx.restore();
        }
        for (let i = 0; i < shown; i++) {
          const a = ((i * 2.399 + c * 1.7 + r * 0.31) % 1);
          const b = ((i * 4.771 + r * 2.3 + c * 0.53) % 1);
          const px = OX + c * CELL + 6 + a * (CELL - 12);
          const py = OY + r * CELL + 6 + b * (CELL - 12);
          const sz = 1 + depth * 2.4;
          cx.fillStyle = rot ? "rgba(120,116,126," + (0.22 + depth * 0.3) + ")"
                             : "rgba(201,162,74," + (0.3 + depth * 0.45) + ")";
          cx.beginPath(); cx.ellipse(px, py, sz, sz * 0.72, a * 3, 0, 6.284); cx.fill();
          if (depth > 0.55 && !rot) {
            cx.fillStyle = "rgba(255,244,206,.5)";
            cx.beginPath(); cx.arc(px - sz * 0.3, py - sz * 0.3, sz * 0.34, 0, 6.284); cx.fill();
          }
        }
      }
    }
    // Lanes that have not opened yet are packed rubble. They are drawn over the seams,
    // so a closed lane reads as "no gold here, nothing walks here" at a glance.
    for (let r = 0; r < ROWS; r++) {
      const shut = 1 - S.laneReveal[r];
      if (shut <= 0.001) continue;
      const y = OY + r * CELL;
      cx.save();
      cx.beginPath(); cx.rect(OX, y, COLS * CELL, CELL); cx.clip();
      cx.fillStyle = "rgba(16,13,20," + (0.9 * shut) + ")";
      cx.fillRect(OX, y, COLS * CELL, CELL);
      cx.globalAlpha = shut;
      for (let i = 0; i < 46; i++) {
        const a = (i * 2.399 + r * 1.13) % 1, b2 = (i * 4.771 + r * 0.61) % 1;
        const px = OX + a * COLS * CELL, py = y + 6 + b2 * (CELL - 12);
        const sz = 3 + ((i * 7) % 5);
        cx.fillStyle = i % 3 ? "#39323f" : "#453d4c";
        cx.beginPath();
        cx.moveTo(px, py - sz); cx.lineTo(px + sz, py); cx.lineTo(px, py + sz * 0.8);
        cx.lineTo(px - sz * 0.9, py + sz * 0.2); cx.closePath(); cx.fill();
      }
      cx.restore();
    }

    // Water standing in the far columns. Drawn under the goblins so it reads as ground
    // rather than as a veil, and it moves, because still ground looks placeable.
    for (let c = 0; c < COLS; c++) {
      if (!isFlooded(c)) continue;
      const x = OX + c * CELL;
      cx.save();
      cx.beginPath(); cx.rect(x, OY, CELL, ROWS * CELL); cx.clip();
      cx.fillStyle = "rgba(28,52,68,.82)"; cx.fillRect(x, OY, CELL, ROWS * CELL);
      for (let i = 0; i < 34; i++) {
        const a = (i * 2.399 + c * 1.13) % 1, b2 = (i * 4.771 + c * 0.61) % 1;
        const py = OY + b2 * ROWS * CELL;
        const px = x + ((a * CELL + Math.sin(S.t * 0.7 + i) * 9) % CELL + CELL) % CELL;
        cx.fillStyle = i % 3 ? "rgba(111,168,201,.30)" : "rgba(160,205,228,.22)";
        cx.fillRect(px, py, 11 + (i % 4) * 5, 1.6);
      }
      cx.strokeStyle = "rgba(111,168,201,.45)"; cx.lineWidth = 1.5;
      cx.strokeRect(x + 0.75, OY + 0.75, CELL - 1.5, ROWS * CELL - 1.5);
      cx.restore();
    }

    // Ground that has already gone. It must not look like the Scree's rubble, because
    // rubble clears and this never does: a hole with nothing in it, not a heap.
    for (const k in S.collapsed) {
      const [cc, rr] = k.split(",").map(Number);
      const x = OX + cc * CELL, y = OY + rr * CELL;
      cx.save();
      cx.beginPath(); cx.rect(x, y, CELL, CELL); cx.clip();
      cx.fillStyle = "#08070b"; cx.fillRect(x, y, CELL, CELL);
      cx.strokeStyle = "rgba(70,62,80,.75)"; cx.lineWidth = 2;
      cx.beginPath();
      cx.moveTo(x + 4, y + 12); cx.lineTo(x + 26, y + 30); cx.lineTo(x + 18, y + 54);
      cx.lineTo(x + 44, y + 78); cx.lineTo(x + 74, y + 62); cx.lineTo(x + CELL - 4, y + 84);
      cx.stroke();
      cx.fillStyle = "rgba(120,110,132,.5)";
      for (let i = 0; i < 5; i++) {
        const a = (i * 2.399 + cc) % 1, b2 = (i * 4.771 + rr) % 1;
        cx.fillRect(x + 8 + a * (CELL - 20), y + 8 + b2 * (CELL - 20), 3, 2);
      }
      cx.restore();
    }

    // Ground that goes at the end of THIS chamber. Shown the whole time, because a
    // collapse you were warned about is a decision and one you were not is a tax.
    for (const k in S.cracking) {
      const [cc, rr] = k.split(",").map(Number);
      if (S.collapsed[k]) continue;
      const x = OX + cc * CELL, y = OY + rr * CELL;
      const pulse = 0.5 + Math.sin(S.t * 2.1 + cc * 0.8 + rr) * 0.5;
      cx.save();
      cx.beginPath(); cx.rect(x, y, CELL, CELL); cx.clip();
      cx.fillStyle = "rgba(90,40,30," + (0.1 + pulse * 0.12) + ")";
      cx.fillRect(x, y, CELL, CELL);
      cx.strokeStyle = "rgba(209,85,63," + (0.45 + pulse * 0.35) + ")";
      cx.lineWidth = 2; cx.setLineDash([7, 5]); cx.lineDashOffset = -S.t * 14;
      cx.strokeRect(x + 3, y + 3, CELL - 6, CELL - 6);
      cx.setLineDash([]);
      cx.strokeStyle = "rgba(209,85,63," + (0.3 + pulse * 0.3) + ")";
      cx.lineWidth = 1.6;
      cx.beginPath();
      cx.moveTo(x + 10, y + 20); cx.lineTo(x + 34, y + 42);
      cx.lineTo(x + 26, y + 66); cx.lineTo(x + 58, y + 80);
      cx.stroke();
      cx.restore();
    }

    // Rubble from a rockfall. Same visual language as a caved-in lane, one cell wide.
    for (const k in S.buried) {
      const [bc, br] = k.split(",").map(Number);
      const x = OX + bc * CELL, y = OY + br * CELL;
      cx.save();
      cx.beginPath(); cx.rect(x, y, CELL, CELL); cx.clip();
      cx.fillStyle = "rgba(16,13,20,.86)"; cx.fillRect(x, y, CELL, CELL);
      for (let i = 0; i < 16; i++) {
        const a = (i * 2.399 + bc * 1.13 + br * 0.7) % 1, b2 = (i * 4.771 + br * 0.61) % 1;
        const px = x + 6 + a * (CELL - 12), py = y + 6 + b2 * (CELL - 12);
        const sz = 3.5 + ((i * 7) % 5);
        cx.fillStyle = i % 3 ? "#39323f" : "#4b4252";
        cx.beginPath();
        cx.moveTo(px, py - sz); cx.lineTo(px + sz, py); cx.lineTo(px, py + sz * 0.8);
        cx.lineTo(px - sz * 0.9, py + sz * 0.2); cx.closePath(); cx.fill();
      }
      const left = S.buried[k] / RUBBLE_LIFE;
      cx.fillStyle = "rgba(232,192,90,.5)";
      cx.fillRect(x + 8, y + CELL - 9, (CELL - 16) * clamp(left, 0, 1), 2.5);
      cx.restore();
    }

    // A lane that has just opened glows until it is live, so "new ground" and "heroes
    // are coming down here now" are two visibly different moments.
    for (let r = 0; r < ROWS; r++) {
      if (!S.laneFlash || S.laneFlash[r] <= 0) continue;
      const k = Math.min(1, S.laneFlash[r] / 2.6);
      const y = OY + r * CELL;
      const pulse = 0.25 + Math.abs(Math.sin(S.t * 5)) * 0.35;
      cx.fillStyle = "rgba(232,192,90," + (pulse * k * 0.5) + ")";
      cx.fillRect(OX, y, COLS * CELL, CELL);
      cx.strokeStyle = "rgba(232,192,90," + (0.5 + pulse * 0.5) * k + ")";
      cx.lineWidth = 3;
      cx.strokeRect(OX + 1.5, y + 1.5, COLS * CELL - 3, CELL - 3);
    }

    cx.strokeStyle = "rgba(0,0,0,.35)"; cx.lineWidth = 1;
    for (let c = 0; c <= COLS; c++) {
      cx.beginPath(); cx.moveTo(OX + c * CELL, OY); cx.lineTo(OX + c * CELL, OY + ROWS * CELL); cx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      cx.beginPath(); cx.moveTo(OX, OY + r * CELL); cx.lineTo(OX + COLS * CELL, OY + r * CELL); cx.stroke();
    }

    // Whatever is in your hand - a card from the rack or a goblin already standing on the
    // board - the bodies that will take it are marked the same way. Two indicators for one
    // idea taught players there were two different rules.
    if (!S.over) {
      const held = S.selGob ? S.selGob.parts.length
                 : (S.selUnit && S.coins >= costOf(S.selUnit) && S.cool[S.selUnit] <= 0) ? 1
                 : 0;
      if (held) {
        for (const g of S.goblins) {
          if (g === S.selGob || g.parts.length + held > MAX_PARTS) continue;
          // Out of step, so a full board reads as a scatter of hints rather than one throb.
          drawFuseSlot(cellOf(g), 0.5 + Math.sin(S.t * 3.1 + g.col * 0.7 + g.row * 1.3) * 0.5);
        }
      }
    }

    if ((S.selUnit || S.selGob) && hover.col >= 0 && !S.over) {
      // The hovered cell answers the same question for both hands: does what I am holding
      // go here, and what does it turn into.
      const carry = S.selGob ? S.selGob.parts : [S.selUnit];
      const on = gobAt(hover.col, hover.row);
      // An occupied cell is a legal target - that is where fusions come from - so it only
      // reads red when the body standing there has no room. A goblin lifted off the board
      // has nowhere to go but into another goblin, so bare ground is red for it.
      const ok = laneIsOpen(hover.row) && !blocked(hover.col, hover.row)
                 && (on ? on !== S.selGob && on.parts.length + carry.length <= MAX_PARTS
                        : !S.selGob)
                 && (S.selGob || (S.coins >= costOf(S.selUnit) && S.cool[S.selUnit] <= 0));
      cx.fillStyle = ok ? "rgba(111,191,91,.2)" : "rgba(209,85,63,.2)";
      cx.fillRect(OX + hover.col * CELL, OY + hover.row * CELL, CELL, CELL);
      cx.strokeStyle = ok ? "rgba(111,191,91,.75)" : "rgba(209,85,63,.75)";
      cx.lineWidth = 2;
      cx.strokeRect(OX + hover.col * CELL + 2, OY + hover.row * CELL + 2, CELL - 4, CELL - 4);
      // Hovering a body you can fuse names the creature you would get, so the trade is
      // legible before you commit to it.
      if (ok && on) {
        const would = nameOf({ parts: on.parts.concat(carry) }).toUpperCase();
        const tx = OX + hover.col * CELL + CELL / 2, ty = OY + hover.row * CELL - 5;
        cx.font = "bold 11px " + FONT; cx.textAlign = "center";
        const tw = cx.measureText(would).width + 10;
        cx.fillStyle = "rgba(11,9,16,.82)";
        cx.fillRect(tx - tw / 2, ty - 11, tw, 14);
        cx.fillStyle = "#f5dc9c";
        cx.fillText(would, tx, ty);
      }
      if (S.selUnit === "digger") {
        // worth shown as coins, not digits
        const pips = Math.max(1, Math.round(yieldAt(hover.col) / RICH_MAX() * 5));
        const bx = OX + hover.col * CELL + CELL / 2, by = OY + hover.row * CELL + CELL - 12;
        for (let i = 0; i < pips; i++) {
          const px = bx - (pips - 1) * 5 + i * 10;
          cx.fillStyle = "#8a7134";
          cx.beginPath(); cx.ellipse(px, by, 4.2, 4.6, 0, 0, 6.284); cx.fill();
          cx.fillStyle = "#e8c05a";
          cx.beginPath(); cx.ellipse(px, by - 0.6, 3.2, 3.6, 0, 0, 6.284); cx.fill();
        }
      }
    }

    // caravan
    const baseY = H - 14;
    const grd = cx.createRadialGradient(44, baseY - 40, 4, 44, baseY - 40, 180);
    grd.addColorStop(0, "rgba(232,192,90,.2)"); grd.addColorStop(1, "transparent");
    cx.fillStyle = grd; cx.fillRect(0, 0, 240, H);
    cx.fillStyle = "#1b1720"; cx.fillRect(0, OY, OX, ROWS * CELL);
    cx.fillStyle = "#8a7134";
    cx.beginPath(); cx.moveTo(-10, baseY);
    cx.quadraticCurveTo(OX * 0.5, baseY - 190, OX + 12, baseY); cx.closePath(); cx.fill();
    cx.fillStyle = "#e8c05a";
    for (let i = 0; i < 24; i++) {
      const a = (i * 2.399) % 1, b = (i * 4.771) % 1;
      const px = 6 + a * (OX - 6);
      const py = baseY - b * 190 * (1 - Math.abs(px / OX - 0.5)) * 0.9;
      cx.beginPath(); cx.ellipse(px, py, 5, 3, 0.3, 0, 6.284); cx.fill();
    }
    cx.font = "10px " + FONT; cx.fillStyle = "#8a7134"; cx.textAlign = "center";
    cx.fillText("THE CARAVAN", OX / 2, OY - 12);
    if (S.cart > 0) {
      for (let i = 0; i < 3; i++) {
        cx.beginPath(); cx.arc(OX / 2 - 16 + i * 16, OY - 26, 5, 0, 6.284);
        cx.fillStyle = i < S.cart ? "#e8c05a" : "rgba(120,110,130,.35)";
        cx.fill();
      }
    }

    for (let r = 0; r < ROWS; r++) {
      const yy = laneY(r) + CELL * 0.66;
      // A caved-in lane has no last line of defence to show yet. Skip before touching
      // globalAlpha — bailing out with it still set leaks a transparent canvas onto
      // everything drawn after this loop.
      const a = (S.traps[r] ? 1 : 0.13) * S.laneReveal[r];
      if (a < 0.02) continue;
      cx.globalAlpha = a;
      cx.strokeStyle = "#8f8698"; cx.lineWidth = 2.2;
      cx.beginPath(); cx.arc(OX + 20, yy, 11, Math.PI, 0); cx.stroke();
      cx.beginPath();
      for (let i = 0; i <= 4; i++) {
        const tx = OX + 20 - 11 + i * 5.5;
        cx.moveTo(tx, yy - 1); cx.lineTo(tx + 2.7, yy - 7); cx.lineTo(tx + 5.5, yy - 1);
      }
      cx.stroke();
      cx.globalAlpha = 1;
    }

    S.goblins.forEach(drawGoblin);

    for (const s of S.shots) {
      s.trail.forEach((t, i) => {
        cx.globalAlpha = (i / s.trail.length) * 0.4;
        cx.fillStyle = "#a89b8c";
        cx.beginPath(); cx.arc(t.x, t.y, 1.6 + i * 0.4, 0, 6.284); cx.fill();
      });
      cx.globalAlpha = 1;
      cx.save(); cx.translate(s.x, s.y);
      if (s.kind === "bomb") {
        cx.rotate(s.spin);
        cx.fillStyle = "#2b2530";
        cx.beginPath(); cx.arc(0, 0, 6.5, 0, 6.284); cx.fill();
        cx.strokeStyle = "#6b5f4a"; cx.lineWidth = 2; cx.lineCap = "round";
        cx.beginPath(); cx.moveTo(4, -5); cx.lineTo(9, -10); cx.stroke();
        cx.fillStyle = "#e8c05a";
        cx.beginPath(); cx.arc(10, -11, 2.4 + Math.sin(S.t * 30) * 0.9, 0, 6.284); cx.fill();
        cx.fillStyle = "rgba(255,244,214,.5)";
        cx.beginPath(); cx.arc(-2, -2.4, 2, 0, 6.284); cx.fill();
      } else if (s.kind === "rock") {
        cx.rotate(s.spin);
        cx.fillStyle = "#c2b39c";
        cx.beginPath(); cx.moveTo(-5, -3.5); cx.lineTo(4, -5); cx.lineTo(6, 2.5); cx.lineTo(-2.5, 5); cx.closePath(); cx.fill();
      } else if (s.kind === "arrow") {
        cx.fillStyle = "#8a6234"; cx.fillRect(-14, -1.4, 22, 2.8);
        cx.fillStyle = "#e6dfd4";
        cx.beginPath(); cx.moveTo(8, -5); cx.lineTo(17, 0); cx.lineTo(8, 5); cx.closePath(); cx.fill();
        cx.fillStyle = "#c9a24a"; cx.fillRect(-15, -4, 5, 8);
      } else {
        cx.fillStyle = "#6b4e2c"; cx.fillRect(-22, -2.6, 34, 5.2);
        cx.fillStyle = "#f0e6cf";
        cx.beginPath(); cx.moveTo(12, -8); cx.lineTo(26, 0); cx.lineTo(12, 8); cx.closePath(); cx.fill();
        cx.fillStyle = "rgba(232,192,90,.35)";
        cx.beginPath(); cx.ellipse(-16, 0, 16, 5, 0, 0, 6.284); cx.fill();
      }
      cx.restore();
    }

    S.foes.forEach(drawFoe);
    S.walkers.forEach(drawWalker);

    for (const p of S.parts) {
      cx.globalAlpha = clamp(p.life * 2.6, 0, 1);
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r);
      cx.restore();
    }
    cx.globalAlpha = 1;

    for (const c of S.loot) {
      const w = Math.max(2, Math.abs(Math.cos(c.spin)) * 6);
      cx.fillStyle = "#8a7134";
      cx.beginPath(); cx.ellipse(c.x, c.y, w + 1.4, 7.4, 0, 0, 6.284); cx.fill();
      cx.fillStyle = "#e8c05a";
      cx.beginPath(); cx.ellipse(c.x, c.y - 0.6, w, 6, 0, 0, 6.284); cx.fill();
      cx.fillStyle = "rgba(255,250,228,.8)";
      cx.beginPath(); cx.arc(c.x - w * 0.3, c.y - 2, 1.4, 0, 6.284); cx.fill();
    }

    for (const r of S.rings) {
      const k = r.t / r.life;
      cx.globalAlpha = 1 - k;
      cx.strokeStyle = r.c; cx.lineWidth = r.w * (1 - k * 0.6);
      cx.beginPath(); cx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * ease(k), 0, 6.284); cx.stroke();
      cx.globalAlpha = 1;
    }
    for (const p of S.pops) {
      const k = p.t / p.life;
      cx.globalAlpha = 1 - k * k;
      cx.font = "bold 14px " + FONT; cx.fillStyle = p.c; cx.textAlign = "center";
      cx.fillText(p.text, p.x, p.y - ease(k) * 34);
      cx.globalAlpha = 1;
    }
    cx.restore();

    if (S.flash > 0.01) { cx.fillStyle = "rgba(255,244,214," + S.flash * 0.5 + ")"; cx.fillRect(0, 0, W, H); }

    cx.textAlign = "center";
    if (S.banner > 0 && !S.over) {
      const k = 1 - S.banner / 2.1;
      const inK = clamp(k / 0.14, 0, 1), outK = clamp((k - 0.75) / 0.25, 0, 1);
      cx.globalAlpha = (1 - outK) * (0.35 + ease(inK) * 0.65);
      cx.font = (26 + (1 - ease(inK)) * 20).toFixed(0) + "px Impact, sans-serif";
      cx.fillStyle = "#e8c05a";
      cx.fillText(S.bannerText, W / 2, OY - 14 + (1 - ease(inK)) * -22);
      cx.globalAlpha = 1;
    }
    if (S.over) {
      cx.fillStyle = "rgba(11,9,16,.86)"; cx.fillRect(0, 0, W, H);
      cx.font = "48px Impact, sans-serif";
      cx.fillStyle = S.won ? "#e8c05a" : "#d1553f";
      cx.fillText(S.won ? "THE SEAM IS OURS" : "THEY REACHED THE CARAVAN", W / 2, H / 2 - 14);
      cx.font = "17px " + FONT; cx.fillStyle = "#e6dfd4";
      cx.fillText(S.won
        ? S.killed + " left in the dirt, " + Math.round(S.mined) + " gold cut out of the rock."
        : "Wave " + (S.waveIx + 1) + " of " + CHAMBER_WAVES.length + ".", W / 2, H / 2 + 18);
      cx.fillStyle = "#9a9089"; cx.font = "13px " + FONT;
      cx.fillText("Click anywhere for a fresh chamber.", W / 2, H / 2 + 46);
    }
    if (S.paused && !S.over) {
      cx.fillStyle = "rgba(11,9,16,.7)"; cx.fillRect(0, 0, W, H);
      cx.font = "40px Impact, sans-serif"; cx.fillStyle = "#e8c05a";
      cx.fillText("PAUSED", W / 2, H / 2);
    }
  }

  // ===================================================================== input
  const hover = { col: -1, row: -1 };
  const toBoard = ev => {
    const r = cv.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
  };
  cv.addEventListener("mousemove", ev => {
    const p = toBoard(ev);
    const c = Math.floor((p.x - OX) / CELL), r = Math.floor((p.y - OY) / CELL);
    const inside = c >= 0 && c < COLS && r >= 0 && r < ROWS;
    hover.col = inside ? c : -1; hover.row = inside ? r : -1;
  });
  cv.addEventListener("mouseleave", () => { hover.col = -1; hover.row = -1; });
  cv.addEventListener("contextmenu", ev => { ev.preventDefault(); clearSel(); });

  // One routine for both input styles. Returns true if something happened.
  function tryPlace(key, col, row) {
    const u = UNITS[key];
    if (!u) return false;
    const occ = gobAt(col, row);
    if (!laneIsOpen(row)) {
      Sound.play("deny");
      popText(OX + col * CELL + CELL / 2, OY + row * CELL + 12, "STILL CAVED IN", "#8a8095");
      burst(OX + col * CELL + CELL / 2, OY + row * CELL + CELL / 2, 8,
            { colors: ["#4a4150", "#3b3340"], spread: 150, size: [1.4, 3], life: [0.2, 0.4] });
      return false;
    }
    if (S.collapsed[col + "," + row]) {
      Sound.play("deny");
      popText(OX + col * CELL + CELL / 2, OY + row * CELL + 12, "THE FLOOR IS GONE", "#8a8095");
      return false;
    }
    if (S.buried[col + "," + row]) {
      Sound.play("deny");
      popText(OX + col * CELL + CELL / 2, OY + row * CELL + 12, "UNDER RUBBLE", "#8a8095");
      return false;
    }
    if (isFlooded(col)) {
      Sound.play("deny");
      popText(OX + col * CELL + CELL / 2, OY + row * CELL + 12, "WATERLOGGED", "#6fa8c9");
      burst(OX + col * CELL + CELL / 2, OY + row * CELL + CELL / 2, 8,
            { colors: ["#4a7a94", "#6fa8c9"], spread: 150, size: [1.4, 3], life: [0.2, 0.45] });
      return false;
    }
    if (S.cool[key] > 0) { Sound.play("deny"); denyCard(key); return false; }
    if (S.coins < costOf(key)) { Sound.play("deny"); denyCard(key); return false; }

    // Dropping a goblin onto a goblin fuses them, which is the only way to reach
    // anything past the three you can buy.
    if (occ) {
      if (occ.parts.length >= MAX_PARTS) {
        Sound.play("deny");
        popText(OX + col * CELL + CELL / 2, OY + row * CELL + 12, "NO ROOM IN THERE", "#d1553f");
        return false;
      }
      S.coins -= costOf(key);
      occ.parts.push(key);
      occ.hp = maxHpOf(occ); occ.squash = 1.4; occ.born = S.t;
      const gp = cellOf(occ);
      burst(gp.x + CELL / 2, gp.y + CELL / 2, 24,
            { colors: ["#fff3cf", "#e8c05a", tintOf(occ)], spread: 320, size: [1.8, 4.6] });
      ring(gp.x + CELL / 2, gp.y + CELL / 2, 96, "rgba(255,243,207,.85)", 4, 0.4);
      popText(gp.x + CELL / 2, gp.y + 4, nameOf(occ).toUpperCase(), "#fff3cf");
      kick(9); stop(0.08); flash(0.24); Sound.play("merge");
      noteBody(occ);
      S.cool[key] = rechargeOf(key);
      S.selUnit = null; renderRack();
      renderInspector();
      return true;
    }

    S.coins -= costOf(key);
    // hp has to come from maxHpOf, not the raw stat, or an upgraded body spawns hurt
    const born = { id: ++GID, parts: [key], col, row, hp: 0, born: S.t, age: 0,
                     cd: 0.5, dcd: 1.2,
                     squash: 0, land: 1, recoil: 0, hurtT: 0, wind: 0 };
    born.hp = maxHpOf(born);
    S.goblins.push(born);
    noteBody(born);
    const gx = OX + col * CELL + CELL / 2, gy = OY + row * CELL + CELL * 0.6;
    burst(gx, gy + 18, 10, { colors: ["#4a4150", "#3b3340", "#5a5060"], spread: 180,
                             size: [1.4, 3.4], gravity: 520, life: [0.18, 0.4] });
    ring(gx, gy + 16, 40, "rgba(160,150,170,.4)", 2.2, 0.26);
    kick(3); stop(0.02); Sound.play("place");
    S.cool[key] = rechargeOf(key);
    S.selUnit = null; renderRack();
    return true;
  }

  // Carrying one goblin into another. Costs nothing — you already paid for both — and
  // it is the only way to recover a Digger whose pocket has run dry.
  // Merging two bodies already on the board is a march, not a teleport. The goblin
  // leaves its cell and walks the lanes to the one it is joining, and anything whose
  // lane it crosses gets a swing at it on the road. Recycling a worked-out Digger from
  // column 6 is therefore a decision about the map rather than a free tidy-up.
  const WALK_SPEED = 118;
  function fuseInPlace(src, dst) {
    if (src.parts.length + dst.parts.length > MAX_PARTS) {
      Sound.play("deny");
      popText(OX + dst.col * CELL + CELL / 2, OY + dst.row * CELL + 12,
              "NO ROOM IN THERE", "#d1553f");
      return false;
    }
    if (!laneIsOpen(dst.row) || blocked(dst.col, dst.row)) { Sound.play("deny"); return false; }
    const from = cellOf(src);
    S.goblins = S.goblins.filter(g => g !== src);
    S.marches++;
    S.walkers.push({ parts: src.parts.slice(), hp: src.hp, maxHp: maxHpOf(src),
                     age: src.age || 0, spent: spentOn(src),
                     x: from.x + CELL / 2, y: from.y + CELL * 0.55,
                     toId: dst.id, step: 0, hurtT: 0 });
    const gp = cellOf(dst);
    ring(from.x + CELL / 2, from.y + CELL / 2, 60, "rgba(232,192,90,.6)", 3, 0.3);
    ring(gp.x + CELL / 2, gp.y + CELL / 2, 70, "rgba(232,192,90,.5)", 2.5, 0.45);
    Sound.play("place");
    S.selGob = null;
    renderInspector();
    return true;
  }

  // The road. A walker is off the grid, so it does not shoot, does not dig and nothing
  // stands behind it - it is a body crossing open ground and that is the whole point.
  function stepWalkers(dt) {
    for (const w of S.walkers) {
      if (w.hurtT > 0) w.hurtT -= dt;
      const dst = S.goblins.find(g => g.id === w.toId && g.hp > 0);
      if (!dst) {                        // its destination died while it was on the way
        w.stranded = (w.stranded || 0) + dt;
        if (w.stranded > 0.35) { landWalker(w); w.gone = true; }
        continue;
      }
      const gp = cellOf(dst);
      const tx = gp.x + CELL / 2, ty = gp.y + CELL * 0.55;
      const dx = tx - w.x, dy = ty - w.y, d = Math.hypot(dx, dy);
      w.step += dt * 9;
      if (d > 3) { w.x += dx / d * WALK_SPEED * dt; w.y += dy / d * WALK_SPEED * dt; }
      const lane = Math.floor((w.y - OY) / CELL);
      for (const f of S.foes) {
        if (f.hp <= 0 || f.lane !== lane) continue;
        if (Math.abs(f.x - w.x) > CELL * 0.55) continue;
        w.hp -= FOES[f.type].dps * dt;
        w.hurtT = 0.14;
        if (Math.random() < dt * 6)
          burst(w.x, w.y, 2, { colors: ["#d1553f", "#e8c05a"], spread: 110,
                               size: [1.2, 2.4], life: [0.12, 0.3] });
      }
      if (w.hp <= 0) {
        popText(w.x, w.y - 8, "LOST ON THE ROAD", "#d1553f");
        burst(w.x, w.y, 16, { colors: ["#d1553f", "#8b93a2", "#4a4150"], spread: 260 });
        Sound.play("kill"); kick(4);
        w.gone = true;
        continue;
      }
      if (d <= 3) { arrive(w, dst); w.gone = true; }
    }
    S.walkers = S.walkers.filter(w => !w.gone);
  }

  // Its destination died under it. There is no wagon to climb back into here, so it digs
  // in where it stands rather than evaporating - the nearest open cell to the spot it
  // reached. Losing the goblin you were merging into should not lose you both.
  function landWalker(w) {
    const lane = clamp(Math.floor((w.y - OY) / CELL), 0, ROWS - 1);
    const col = clamp(Math.round((w.x - OX - CELL / 2) / CELL), 0, COLS - 1);
    let best = null;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!laneIsOpen(r) || blocked(c, r) || gobAt(c, r)) continue;
      const d = Math.abs(c - col) + Math.abs(r - lane) * 1.5;
      if (!best || d < best.d) best = { c, r, d };
    }
    if (!best) {                        // nowhere at all to stand: pay it out instead
      const back = Math.round(w.spent * 0.5);
      S.coins += back;
      popText(w.x, w.y - 6, "+" + back, "#e8c05a");
      bumpCoins();
      return;
    }
    const g = { id: ++GID, parts: w.parts.slice(), col: best.c, row: best.r, hp: 0,
                born: S.t, age: w.age, cd: 0.5, dcd: 1.2, squash: 1.2, land: 1,
                recoil: 0, hurtT: 0, wind: 0 };
    g.hp = clamp(w.hp, 12, maxHpOf(g));
    S.goblins.push(g);
    const gp = cellOf(g);
    noteBody(g);
    popText(gp.x + CELL / 2, gp.y + 4, "DUG IN", "#e8c05a");
    ring(gp.x + CELL / 2, gp.y + CELL / 2, 54, "rgba(232,192,90,.6)", 2.5, 0.34);
    Sound.play("place");
  }

  function arrive(w, dst) {
    const keptFrac = clamp(w.hp / w.maxHp, 0.2, 1);
    for (const t of w.parts) dst.parts.push(t);
    // the one that walked over arrives as hurt as it was
    dst.hp = Math.max(dst.hp, maxHpOf(dst) * Math.min(1, (dst.hp / maxHpOf(dst) + keptFrac) / 2));
    dst.hp = clamp(dst.hp, 12, maxHpOf(dst));
    dst.squash = 1.4; dst.born = S.t;
    const gp = cellOf(dst);
    burst(gp.x + CELL / 2, gp.y + CELL / 2, 22,
          { colors: ["#fff3cf", "#e8c05a", tintOf(dst)], spread: 300, size: [1.8, 4.4] });
    ring(gp.x + CELL / 2, gp.y + CELL / 2, 92, "rgba(255,243,207,.8)", 4, 0.4);
    popText(gp.x + CELL / 2, gp.y + 4, nameOf(dst).toUpperCase(), "#fff3cf");
    kick(8); stop(0.07); Sound.play("merge");
    noteBody(dst);
    renderInspector();
  }

  // Dig one up. Free for a moment in case of a misclick, then half back.
  // Digging one up buys back the tile and nothing else. It used to refund half its cost,
  // which made a full board a reversible decision and took the weight out of placing.
  const GRACE = 3;
  function refundOf(g) {
    return (S.t - g.born <= GRACE) ? spentOn(g) : 0;   // a moment's grace for a misclick
  }
  function removeGoblin(g) {
    const back = refundOf(g), gp = cellOf(g);
    S.coins += back;
    S.goblins = S.goblins.filter(x => x !== g);
    if (S.selGob === g) S.selGob = null;
    popText(gp.x + CELL / 2, gp.y + 10, "+" + back, "#e8c05a");
    burst(gp.x + CELL / 2, gp.y + CELL * 0.6, 10,
          { colors: ["#4a4150", "#c9a24a"], spread: 170, size: [1.4, 3], life: [0.2, 0.45] });
    Sound.play("dig");
    bumpCoins();
  }

  cv.addEventListener("click", ev => {
    Sound.wake();
    if (S.over) { newRun(); renderAll(); return; }
    if (S.paused) return;
    const p = toBoard(ev);
    const col = Math.floor((p.x - OX) / CELL), row = Math.floor((p.y - OY) / CELL);
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;

    if (S.selUnit) { tryPlace(S.selUnit, col, row); return; }
    const occ = gobAt(col, row);
    // A goblin already on the board can be folded into another one. This is how a
    // worked-out Digger gets reused instead of dug up for half its gold.
    if (S.selGob && occ && occ !== S.selGob && fuseInPlace(S.selGob, occ)) return;
    S.selGob = (occ && S.selGob !== occ) ? occ : null;
    if (S.selGob) Sound.play("select");
    renderInspector();
  });

  function clearSel() { S.selUnit = null; S.selGob = null; renderRack(); }
  addEventListener("keydown", e => { if (e.key === "Escape") clearSel(); });

  // ==================================================================== chrome
  const DESC = {
    chucker:  "Throws rocks.",
    digger:   "Mines. Deeper is richer.",
    barricade:"Soaks hits.",
    sapper:   "Clears rubble in its lane.",
  };
  let drag = null;
  function cellUnder(clientX, clientY) {
    const r = cv.getBoundingClientRect();
    if (clientX < r.left || clientX > r.right || clientY < r.top || clientY > r.bottom) return null;
    const x = (clientX - r.left) * (W / r.width), y = (clientY - r.top) * (H / r.height);
    const col = Math.floor((x - OX) / CELL), row = Math.floor((y - OY) / CELL);
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
    return { col, row };
  }
  const rack = document.getElementById("rack");
  function denyCard(key) {
    const el = rack.querySelector('[data-unit="' + key + '"]');
    if (!el) return;
    el.classList.remove("deny"); void el.offsetWidth; el.classList.add("deny");
  }
  function renderRack() {
    rack.innerHTML = "";
    for (const key of ROSTER) {
      const u = UNITS[key];
      const b = document.createElement("button");
      b.className = "card"; b.type = "button"; b.dataset.unit = key;
      b.style.setProperty("--unit", u.tint);
      b.disabled = S.coins < costOf(key) || S.cool[key] > 0;
      b.setAttribute("aria-pressed", String(S.selUnit === key));
      b.innerHTML = '<span class="card-name">' + u.name + "</span>" +
                    '<span class="card-cost">' + costOf(key) + "</span>" +
                    '<span class="card-desc">' + DESC[key] + "</span>" +
                    '<span class="cd" data-cd="' + key + '"></span>';
      b.addEventListener("mouseenter", () => { if (!b.disabled) Sound.play("hover"); });
      // Drag-to-place alongside tap-to-select, as the phone version of the original
      // offers both. A tap must fall through to the click handler untouched — treating
      // every pointerdown as a drag silently cancelled every selection.
      b.addEventListener("pointerdown", ev => {
        if (b.disabled) return;
        Sound.wake();
        drag = { key, id: ev.pointerId, sx: ev.clientX, sy: ev.clientY, moved: false };
        b.setPointerCapture(ev.pointerId);
      });
      b.addEventListener("pointermove", ev => {
        if (!drag || drag.id !== ev.pointerId) return;
        if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 9) {
          drag.moved = true;
          b.classList.add("drag");
          S.selUnit = drag.key;            // so the ghost previews the right thing
        }
        if (!drag.moved) return;
        const c = cellUnder(ev.clientX, ev.clientY);
        hover.col = c ? c.col : -1; hover.row = c ? c.row : -1;
      });
      b.addEventListener("pointerup", ev => {
        if (!drag || drag.id !== ev.pointerId) return;
        const wasDrag = drag.moved, key = drag.key;
        drag = null;
        b.classList.remove("drag");
        if (!wasDrag) return;              // a tap: the click handler selects as usual
        const c = cellUnder(ev.clientX, ev.clientY);
        hover.col = -1; hover.row = -1;
        if (c) tryPlace(key, c.col, c.row);
        else { S.selUnit = null; renderRack(); }
      });
      b.addEventListener("pointercancel", () => { b.classList.remove("drag"); drag = null; });
      b.addEventListener("click", () => {
        Sound.wake();
        S.selUnit = S.selUnit === key ? null : key;
        S.selGob = null; Sound.play("select"); renderRack();
      });
      rack.appendChild(b);
    }
  }

  const inspEmpty = document.getElementById("insp-empty");
  const inspBody = document.getElementById("insp-body");
  const inspName = document.getElementById("insp-name");
  const inspMeta = document.getElementById("insp-meta");
  const inspPairs = document.getElementById("insp-pairs");
  function renderInspector() {
    const g = S.selGob;
    if (!g || g.hp <= 0) { inspEmpty.hidden = false; inspBody.hidden = true; return; }
    inspEmpty.hidden = true; inspBody.hidden = false;
    inspName.textContent = nameOf(g);
    const bits = [g.parts.map(t => UNITS[t].name).join(" + "),
                  Math.round(g.hp) + "/" + Math.round(maxHpOf(g)) + " hp"];
    const dn = countOf(g, "digger");
    if (dn > 0) {
      const warm = DIG_FLOOR + (1 - DIG_FLOOR) * Math.min(1, (g.age || 0) * dn / DIG_WARM);
      bits.push("shaft " + Math.round(warm * 100) + "%");
      bits.push("+" + Math.max(1, Math.round(yieldAt(g.col) * warm * (1 + (dn - 1) * 0.85))) + " per pull");
    }
    if (hasPair(g, "strongbox") && g.banked) bits.push(g.banked + " banked");
    if (g.parts.length < MAX_PARTS) bits.push("room for " + (MAX_PARTS - g.parts.length) + " more");
    const free = S.t - g.born <= GRACE;
    bits.push(free ? "dig up: full refund" : "dig up: half back");
    inspMeta.textContent = bits.join("  ·  ");
    // What this particular mixture does, named. Without this the only visible difference
    // between two fused bodies is the word on the cell.
    const prs = pairsIn(g);
    inspPairs.replaceChildren();
    inspPairs.hidden = !prs.length;
    for (const pr of prs) {
      const t = document.createElement("span");
      t.className = "pair";
      t.innerHTML = "<b>" + pr.name + "</b> " + pr.note;
      inspPairs.appendChild(t);
    }
  }
  document.getElementById("insp-dig").addEventListener("click", () => {
    if (S.selGob) removeGoblin(S.selGob);
    renderInspector();
  });

  const pipsEl = document.getElementById("pips");
  function renderPips() {
    pipsEl.innerHTML = "";
    for (let i = 0; i < CHAMBER_WAVES.length; i++) {
      const d = document.createElement("div");
      d.className = "pip" + (i < S.waveIx ? " done" : i === S.waveIx ? " now" : "");
      pipsEl.appendChild(d);
    }
  }

  const coinsEl = document.getElementById("hud-coins");
  const rateEl = document.getElementById("hud-rate");
  const waveEl = document.getElementById("hud-wave");
  const veinsEl = document.getElementById("hud-veins");
  let bumpT = null;
  function bumpCoins() {
    coinsEl.classList.add("bump");
    clearTimeout(bumpT);
    bumpT = setTimeout(() => coinsEl.classList.remove("bump"), 100);
  }

  document.getElementById("restart").addEventListener("click", () => { newRun(); renderAll(); });
  const pauseBtn = document.getElementById("pause");
  pauseBtn.addEventListener("click", () => {
    S.paused = !S.paused;
    pauseBtn.textContent = S.paused ? "Resume" : "Pause";
    pauseBtn.classList.toggle("on", S.paused);
  });
  const muteBtn = document.getElementById("mute");
  muteBtn.addEventListener("click", () => {
    Sound.wake();
    const on = Sound.toggle();
    muteBtn.textContent = on ? "Sound on" : "Sound off";
    muteBtn.classList.toggle("on", on);
  });
  function renderAll() { renderRack(); renderPips(); renderInspector(); }

  // ====================================================================== loop
  let last = performance.now(), affordSig = null;
  function frame(now) {
    let dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (S.freeze > 0) { S.freeze -= dt; dt = 0; }
    if (!S.paused && !S.over) update(dt);
    render();

    coinsEl.textContent = Math.round(S.coins);
    rateEl.textContent = "+" + S.rate.toFixed(1) + " / sec";
    waveEl.textContent = S.over ? (S.won ? "clear" : "lost")
      : S.waveIx < 0 ? "—" : (S.waveIx + 1) + "/" + CHAMBER_WAVES.length;
    veinsEl.textContent = S.goblins.filter(g => countOf(g, "digger") > 0).length + " digging";

    if (S.selGob) renderInspector();
    for (const k in S.cool) {
      const el = rack.querySelector('[data-cd="' + k + '"]');
      if (el) el.style.height = (S.cool[k] / rechargeOf(k) * 100).toFixed(1) + "%";
    }
    const sig = ROSTER.map(k => (S.coins >= costOf(k)) + ":" + (S.cool[k] > 0)).join("");
    if (sig !== affordSig) { affordSig = sig; renderRack(); }
    requestAnimationFrame(frame);
  }

  window.__demo = {
    get state() { return S; },
    wave: n => { S.waveIx = n - 2; S.phase = "breath"; S.phaseT = 0.1; },
    nameOf, maxHpOf, yieldAt, WAVES, UNITS, WORLDS, ROUTE, UPGRADES, SMALLS, place: tryPlace,
    BODY, BODY_KEYS: Object.keys(BODY), BODY_COUNT: Object.keys(BODY).length,
    ROUTE_CARDS, PERSIST,
    reportNow: () => report(),
    FOES,
    audioWake: () => Sound.wake(), audioPlay: k => Sound.play(k),
    audioReset: () => Sound.reset(),
    get WAVE_COUNT() { return CHAMBER_WAVES.length; },
    costOf,
    smallPrice: (role, id) => Math.round(SMALLS[id].base * (1 + smallOf(role, id) * 0.7)),
    smallCount: (role, id) => smallOf(role, id),
    remove: removeGoblin,
    fuse: fuseInPlace,
    veinAt: (c, r) => S.veins[c + "," + r] === undefined ? 1 : S.veins[c + "," + r],
    get cfg() { return CFG; },
    // Start a chamber for the meta layer. cfg = { world, chapter, chamber, roles }.
    begin(cfg, done) {
      CFG = Object.assign({ world: null, chapter: 1, chamber: 1,
                            shut: [], flood: [], rubbleEvery: 1, speedMul: 1 }, cfg);
      ROSTER = cfg.roles && cfg.roles.length ? cfg.roles.slice() : ROSTER;
      UPS = cfg.upgrades || {};
      SM = cfg.smalls ? JSON.parse(JSON.stringify(cfg.smalls)) : {};
      onChamberEnd = done;
      newRun();
      // A chapter is one continuous defence. Whatever lived through the last chamber is
      // still standing where you left it, at the health it survived on, and the gold you
      // did not spend is still in your pocket.
      if (cfg.board && cfg.board.length) {
        for (const b of cfg.board) {
          const g = { id: ++GID, parts: b.parts.slice(), col: b.col, row: b.row, hp: 0, born: -99,
                      age: b.age || 0, cd: 0.5, dcd: 1.2, squash: 0, land: 0,
                      recoil: 0, hurtT: 0, wind: 0 };
          g.hp = Math.max(12, maxHpOf(g) * (b.hpFrac === undefined ? 1 : b.hpFrac));
          S.goblins.push(g);
        }
      }
      if (cfg.carryGold !== undefined) S.coins = cfg.carryGold;
      // Opening gold rides the shop's own markup, so what 400 buys in chapter 1 is what a
      // chapter-3 opening buys too. The old +50% a chapter outran the +25% price rise, so
      // the deepest chapter started a third richer than the first while everything else
      // about it was meant to be harder.
      // One opening, once. Everything after chamber 1 is gold you earned and kept - the
      // ramp that used to sit here existed to fund rebuying a wiped board, and there is
      // no wipe any more. It also handed you 1200 by chamber 6, which is enough to skip
      // digging altogether.
      else S.coins = START_COINS;
      if (cfg.veins) S.veins = Object.assign({}, cfg.veins);
      if (cfg.seen) S.seen = Object.assign({}, cfg.seen);
      if (cfg.collapsed) S.collapsed = Object.assign({}, cfg.collapsed);
      if (cfg.cracking) S.cracking = Object.assign({}, cfg.cracking);
      // Bear traps are a one-off, not a per-chamber allowance. Spending one in chamber 2
      // means that lane has no net under it for the rest of the run.
      if (cfg.traps) S.traps = cfg.traps.slice();
      CHAMBER_WAVES = wavesForChamber();
      renderPips();          // the pips count THIS chamber's waves, not the whole table
      S.bannerText = "CHAMBER " + CFG.chamber + " OF " + CHAMBERS;
      S.banner = 2.4;
      const w = WORLDS[CFG.world];
      if (w) {
        document.querySelector("h1").textContent = w.name;
        document.querySelector(".kicker").textContent =
          "chamber " + CFG.chamber + " of " + CHAMBERS + " · " + w.name + " · " + w.rule;
      }
      renderAll();
    },
    // Balance harness: advance the simulation without waiting on real frames.
    step: dt => { if (!S.over) update(dt); },
    reset: () => { newRun(); renderAll(); },
  };
  renderAll();
  requestAnimationFrame(frame);
})();
</script>

<script>
// ============================================================== the demo shell
// The full prototype wraps the chamber in a warren, scrip, a bench and two shops. A
// demo is played once by a stranger, so all of that is invisible work: what is left is
// a title card, six chambers and an ending that arrives on purpose.
(() => {
  "use strict";
  const V = window.__demo;
  const metaEl = document.getElementById("meta");
  const gameEl = document.getElementById("game-shell");

  const CHAMBERS = 6;
  const worldOf = c => c <= 2 ? "hollow" : "scree";
  const BEAT = ["Hold a lane", "Fuse", "Scouts", "Rubble", "Stacked", "The Reeve"];

  let R = null;

  const el = (tag, cls, txt) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined) n.textContent = txt;
    return n;
  };
  function show(nodes) {
    gameEl.hidden = true; metaEl.hidden = false;
    metaEl.replaceChildren(...nodes);
    window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------------ title
  function title() {
    R = null;
    const p = el("div", "m-panel");
    p.append(el("h2", null, "Hoard"));
    const n = el("p", "m-note");
    n.innerHTML = "The heroes are coming down here for your gold. "
      + "<b>Six chambers.</b> Dig, throw rocks, and drop goblins on each other "
      + "to make something worse.";
    p.append(n);
    const row = el("div", "m-row");
    const go = el("button", "btn on", "Down we go");
    go.onclick = () => { begin(); enterChamber(); };
    row.append(go);
    show([p, row]);
  }

  const ROUTE_AT = [2, 4];      // a fork after chamber 2 and after chamber 4

  // Which cells give way next. Heroes arrive from the right and the seams are richest
  // there, so collapsing right-to-left takes income and forward position in one stroke
  // and reads as a tunnel closing in. Two rules are inviolable: a lane is never sealed,
  // and the last column before the cart never goes - randomness may add pressure, but
  // it may never own a place to stand.
  function pickCracking(collapsed, forChamber) {
    const P = V.PERSIST;
    const want = (P.collapsed[Math.min(forChamber, P.collapsed.length) - 1] || 0)
               - Object.keys(collapsed).length;
    const out = {};
    if (want <= 0) return out;
    const laneLeft = [];
    for (let r = 0; r < 5; r++) {
      let n = 0;
      for (let c = 0; c < 7; c++) if (!collapsed[c + "," + r]) n++;
      laneLeft.push(n);
    }
    const pool = [];
    for (let r = 0; r < 5; r++) for (let c = 0; c < 7; c++) {
      if (collapsed[c + "," + r] || P.safeCols.includes(c)) continue;
      pool.push({ c, r, w: Math.pow(c + 1, P.rightBias) * (0.6 + Math.random()) });
    }
    pool.sort((a, b) => b.w - a.w);
    for (const cell of pool) {
      if (Object.keys(out).length >= want) break;
      if (laneLeft[cell.r] - 1 < P.minPerLane) continue;
      out[cell.c + "," + cell.r] = true;
      laneLeft[cell.r]--;
    }
    return out;
  }
  function begin() {
    R = { chamber: 1, board: null, veins: null, gold: undefined,
          smalls: {}, upgrades: {}, built: {}, dead: 0, kills: 0,
          feats: {}, cleanChambers: 0, marches: 0,
          // Appendix A: the board and the purse survive the whole run, and the ground is
          // what gets taken away instead.
          collapsed: {}, cracking: {}, traps: null,
          shut: [], flood: [], rubbleEvery: 1, speedMul: 1, drain: 1, taken: [] };
  }

  function rosterFor(chamber) {
    // The Sapper is handed to you on arrival in The Scree, which keeps the "each world
    // gives you its own answer" beat with the smallest roster that can carry it.
    return worldOf(chamber) === "scree"
      ? ["chucker", "digger", "barricade", "sapper"]
      : ["chucker", "digger", "barricade"];
  }

  function enterChamber() {
    metaEl.hidden = true; gameEl.hidden = false;
    window.scrollTo(0, 0);
    if (!Object.keys(R.cracking).length && R.chamber < CHAMBERS)
      R.cracking = pickCracking(R.collapsed, R.chamber + 1);
    V.begin({ world: worldOf(R.chamber), chapter: 1, chamber: R.chamber,
              roles: rosterFor(R.chamber), upgrades: R.upgrades, smalls: R.smalls,
              board: R.board, carryGold: R.gold, veins: R.veins, seen: R.built,
              collapsed: R.collapsed, cracking: R.cracking, traps: R.traps,
              shut: R.shut, flood: R.flood,
              rubbleEvery: R.rubbleEvery, speedMul: R.speedMul }, chamberDone);
  }

  function chamberDone(won, goldLeft, board, veins, smalls, rep) {
    // The ledger is the record of what you made, so it is written whether you held the
    // chamber or not.
    if (rep) {
      R.built = Object.assign(R.built, rep.seen);
      R.kills += rep.kills;
      R.dead += rep.deaths;
      if (rep.paidForItself) R.feats.paid = true;
      if (won && rep.deaths === 0) { R.cleanChambers++; R.feats.scratch = true; }
    }
    for (const b of (board || [])) R.built[[...b.parts].sort().join("+")] = true;
    if (R.built["barricade+barricade+barricade"]) R.feats.wall = true;
    if (Object.keys(R.built).length >= 5) R.feats.read = true;
    if (!won) return ending(false);
    R.veins = veins;                       // drained ground stays drained
    R.traps = rep && rep.traps ? rep.traps : R.traps;
    R.marches += (rep && rep.marches) || 0;

    // The cracks you were warned about last chamber give way now. Anything still standing
    // on one goes down with it - the whole chamber was the notice.
    R.lostToCollapse = 0;
    for (const k in R.cracking) R.collapsed[k] = true;
    R.board = (board || []).filter(b => {
      const gone = R.collapsed[b.col + "," + b.row];
      if (gone) R.lostToCollapse += b.parts.length;
      return !gone;
    });
    R.dead += R.lostToCollapse;
    R.gold = goldLeft;                     // one tax in this model, and it is the ground
    R.cracking = pickCracking(R.collapsed, R.chamber + 2);
    probe(goldLeft);

    if (R.chamber >= CHAMBERS) return ending(true);
    if (ROUTE_AT.includes(R.chamber)) return fork();
    held();
  }

  // Five numbers, because the test is worthless if it comes down to whether the run
  // felt about right.
  function probe(goldLeft) {
    const usable = 35 - Object.keys(R.collapsed).length;
    const bodies = R.board || [];
    const parts = bodies.reduce((n, b) => n + b.parts.length, 0);
    window.__probe = window.__probe || [];
    window.__probe.push({
      chamber: R.chamber, goldLeft,
      usable, occupied: bodies.length,
      fill: +(bodies.length / Math.max(1, usable)).toFixed(2),
      avgParts: +(parts / Math.max(1, bodies.length)).toFixed(2),
      distinct: Object.keys(R.built).length,
      marches: R.marches, lostToCollapse: R.lostToCollapse,
    });
  }

  // Recognition, not unlocks. They cost nothing to build - no unlock content, no save
  // file - and they still produce the sentence one player repeats to another, which is
  // the whole point of a feat.
  const FEATS = [
    { id: "wall",    name: "Great Wall",     note: "three Barricades in one body" },
    { id: "scratch", name: "Not a scratch",  note: "held a chamber without losing a goblin" },
    { id: "paid",    name: "Paid for itself", note: "won a lane that never had a Chucker in it" },
    { id: "read",    name: "Well read",      note: "five different bodies in one run" },
  ];

  function held() {
    const p = el("div", "m-panel");
    p.append(el("h2", null, "Chamber " + R.chamber + " held"));
    const n = el("p", "m-note");
    const next = R.chamber + 1;
    n.innerHTML = worldOf(next) !== worldOf(R.chamber)
      ? "Below is <b>The Scree</b>. The roof comes down there, and a <b>Sapper</b> is "
        + "waiting for you at the bottom of the ladder."
      : "Chamber " + next + " of " + CHAMBERS + ". <b>" + BEAT[next - 1] + ".</b>";
    p.append(n);
    p.append(ledgerStrip());
    const row = el("div", "m-row");
    const go = el("button", "btn on", "Into chamber " + next);
    go.onclick = () => {
      // The board stands. What changed is that some of the floor it stands on is gone.
      R.chamber++;
      enterChamber();
    };
    row.append(go);
    show([p, row]);
  }

  // ------------------------------------------------------------------ the fork
  function fork() {
    const pool = V.ROUTE_CARDS.filter(c => !R.taken.includes(c.id));
    const pick = [];
    while (pick.length < 2 && pool.length) pick.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    const p = el("div", "m-panel");
    p.append(el("h2", null, "Two ways down"));
    const n = el("p", "m-note");
    n.innerHTML = "Both of them cost you something you cannot get back. Pick the one you "
      + "can afford to lose.";
    p.append(n);
    const cards = el("div", "cards");
    for (const c of pick) {
      const b = el("button", "route");
      b.append(el("span", "route-where", c.where));
      b.append(el("span", "route-name", c.name));
      const cost = el("span", "route-cost", c.cost.text);
      const up = V.UPGRADES[c.gain.id];
      const gain = el("span", "route-gain",
        V.UNITS[c.gain.role].name + " · " + up.name + " — " + up.note);
      b.append(cost, gain);
      b.onclick = () => {
        c.cost.apply(R);
        R.taken.push(c.id);
        (R.upgrades[c.gain.role] = R.upgrades[c.gain.role] || []).push(c.gain.id);
        if (R.drain !== 1 && R.veins) {
          for (const k in R.veins) R.veins[k] *= R.drain;
          R.drain = 1;
        }
        R.chamber++;
        enterChamber();
      };
      cards.append(b);
    }
    p.append(cards);
    show([p, ledgerStrip()]);
  }

  function ledgerStrip() {
    const wrap = el("div", "m-panel");
    const made = Object.keys(R.built).length;
    wrap.append(el("h2", null, "Built " + made + " of " + V.BODY_COUNT));
    const strip = el("div", "roster");
    for (const key of V.BODY_KEYS) {
      const t = el("span", "tile");
      if (R.built[key]) t.append(el("b", null, V.BODY[key]));
      else { const q = el("b", null, "—"); q.style.color = "var(--ink-dim)"; t.append(q); }
      t.style.opacity = R.built[key] ? "1" : "0.32";
      strip.append(t);
    }
    wrap.append(strip);
    return wrap;
  }

  // Most players will not beat the Reeve first time, so the loss screen is the screen
  // most people see. It is the same screen as the win with one line changed, and it
  // leads with what you built rather than with where you stopped.
  function ending(won) {
    const p = el("div", "m-panel");
    p.append(el("h2", null, won ? "The hoard is still yours" : "They reached the caravan"));
    const n = el("p", "m-note");
    n.innerHTML = won
      ? "All six chambers held, and <b>The Reeve</b> went down with the rest."
      : "You held <b>" + (R.chamber - 1) + "</b> of " + CHAMBERS + " chambers"
        + (R.chamber === CHAMBERS ? ", and met <b>The Reeve</b>." : ".");
    p.append(n);

    const got = FEATS.filter(f => R.feats[f.id]);
    if (got.length) {
      p.append(el("h3", "feat-head", "What you did"));
      const list = el("div", "feats");
      for (const f of got) {
        const t = el("div", "feat");
        t.append(el("b", null, f.name));
        t.append(el("span", null, f.note));
        list.append(t);
      }
      p.append(list);
    }

    const tally = el("p", "m-note");
    tally.innerHTML = "<b>" + R.kills + "</b> heroes stopped · <b>"
      + Object.keys(R.built).length + "</b> of " + V.BODY_COUNT + " bodies built · <b>"
      + R.dead + "</b> goblins lost";
    p.append(tally);

    const below = el("p", "m-note");
    below.innerHTML = "Below this: <b>The Rot</b>, where the ground is dead and you earn "
      + "off corpses instead, and <b>The Deep</b>, where the seams are rich and thin and "
      + "nothing catches what gets past you.";
    p.append(below);

    const row = el("div", "m-row");
    const again = el("button", "btn on", "Again");
    again.onclick = () => { begin(); enterChamber(); };
    row.append(again);
    show([p, ledgerStrip(), row]);
  }

  window.__meta = { get run() { return R; }, title, begin, enterChamber, pickCracking,
                    set chamber(c) { R.chamber = c; } };
  title();
})();
</script>
