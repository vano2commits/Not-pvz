<title>Hoard — Demo</title>

<style>
  :root {
    --cave-deep: #0b0910; --cave: #141119; --stone: #241f26; --stone-lit: #2f2833;
    --gold: #e8c05a; --gold-dim: #8a7134; --goblin: #6fbf5b; --alarm: #d1553f;
    --ink: #e6dfd4; --ink-dim: #9a9089;
    --display: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    --body: "Trebuchet MS", "Segoe UI", Candara, sans-serif;
    --data: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse 900px 500px at 14% 16%, #211925 0%, transparent 62%),
      radial-gradient(ellipse 700px 400px at 86% 86%, #1a1826 0%, transparent 62%),
      var(--cave-deep);
    color: var(--ink); font-family: var(--body); line-height: 1.55; min-height: 100vh;
  }
  .shell { max-width: 1180px; margin: 0 auto; padding: 22px 16px 60px;
           display: flex; flex-direction: column; gap: 12px; }
  /* an author display rule outranks the UA [hidden] rule, so state it */
  .shell[hidden] { display: none; }
  .masthead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--display); font-size: clamp(28px, 5.5vw, 46px); margin: 0;
       color: var(--gold); text-transform: uppercase; letter-spacing: .02em; line-height: .95;
       text-shadow: 0 2px 0 #4a3a12, 0 0 30px rgba(232,192,90,.26); }
  .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .15em; color: var(--ink-dim); }

  .hud { display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
         background: linear-gradient(180deg, var(--stone-lit), var(--stone));
         border: 1px solid #3b3340; border-radius: 4px; padding: 8px 14px; }
  .readout { display: flex; flex-direction: column; }
  .readout-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: .17em; color: var(--ink-dim); }
  .readout-value { font-family: var(--display); font-size: 26px; line-height: 1.05;
                   font-variant-numeric: tabular-nums; transition: transform .09s ease-out; }
  .readout-value.gold { color: var(--gold); }
  .readout-value.bump { transform: scale(1.2); }
  .readout-sub { font-family: var(--data); font-size: 11px; color: var(--ink-dim); }
  .pips { display: flex; gap: 4px; margin-left: auto; align-items: center; }
  .pip { width: 20px; height: 6px; border-radius: 1px; background: #3b3340; transition: background .25s, transform .25s; }
  .pip.done { background: var(--gold); }
  .pip.now { background: var(--alarm); transform: scaleY(1.7); }

  canvas { display: block; width: 100%; max-width: 900px; height: auto; aspect-ratio: 788 / 542;
           border: 1px solid #3b3340; border-radius: 4px; background: var(--cave);
           cursor: pointer; touch-action: none; margin: 0 auto; }
  /* The "white flash on select" was never a draw call: tapping the board let the browser
     paint its own tap-highlight and drag-select the page, washing the whole canvas in the
     UA's blue. Kill both everywhere — nothing on this page is meant to be selected. */
  * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none; }

  /* A phone has no pointer to hover with, so a tap lands the :hover state and it sticks
     until you tap something else - cards left bright and lifted a few pixels behind you as
     you play. Gate the lot behind a real pointer. */
  @media (hover: hover) and (pointer: fine) {
    .fo:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.2); }
    .card:hover:not(:disabled) { transform: translateY(-3px); filter: brightness(1.14); }
    .btn:hover { color: var(--ink); border-color: var(--gold-dim); transform: translateY(-2px); }
    .btn.danger:hover { border-color: var(--alarm); color: #ffb3a3; }
    .gob:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.16); }
    .world:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.18); }
  }

  .play { display: flex; flex-direction: column; gap: 12px; }

  .rack { display: flex; gap: 9px; flex-wrap: wrap; }
  .forge { display: flex; gap: 7px; flex-wrap: wrap; align-items: stretch; }
  .forge:empty { display: none; }
  .fo { flex: 1 1 130px; min-width: 118px; display: flex; flex-direction: column; gap: 1px;
        background: #1d1822; border: 1px dashed #4a4150; border-left: 3px solid var(--fu, #8a7134);
        border-radius: 3px; padding: 6px 9px; color: var(--ink); font-family: var(--body);
        text-align: left; cursor: pointer; transition: transform .1s, filter .12s; }

  .fo:disabled { opacity: .34; cursor: not-allowed; }
  .fo-t { font-size: 12px; font-weight: 700; }
  .fo-r { font-family: var(--data); font-size: 9.5px; letter-spacing: .07em;
          text-transform: uppercase; color: var(--fu, #8a7134); }
  .fo-c { font-family: var(--data); font-size: 11px; color: var(--gold); }
  .card { flex: 1 1 150px; min-width: 132px;
          display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
          background: linear-gradient(180deg, var(--stone-lit), var(--stone));
          border: 1px solid #3b3340; border-left: 3px solid var(--unit, var(--goblin));
          border-radius: 3px; padding: 8px 10px; color: var(--ink);
          font-family: var(--body); font-size: 12.5px; text-align: left; cursor: pointer;
          transition: transform .1s cubic-bezier(.3,1.6,.5,1), border-color .12s, filter .12s; }

  .card:active:not(:disabled) { transform: translateY(1px) scale(.98); }
  .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .card[aria-pressed="true"] { border-color: var(--gold);
      box-shadow: inset 0 0 0 1px var(--gold), 0 0 18px rgba(232,192,90,.22); transform: translateY(-3px); }
  .card:disabled { opacity: .38; cursor: not-allowed; }
  .card.deny { animation: deny .3s; }
  @keyframes deny { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .card-name { font-family: var(--display); font-size: 15px; letter-spacing: .03em; text-transform: uppercase; }
  .card-cost { font-family: var(--data); font-size: 11.5px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .card-desc { font-size: 11px; color: var(--ink-dim); line-height: 1.3; }
  .card { position: relative; overflow: hidden; }
  .cd { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
        background: rgba(10, 8, 13, .72); border-top: 1px solid rgba(232,192,90,.5); }

  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { font-family: var(--body); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
         background: transparent; color: var(--ink-dim); border: 1px solid #443b49;
         border-radius: 3px; padding: 5px 12px; cursor: pointer;
         transition: transform .1s, color .12s, border-color .12s; }

  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn.on { color: var(--gold); border-color: var(--gold-dim); }
  .hint { font-size: 11.5px; color: var(--ink-dim); font-style: italic; }
  .insp { border: 1px solid #3b3340; border-radius: 3px; padding: 7px 12px;
          background: linear-gradient(180deg, var(--stone-lit), var(--stone));
          display: flex; align-items: center; gap: 12px; min-height: 22px; }
  .insp-empty { font-size: 12px; color: var(--ink-dim); font-style: italic; }
  .insp-empty[hidden], .insp-body[hidden] { display: none; }
  .insp-body { display: flex; align-items: center; gap: 12px; width: 100%; }
  .insp-body b { font-family: var(--display); font-size: 17px; letter-spacing: .03em;
                 text-transform: uppercase; color: var(--gold); font-weight: normal; }
  .insp-meta { font-family: var(--data); font-size: 11.5px; color: var(--ink-dim); }
  .btn.danger { margin-left: auto; border-color: #6b3a35; color: #e0897a; }

  .card.drag { opacity: .5; }

  .foot { font-size: 12.5px; color: var(--ink-dim); max-width: 76ch;
          border-top: 1px solid #2b2530; padding-top: 14px; }
  .foot b { color: var(--ink); }
  /* A phone held sideways has height to spare nowhere and width to spare everywhere, so
     the cards move to a rail beside the board instead of stacking under it. Below the old
     layout the board only got 40px cells; this gets it past a fingertip. */
  @media (orientation: landscape) and (max-height: 620px) {
    .shell { padding: 4px 7px 7px; gap: 5px; }
    .masthead, .foot, .insp { display: none; }
    .play { flex-direction: row; align-items: stretch; justify-content: center; gap: 7px; }
    canvas { max-height: calc(100vh - 98px); width: auto; max-width: 100%; margin: 0; }
    /* budget the real chrome (hud + controls) rather than guessing a vh fraction */
    .play { max-height: calc(100vh - 98px); }
    .rack { flex: 0 0 128px; flex-direction: column; flex-wrap: nowrap; gap: 5px; min-height: 0; }
    /* min-height:auto would stop the cards shrinking and push the rail off-screen */
    .card { flex: 1 1 0; min-width: 0; min-height: 0; justify-content: center; padding: 5px 8px; }
    .card-name { font-size: 12px; }
    .card-desc { display: none; }
    .hud { padding: 2px 9px; gap: 12px; }
    .readout-value { font-size: 16px; }
    .readout-label, .readout-sub { font-size: 9px; }
    .controls { gap: 6px; }
    .controls .hint { display: none; }
    .btn { padding: 4px 9px; font-size: 11px; }
  }

  /* ---------------------------------------------------------------- meta layer */
  .meta { max-width: 1000px; margin: 0 auto; padding: 18px 14px 60px;
          display: flex; flex-direction: column; gap: 14px; }
  .meta[hidden] { display: none; }
  .m-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
           background: linear-gradient(180deg, var(--stone-lit), var(--stone));
           border: 1px solid #3b3340; border-radius: 4px; padding: 8px 13px; }
  .m-panel { background: linear-gradient(180deg, rgba(47,40,51,.7), rgba(36,31,38,.7));
             border: 1px solid #3b3340; border-radius: 5px; padding: 15px;
             display: flex; flex-direction: column; gap: 11px; }
  .m-panel h2 { font-family: var(--display); font-size: 21px; margin: 0;
                text-transform: uppercase; letter-spacing: .03em; }
  .m-note { color: var(--ink-dim); font-size: 13.5px; margin: 0; }
  .m-note b { color: var(--ink); }
  .crew { display: grid; gap: 9px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .gob { background: var(--stone); border: 1px solid #3b3340; border-left: 3px solid var(--role);
         border-radius: 4px; padding: 9px 11px; display: flex; flex-direction: column; gap: 2px;
         cursor: pointer; text-align: left; color: var(--ink); font-family: var(--body);
         position: relative; transition: transform .1s, filter .12s; }

  .gob:disabled { opacity: .4; cursor: not-allowed; }
  .gob.picked { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .gob-name { font-family: var(--display); font-size: 16px; text-transform: uppercase;
              letter-spacing: .02em; line-height: 1.1; }
  .gob-role { font-family: var(--data); font-size: 10px; color: var(--role);
              letter-spacing: .08em; text-transform: uppercase; }
  .gob-note { font-size: 11.5px; color: var(--ink-dim); line-height: 1.35; }
  .gob-runs { position: absolute; top: 7px; right: 9px; font-family: var(--data);
              font-size: 9.5px; color: var(--gold-dim); }
  .worlds { display: grid; gap: 11px; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); }

  /* A route card. The cost is red and comes first, because that is the part you are
     actually deciding about - the reward is why you are willing to. */
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
           margin: 12px 0 4px; }
  .insp-pairs { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; width: 100%; }
  .pair { font-size: 12.5px; color: var(--ink-dim); line-height: 1.35; }
  .pair b { color: var(--goblin); font-family: var(--display); font-size: 14px;
            letter-spacing: .03em; margin-right: 5px; }
  .feat-head { font-family: var(--display); font-size: 13px; letter-spacing: .16em;
               text-transform: uppercase; color: var(--ink-dim); font-weight: normal;
               margin: 16px 0 0; }
  .feats { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 4px; }
  .feat { display: flex; flex-direction: column; gap: 1px; padding: 8px 12px;
          background: var(--stone); border: 1px solid #3b3340;
          border-left: 3px solid var(--goblin); border-radius: 3px; }
  .feat b { font-family: var(--display); font-size: 16px; letter-spacing: .03em;
            color: var(--goblin); }
  .feat span { font-size: 12.5px; color: var(--ink-dim); }
  .route { display: flex; flex-direction: column; gap: 5px; text-align: left;
           padding: 15px 16px 16px; cursor: pointer; color: var(--ink);
           background: linear-gradient(180deg, var(--stone-lit), var(--stone));
           border: 1px solid #3b3340; border-left: 4px solid var(--alarm); border-radius: 4px;
           transition: transform .12s, border-color .12s, background .12s; }
  .route:active { transform: translateY(1px); }
  .route-where { font-family: var(--data); font-size: 10px; letter-spacing: .16em;
                 text-transform: uppercase; color: var(--ink-dim); }
  .route-name { font-family: var(--display); font-size: 21px; letter-spacing: .02em;
                text-transform: uppercase; color: var(--gold); line-height: 1.05; }
  .route-cost { font-size: 13.5px; color: #e0897a; line-height: 1.42; }
  .route-gain { font-size: 13px; color: var(--goblin); line-height: 1.42;
                border-top: 1px solid #3b3340; padding-top: 7px; margin-top: 3px; }
  .world { background: var(--stone); border: 1px solid #3b3340; border-radius: 4px; padding: 13px;
           display: flex; flex-direction: column; gap: 7px; cursor: pointer; text-align: left;
           color: var(--ink); font-family: var(--body); transition: transform .1s, filter .12s; }

  .world-name { font-family: var(--display); font-size: 20px; text-transform: uppercase;
                color: var(--gold); line-height: 1.05; }
  .world-rule { font-size: 12.5px; }
  .world-fix { font-size: 11.5px; font-family: var(--data); color: var(--goblin); }
  .world-tier { font-family: var(--data); font-size: 10px; color: var(--ink-dim);
                letter-spacing: .1em; text-transform: uppercase; }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; }
  .step { flex: 1 1 120px; background: var(--stone); border: 1px solid #3b3340;
          border-radius: 4px; padding: 9px 11px; display: flex; flex-direction: column; gap: 2px; }
  .step.now { border-color: var(--gold); }
  .step.done { border-color: var(--goblin); opacity: .6; }
  .step-k { font-family: var(--data); font-size: 9px; letter-spacing: .1em;
            text-transform: uppercase; color: var(--ink-dim); }
  .step-n { font-family: var(--display); font-size: 15px; text-transform: uppercase; }
  .m-row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  .roster { display: flex; gap: 7px; flex-wrap: wrap; }

  /* ---- phone. Vampire Survivors picks a level-up from three full-width rows you can
     hit with a thumb without looking; the meta screens do the same. Touch targets stay
     over 48px with 8px between them, and the action that moves you forward is pinned to
     the bottom of the screen so it is never at the end of a scroll. */
  @media (max-width: 560px) {
    .meta { padding: 10px 10px 84px; gap: 10px; }
    .m-panel { padding: 12px; gap: 9px; }
    .crew, .worlds, .cards { grid-template-columns: 1fr; gap: 8px; }
    .route { padding: 12px 13px 13px; }
    .route-name { font-size: 18px; }
    .gob, .world { min-height: 56px; padding: 11px 13px; }
    .gob-name { font-size: 17px; }
    .gob-note { font-size: 12.5px; }
    .gob-kit { font-size: 12px; margin-top: 2px; }
    .m-row { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
             margin: 0; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
             background: linear-gradient(180deg, rgba(11,9,16,0), rgba(11,9,16,.94) 38%);
             gap: 8px; }
    .m-row .btn { flex: 1 1 0; min-height: 50px; font-size: 14px; }
    .m-bar { padding: 7px 10px; gap: 12px; }
    .m-bar .readout-value { font-size: 18px; }
  }
  .tile { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 9px;
          background: var(--stone); border: 1px solid #3b3340;
          border-left: 3px solid var(--role, var(--gold-dim)); border-radius: 3px; }
  .tile b { font-size: 12.5px; font-weight: 700; }
  .tile i { font-family: var(--data); font-size: 10.5px; font-style: normal;
            color: var(--ink-dim); }
  .m-panel h2 + .m-note { margin-top: -4px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="meta" id="meta"></div>

<div class="shell" id="game-shell" hidden>
  <header class="masthead">
    <h1>Hoard</h1>
    <span class="kicker">six chambers &middot; the gold is in the ground</span>
  </header>

  <div class="hud">
    <div class="readout">
      <span class="readout-label">Gold</span>
      <span class="readout-value gold" id="hud-coins">0</span>
      <span class="readout-sub" id="hud-rate">+0 / sec</span>
    </div>
    <div class="readout">
      <span class="readout-label">Wave</span>
      <span class="readout-value" id="hud-wave">&mdash;</span>
      <span class="readout-sub" id="hud-veins">&nbsp;</span>
    </div>
    <div class="pips" id="pips"></div>
  </div>

  <div class="play">
    <canvas id="board" width="788" height="542"
      aria-label="Five lanes, seven columns. Goblins defend the caravan on the left from heroes entering on the right."></canvas>
    <div class="rack" id="rack"></div>
  </div>

  <div class="insp" id="insp">
    <span class="insp-empty" id="insp-empty">Tap a goblin to inspect it, or dig it up. Tap two to merge them &mdash; the first one walks over.</span>
    <span class="insp-body" id="insp-body" hidden>
      <b id="insp-name">&mdash;</b>
      <span class="insp-meta" id="insp-meta"></span>
      <span class="insp-pairs" id="insp-pairs" hidden></span>
      <button class="btn danger" id="insp-dig" type="button">Dig up</button>
    </span>
  </div>

  <div class="controls">
    <button class="btn" id="restart" type="button">New chamber</button>
    <button class="btn" id="pause" type="button">Pause</button>
    <button class="btn on" id="mute" type="button">Sound on</button>

  </div>

</div>

<script>
(() => {
  "use strict";
  (function claimViewport() {
    let m = document.querySelector('meta[name="viewport"]');
    if (!m) { m = document.createElement("meta"); m.name = "viewport"; document.head.appendChild(m); }
    m.content = "width=device-width, initial-scale=1, viewport-fit=cover";
  })();

  // ===================================================================== audio
  const Sound = (() => {
    let ctx = null, master = null, muted = false, noiseBuf = null, lastClink = -1;
    function wake() {
      if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.9;
      // 2600 Hz took the texture off everything and left the oscillator underneath, which
      // is what "electric" meant. The brightness that actually hurts sits around 1.8 kHz
      // and the peaking filter below handles that on its own.
      const warm = ctx.createBiquadFilter();
      warm.type = "lowpass"; warm.frequency.value = 7200; warm.Q.value = 0.4;
      const tame = ctx.createBiquadFilter();
      tame.type = "peaking"; tame.frequency.value = 1800; tame.Q.value = 1.1; tame.gain.value = -6;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 9;
      comp.attack.value = 0.003; comp.release.value = 0.18;
      master.connect(tame); tame.connect(warm); warm.connect(comp); comp.connect(ctx.destination);
      const n = ctx.sampleRate * 1.6;
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      // brown-ish rather than white: rock and dirt have far more low end than a hiss,
      // and white noise through a narrow band is what made these read as synthetic
      let last = 0;
      for (let i = 0; i < n; i++) {
        const w = Math.random() * 2 - 1;
        last = (last + 0.035 * w) / 1.035;
        d[i] = last * 3.6 + w * 0.35;
      }
    }
    const rr = (a, b) => a + Math.random() * (b - a);
    function tone({ type = "sine", f0, f1, dur, gain = 0.3, delay = 0 }) {
      if (!ctx || muted) return;
      const t = ctx.currentTime + delay;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t);
      if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain, t + Math.min(0.03, dur * 0.35));   // softer attack
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
    }
    function hiss({ dur, gain = 0.3, type = "lowpass", f0 = 1200, f1, q = 1, delay = 0 }) {
      if (!ctx || muted) return;
      const t = ctx.currentTime + delay;
      const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = rr(0.85, 1.15);
      const bp = ctx.createBiquadFilter(); bp.type = type; bp.Q.value = q;
      bp.frequency.setValueAtTime(f0, t);
      if (f1) bp.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
    }
    const lib = {
      select: () => tone({ type: "triangle", f0: rr(620, 680), f1: rr(880, 940), dur: 0.07, gain: 0.1 }),
      deny:   () => tone({ type: "triangle", f0: 170, f1: 96, dur: 0.17, gain: 0.14 }),
      hover:  () => tone({ type: "sine", f0: rr(1100, 1250), dur: 0.03, gain: 0.03 }),
      // Everything below is noise with a thump under it, not a tone with a whisper of
      // noise over it. Measured as spectral flatness the old versions all sat under 0.06,
      // which is a sine wave wearing a hat; rock, dirt and wood do not sound like that.
      place:  () => { hiss({ dur: 0.3, gain: 0.58, type: "bandpass",
                             f0: rr(1400, 2000), f1: rr(280, 400), q: 0.4 });
                      tone({ type: "sine", f0: rr(140, 180), f1: 52, dur: 0.13, gain: 0.13 }); },
      throw:  () => { hiss({ dur: 0.13, gain: 0.34, type: "bandpass",
                             f0: rr(2400, 3600), f1: rr(700, 1000), q: 0.55 });
                      tone({ type: "sine", f0: rr(300, 380), f1: 150, dur: 0.06, gain: 0.05 }); },
      hit:    () => { hiss({ dur: 0.1, gain: 0.42, type: "bandpass",
                             f0: rr(1700, 2600), f1: rr(420, 600), q: 0.7 });
                      tone({ type: "sine", f0: rr(170, 230), f1: 74, dur: 0.06, gain: 0.09 }); },
      kill:   () => { hiss({ dur: 0.36, gain: 0.5, type: "bandpass",
                             f0: rr(1800, 2600), f1: rr(220, 320), q: 0.4 });
                      tone({ type: "sine", f0: rr(240, 300), f1: 60, dur: 0.14, gain: 0.06 }); },
      // a pick going into rock, then the coin
      dig:    () => { hiss({ dur: 0.16, gain: 0.46, type: "bandpass",
                             f0: rr(2200, 3200), f1: rr(380, 560), q: 0.8 });
                      tone({ type: "sine", f0: rr(160, 210), f1: 82, dur: 0.08, gain: 0.11 }); },
      coin:   () => { if (!ctx || muted) return;
                      const now = ctx.currentTime;
                      if (now - lastClink < 0.03) return;
                      lastClink = now;
                      const b = rr(1500, 1800);
                      hiss({ dur: 0.05, gain: 0.12, type: "bandpass", f0: b * 1.7, q: 1.1 });
                      tone({ type: "triangle", f0: b, dur: 0.06, gain: 0.08 });
                      tone({ type: "triangle", f0: b * 1.5, dur: 0.1, gain: 0.06, delay: 0.04 }); },
      // a bow creaking then loosing, and a ballista that sounds like furniture
      bow:    () => { hiss({ dur: 0.17, gain: 0.36, type: "bandpass",
                             f0: rr(1600, 2300), f1: rr(500, 700), q: 0.8 });
                      tone({ type: "sine", f0: rr(300, 360), f1: 140, dur: 0.12, gain: 0.08 }); },
      bolt:   () => { hiss({ dur: 0.3, gain: 0.52, type: "bandpass",
                             f0: rr(1500, 2200), f1: rr(240, 340), q: 0.4 });
                      tone({ type: "sine", f0: rr(130, 165), f1: 58, dur: 0.17, gain: 0.09 }); },
      // the one the demo is selling, so it gets a chord rather than a click
      newbody: () => { [0, 0.07, 0.14, 0.21].forEach((d, i) =>
                         tone({ type: "triangle", f0: [523, 659, 784, 1175][i],
                                dur: 0.55, gain: 0.15, delay: d }));
                       tone({ type: "sine", f0: 98, f1: 44, dur: 0.5, gain: 0.4 });
                       hiss({ dur: 0.5, gain: 0.2, type: "bandpass",
                              f0: 700, f1: 3600, q: 0.6, delay: 0.03 }); },
      merge:  () => { [0, 0.055, 0.11].forEach((d, i) =>
                        tone({ type: "triangle", f0: [523, 659, 880][i], dur: 0.3, gain: 0.16, delay: d }));
                      tone({ type: "sine", f0: 120, f1: 48, dur: 0.34, gain: 0.42 });
                      hiss({ dur: 0.4, gain: 0.14, type: "bandpass", f0: 900, f1: 4200, q: 0.7, delay: 0.02 }); },
      trap:   () => { hiss({ dur: 0.26, gain: 0.68, type: "bandpass",
                             f0: rr(1600, 2400), f1: rr(280, 400), q: 0.35 });
                      tone({ type: "sine", f0: rr(145, 175), f1: 46, dur: 0.18, gain: 0.11 }); },
      wave:   () => { tone({ type: "triangle", f0: 88, f1: 131, dur: 0.9, gain: 0.2 });
                      tone({ type: "sine", f0: 176, f1: 262, dur: 0.8, gain: 0.09, delay: 0.12 }); },
      win:    () => [523, 659, 784, 1046].forEach((f, i) =>
                      tone({ type: "triangle", f0: f, dur: 0.5, gain: 0.17, delay: i * 0.11 })),
      lose:   () => { [392, 330, 262, 196].forEach((f, i) =>
                        tone({ type: "triangle", f0: f, dur: 0.6, gain: 0.16, delay: i * 0.15 }));
                      hiss({ dur: 1.1, gain: 0.14, f0: 500, f1: 70 }); },
    };
    return { wake, play(k) { if (!ctx) return; (lib[k] || (() => {}))(); },
             reset() { ctx = null; master = null; noiseBuf = null; lastClink = 0; },
             toggle() { muted = !muted; return !muted; } };
  })();

  // ================================================================= constants
  const W = 788, H = 542;
  const COLS = 7, ROWS = 5, CELL = 96;
  const OX = 96, OY = 52;
  const K = CELL / 96;              // art was drawn for a 96px cell

  const START_COINS = 400;

  // ---- Appendix A: persistent board + collapsing ground ---------------------
  // The board never resets; the ground does. Persistence alone was what broke this
  // before - board and purse both grew with no ceiling, so waves could not be tuned
  // against an arrival state nobody could predict. Taking cells away restores the
  // ceiling: maximum board power at chamber N is usableCells(N) x 3 parts, a number
  // that was written down rather than one that emerged.
  const PERSIST = {
    collapsed:  [0, 2, 5, 8, 12, 16],   // cumulative cells gone by the START of chamber N
    rightBias:  1.0,                    // weight (col+1)^bias: the ground goes right-to-left
    minPerLane: 2,                      // never seal a lane
    safeCols:   [0],                    // the last ground before the cart never goes
  };

  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const ease = t => t * t * (3 - 2 * t);
  // Blend toward a flash colour instead of blinking the whole body on and off.
  const mixHex = (a, b, t) => {
    if (t <= 0) return a;
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const m = (sh) => Math.round((((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t));
    return "rgb(" + m(16) + "," + m(8) + "," + m(0) + ")";
  };

  // Recharge per card, as the original gives every seed packet its own. Without it
  // you simply spam the cheapest thing the moment you can afford it.
  // Three goblins, and that is the whole roster. Everything else is made by putting
  // one on top of another — the way PvZ Fusion drops a plant onto a plant and gets a
  // new species, rather than a dedicated upgrade card you carry in.
  const UNITS = {
    chucker:  { name: "Chucker",   cost: 70,  hp: 120, tint: "#6fbf5b", recharge: 6 },
    digger:   { name: "Digger",    cost: 50,  hp: 95,  tint: "#c9d45f", recharge: 6 },
    barricade:{ name: "Barricade", cost: 50,  hp: 520, tint: "#3f8a4a", recharge: 14 },
    // Unlocked answers. Sidegrades: each is plainly better against one world rule and
    // unremarkable everywhere else, so none of them is ever required.
    sapper:   { name: "Sapper",    cost: 75,  hp: 150, tint: "#b98a4e", recharge: 9,
                answers: "scree" },
  };
  // Which of those the player mustered. The rack shows only these.
  let ROSTER = ["chucker", "digger", "barricade"];
  // ---------------------------------------------------------------- run upgrades
  // Picked between chambers and kept for the run. They attach to a FOREMAN, so the
  // change shows up on every goblin of that role you place — same rule as their name.
  // Each one changes behaviour rather than nudging a number, so a run's crew ends up
  // shaped differently from the last one's.
  const UPGRADES = {
    ricochet:  { name: "Ricochet",    on: ["chucker"], note: "Shots punch through the rank behind." },
    quarryman: { name: "Quarryman",   on: ["chucker"], note: "Slower. Hits like a landslide." },
    sling:     { name: "Sling",       on: ["chucker"], note: "Twice the rate, half the rock." },
    deepbore:  { name: "Deep Bore",   on: ["digger"],  note: "The pocket underneath lasts twice as long." },
    prospect:  { name: "Prospector",  on: ["digger"],  note: "First pull from fresh ground is tripled." },
    sniffer:   { name: "Coinsniffer", on: ["digger"],  note: "Also takes a cut of kills in its lane." },
    spiked:    { name: "Spiked",      on: ["barricade"], note: "Hurts whatever chews on it." },
    braced:    { name: "Braced",      on: ["barricade"], note: "Half again as much to chew through." },
    packed:    { name: "Packed",      on: ["barricade"], note: "Rockfall cannot bury it." },
    loud:      { name: "Loud",        on: ["*"],       note: "Its lane slows down." },
    cheap:     { name: "Cut-Rate",    on: ["*"],       note: "Costs a third less." },
    quick:     { name: "Quick Hands", on: ["*"],       note: "Recharges twice as fast." },
  };
  // Bought with gold, mid-chamber, and they stack. Small and numeric on purpose — the
  // between-chamber picks are the ones that change how a goblin behaves.
  const SMALLS = {
    // Combat sustain — the wave after this one is bigger, and these answer that.
    sharp:  { name: "Sharper",  note: "+7 damage", base: 60, on: ["chucker", "sapper"] },
    tough:  { name: "Tougher",  note: "+30% hide", base: 55 },
    hands:  { name: "Quicker",  note: "-18% recharge", base: 65,
              on: ["chucker", "barricade", "sapper"] },
    // Economy sustain. By chamber two the ground you started on is going dry, so what
    // is worth buying is a way to keep earning without it — not a faster Digger.
    reseam: { name: "Reseam",   note: "Pockets last 40% longer", base: 85, on: ["digger"] },
    scav:   { name: "Scavenger",note: "+6 gold per kill in its lane", base: 80,
              on: ["chucker", "sapper"] },
    thrift: { name: "Thrifty",  note: "-8 gold to place", base: 70 },
  };
  let SM = {};                        // role -> { id: timesBought }
  let GID = 0;                        // a walker needs to name the body it is joining
  const smallOf = (role, id) => (SM[role] && SM[role][id]) || 0;
  const gobSmall = (g, id) => g.parts.reduce((a, t) => Math.max(a, smallOf(t, id)), 0);

  // role -> list of upgrade ids, set by the meta layer before each chamber
  let UPS = {};
  const hasUp = (role, id) => !!(UPS[role] && UPS[role].indexOf(id) >= 0);
  // a fused body counts as having an upgrade if any part carries it
  const gobHas = (g, id) => g.parts.some(t => hasUp(t, id));

  const MAX_PARTS = 3;

  // A board you rebuild from nothing every chamber must not also cost more each time -
  // the markup existed to tax a board you already owned. With the wipe the ramp comes
  // from hero health and from ground that is already drained.
  const chamberMarkup = () => WIPE_BOARD ? 1 : 1 + (CFG.chamber - 1) * 0.3;
  const costOf = k => Math.max(15,
      Math.round(UNITS[k].cost * (hasUp(k, "cheap") ? 0.66 : 1) * chamberMarkup())
      - smallOf(k, "thrift") * 8);
  const rechargeOf = k => UNITS[k].recharge * (hasUp(k, "quick") ? 0.5 : 1)
                          * Math.pow(0.82, smallOf(k, "hands"));

  const partsKey = g => [...g.parts].sort().join("+");
  const countOf = (g, t) => g.parts.filter(x => x === t).length;

  // Four units make exactly 34 bodies, so every one of them is written down. The
  // generator this replaces produced 119 names by stacking epithets, which is where
  // the "too many similarly named things" complaint comes from in merge games - and
  // 34 is fewer than the number already hand-named once.
  const BODY = {
    "barricade":                     "Barricade",
    "chucker":                       "Chucker",
    "digger":                        "Digger",
    "sapper":                        "Sapper",
    // two
    "barricade+barricade":           "Bulwark",
    "barricade+chucker":             "Loophole",
    "barricade+digger":              "Strongbox",
    "barricade+sapper":              "Shored Wall",
    "chucker+chucker":               "Bowpair",
    "chucker+digger":                "Coinsmith",
    "chucker+sapper":                "Trencher",
    "digger+digger":                 "Deep Shaft",
    "digger+sapper":                 "Pit Crew",
    "sapper+sapper":                 "Spoil Crew",
    // three
    "barricade+barricade+barricade": "Great Wall",
    "barricade+barricade+chucker":   "Redoubt",
    "barricade+barricade+digger":    "Strongroom",
    "barricade+barricade+sapper":    "Buttress",
    "barricade+chucker+chucker":     "Gun Wall",
    "barricade+chucker+digger":      "Countinghouse",
    "barricade+chucker+sapper":      "Bastion Crew",
    "barricade+digger+digger":       "Vault",
    "barricade+digger+sapper":       "Shored Shaft",
    "barricade+sapper+sapper":       "Dug-In Wall",
    "chucker+chucker+chucker":       "Ballista Crew",
    "chucker+chucker+digger":        "Payroll Guard",
    "chucker+chucker+sapper":        "Skirmish Line",
    "chucker+digger+digger":         "Assay Post",
    "chucker+digger+sapper":         "Prospect Guard",
    "chucker+sapper+sapper":         "Sap Line",
    "digger+digger+digger":          "Delve",
    "digger+digger+sapper":          "Deep Crew",
    "digger+sapper+sapper":          "Tunnel Gang",
    "sapper+sapper+sapper":          "Tunnel Crew",
  };
  // A body you have never made before is the moment the demo is selling, so it gets a
  // beat of its own: the game hitches, the name lands, and the ledger fills a slot.
  function noteBody(g) {
    const key = partsKey(g);
    if (S.seen[key]) return false;
    S.seen[key] = true;
    const gp = cellOf(g);
    stop(0.16); kick(11); flash(0.2);
    S.bannerText = nameOf(g).toUpperCase();
    S.banner = 1.9;
    S.newBody = 1;
    ring(gp.x + CELL / 2, gp.y + CELL / 2, 128, "rgba(255,243,207,.9)", 5, 0.55);
    ring(gp.x + CELL / 2, gp.y + CELL / 2, 74, "rgba(232,192,90,.85)", 3, 0.42);
    burst(gp.x + CELL / 2, gp.y + CELL / 2, 30,
          { colors: ["#fff3cf", "#e8c05a", "#8ed07a", tintOf(g)], spread: 380, size: [1.8, 5] });
    popText(gp.x + CELL / 2, gp.y - 12, "NEW", "#8ed07a");
    Sound.play("newbody");
    return true;
  }

  // Four parts make six possible pairings, and every one of them does something. A body
  // gets every interaction for every pair of kinds inside it, so all 30 mixed bodies have
  // a reason to exist rather than just a name - and a three-part body of three kinds gets
  // all three of its pairs at once.
  const PAIRS = [
    { a: "chucker",   b: "digger",    id: "tipped",
      name: "Coin-tipped", note: "Kills in its lane pay half again." },
    { a: "chucker",   b: "barricade", id: "loophole",
      name: "Loopholed",   note: "Takes a third less damage while it has a shot ready." },
    { a: "chucker",   b: "sapper",    id: "staggered",
      name: "Staggering",  note: "Its shove interrupts, resetting what it hits." },
    { a: "digger",    b: "barricade", id: "strongbox",
      name: "Strongbox",   note: "Banks its take. Spills half of it when it dies." },
    { a: "digger",    b: "sapper",    id: "shored",
      name: "Shored",      note: "Cannot be buried, and digs a quarter faster." },
    { a: "barricade", b: "sapper",    id: "propped",
      name: "Propped",     note: "Repairs itself when nothing is chewing on it." },
  ];
  const pairsIn = g => PAIRS.filter(pr => countOf(g, pr.a) > 0 && countOf(g, pr.b) > 0);
  const hasPair = (g, id) => {
    const pr = PAIRS.find(x => x.id === id);
    return !!pr && countOf(g, pr.a) > 0 && countOf(g, pr.b) > 0;
  };

  function nameOf(g) {
    return BODY[partsKey(g)] || UNITS[g.parts[0]].name;
  }

  // A Digger's take is a function of how far forward you put it. No tiles, no lottery:
  // the gradient is continuous and the choice is entirely yours.
  const DIG_EVERY = 5;
  // A closing tunnel pushes you onto the deep seam, so what is left pays better. Without
  // this the collapse compounds against itself: fewer cells means fewer Diggers means
  // less gold means fewer bodies, and the run dies of poverty rather than of heroes.
  // Measured at a flat yield the bot sat broke 50-67% of every chamber.
  const richness = () => 1 + (Object.keys(S.collapsed || {}).length / 35) * 1.9;
  const yieldAt = col => Math.round((3 + col * 1.5) * richness());
  const RICH_MAX = () => yieldAt(COLS - 1);
  // A Digger sinks its shaft deeper the longer it is left alone, so abandoning one
  // costs you the work. Placing a fresh miner elsewhere is no longer free.
  const DIG_WARM = 18;                     // seconds to reach full output
  const DIG_FLOOR = 0.5;                   // what a brand new miner pulls

  // The original opens 1-1 on a single lane and adds lanes as the world goes on. We do
  // the same inside one level, centre-out, so an early wave can never ask you to cover
  // more ground than a cleared wave has paid for.
  const VEIN_PULLS = 26;            // roughly how many payouts a cell has in it
  const RUBBLE_LIFE = 18;          // seconds before a rockfall settles on its own
  const LANE_ORDER = [2, 1, 3, 0, 4];
  // The three-lane opening is a tutorial, and a tutorial you sit through at the top of
  // every chapter is just the game starting slowly four times.
  const tutorial = () => CFG.chamber === 1;
  const lanesOpen = ix => !tutorial() ? 5 : ix < 3 ? 3 : ix < 4 ? 4 : 5;
  // Ground being open is not the same as it being used. Wave 1 comes down a single lane
  // however many are open, because 250 gold buys two Chuckers and no more — three lanes
  // at once is a trap you pay a bear trap for through no fault of your own.
  const laneBudget = ix => !tutorial() ? 99 : ix === 0 ? 1 : ix === 1 ? 2 : 99;
  const laneIsOpen = r => !CFG.shut.includes(r)
                       && LANE_ORDER.indexOf(r) < lanesOpen(Math.max(S.waveIx, 0));
  const isFlooded = c => CFG.flood.includes(c);
  // One predicate for "nothing can stand here": the Scree's timed rubble, water, and
  // ground that has already fallen in.
  const blocked = (c, r) => !!S.buried[c + "," + r] || !!S.collapsed[c + "," + r] || isFlooded(c);

  // Purses are the whole early economy — there is no sun falling from the sky here, so
  // a cleared wave has to pay for the answer to the next one. Wave 1 nets ~60, which is
  // a Digger and change; two cleared waves buy a Chucker.
  const FOES = {
    squire:   { name: "Squire",   hp: 150, speed: 22, dps: 22, purse: 10, pts: 1 },
    scout:    { name: "Scout",    hp: 150, speed: 42, dps: 16, purse: 9, pts: 2 },
    sergeant: { name: "Sergeant", hp: 520, speed: 18, dps: 30, purse: 21, pts: 2 },
    // Chapter 2 onward. Hops the first goblin it meets, so a wall on its own stops being
    // an answer and where you stand things matters again.
    leaper:   { name: "Leaper",   hp: 190, speed: 34, dps: 24, purse: 17, pts: 2, leaps: true },
    // Shrugs off small hits, so chip damage stops working and you have to concentrate.
    pavise:   { name: "Pavise",   hp: 300, speed: 16, dps: 26, purse: 20, pts: 3, soak: 14 },
    // Fast, fragile, and arrives in a clump. Punishes a lane you left thin.
    runner:   { name: "Runner",   hp: 90,  speed: 58, dps: 12, purse: 7, pts: 1 },
    // The ending. It does not walk a lane - it works its way across the board toward
    // whichever lane you have left emptiest, and calls for help into that same lane. A
    // board stacked into one column kills it slowly and loses everywhere else, which is
    // the exact habit the demo spends six chambers trying to break.
    reeve:    { name: "The Reeve", hp: 1600, speed: 10, dps: 38, purse: 90, pts: 6, boss: true },
  };

  // Each world breaks one thing you lean on and names the goblin that answers it —
  // the way PvZ's night takes away sky sun and hands you a Sun-shroom.
  // One route down, four chapters, each one a different kind of squeeze. The numbers a
  // world bends live here rather than as `world === "rot"` checks scattered through the
  // update, because the whole point is that the three costs are comparable.
  //   purse - what a dead hero is worth
  //   dig   - what a pull out of a vein is worth
  //   bore  - how fast a pull eats the seam under it
  const world = () => WORLDS[CFG.world] || WORLDS.hollow;
  const WORLDS = {
    hollow:{ name: "The Hollow", tier: 0, answer: null, purse: 1, dig: 1, bore: 1,
             rule: "Quiet ground. Nothing down here but the heroes.",
             fix: "" },
    scree: { name: "The Scree", tier: 1, answer: "sapper", purse: 1, dig: 1, bore: 1,
             rule: "Rockfall buries a cell every few seconds. You cannot build on rubble.",
             fix: "A Sapper shovels its lane clear." },
  };
  // Six chambers, two worlds. The Rot and The Deep are the reason to want the full
  // game, so they are not in the demo at all.
  const ROUTE = ["hollow", "scree"];
  const CHAMBERS = 6;
  const worldOfChamber = c => c <= 2 ? "hollow" : "scree";
  // Whether the board comes down between chambers. The proposal argues for the wipe on
  // the grounds that placement is the game and six chambers should mean six chances to
  // play it; the current build persists. Kept as a switch so the two can be measured
  // against each other rather than argued about.
  const WIPE_BOARD = true;

  // ---------------------------------------------------------------- route cards
  // Two offered between chambers, each naming what it costs the board and what it gives
  // the roster, so there is one decision and it is "how much board will I sell for this".
  //
  // The guard: randomness may add upside, it may never own a counter, an economy, or a
  // place to stand. Every card therefore carries its own answer - its gain must address
  // the kind of hurt its cost inflicts - which makes any pair safe by construction
  // instead of by careful curation. ROUTE_CARDS is exported so a test can assert it.
  const ROUTE_CARDS = [
    { id: "seam", name: "The narrow seam", where: "down the scree",
      cost: { kind: "lanes", text: "The top and bottom lanes cave in. Three lanes for the rest of the run.",
              apply: r => { r.shut = [0, 4]; } },
      gain: { id: "ricochet", role: "chucker", answers: ["lanes"] } },

    { id: "workings", name: "The old workings", where: "flooded floor",
      cost: { kind: "ground", text: "The middle of the floor floods. Two columns you cannot build on, right where the line wants to be.",
              apply: r => { r.flood = [3, 4]; } },
      gain: { id: "prospect", role: "digger", answers: ["ground"] } },

    { id: "drift", name: "The picked-over drift", where: "worked out",
      cost: { kind: "ground", text: "Someone got here first. Every pocket is half spent.",
              apply: r => { r.drain = (r.drain || 1) * 0.5; } },
      gain: { id: "sniffer", role: "digger", answers: ["ground"] } },

    { id: "gallery", name: "The long gallery", where: "loose roof",
      cost: { kind: "roof", text: "The roof is bad the whole way. Rockfall comes twice as often.",
              apply: r => { r.rubbleEvery = 0.5; } },
      gain: { id: "packed", role: "barricade", answers: ["roof"] } },

    { id: "march", name: "The forced march", where: "they heard you",
      cost: { kind: "tempo", text: "Word is out. Every hero from here on moves a quarter faster.",
              apply: r => { r.speedMul = (r.speedMul || 1) * 1.25; } },
      gain: { id: "quick", role: "chucker", answers: ["tempo"] } },
  ];

  const B_ = "reeve";
  const S_ = "squire", C_ = "scout", G_ = "sergeant", L_ = "leaper",
        P_ = "pavise", R_ = "runner";
  const WAVES = [
    // One new thing per wave, the way 1-2 adds a Conehead rather than a tougher Basic.
    // Waves 1-3 are squires on three lanes: enough to learn the lane and bank a purse.
    { name: "First light",   list: [S_,S_,S_] },
    { name: "They regroup",  list: [S_,S_,S_,S_,S_] },
    { name: "Outriders",     list: [S_,S_,S_,S_,S_,S_,S_] },
    // Fourth lane caves in here, and the scouts arrive with it.
    { name: "Fast ones",     list: [S_,S_,C_,S_,S_,C_,S_,C_,S_,S_] },
    // Fifth lane, and the first armour.
    { name: "Armour up",     list: [S_,C_,S_,G_,S_,S_,C_,G_,S_,C_,S_,S_,G_,C_] },
    { name: "Last of them",  list: [G_,S_,C_,G_,S_,S_,C_,S_,G_,S_,C_,S_,G_,S_,C_,S_,G_,C_,G_,S_,C_,G_,S_,G_] },
  ];

  // ===================================================================== state
  // Set by the meta layer before each chamber.
  // A route card's cost is a permanent change to the board, so it lives on CFG and is
  // handed back in every chamber after the one that took it.
  let CFG = { world: null, chapter: 1, chamber: 1, roles: ["chucker","digger","barricade"],
              shut: [], flood: [], rubbleEvery: 1, speedMul: 1 };
  let S;
  function newRun() {
    S = {
      coins: START_COINS, waveIx: -1, phase: "intro", phaseT: 5.0, waveStack: 0,
      callLane: -1, callT: 0,
      goblins: [], foes: [], shots: [], parts: [], rings: [], pops: [], loot: [],
      traps: new Array(ROWS).fill(CFG.world !== "deep"),
      cart: CFG.world === "deep" ? 3 : 0,
      cool: Object.fromEntries(Object.keys(UNITS).map(k => [k, 0])),
      buried: {}, buryT: 14, veins: {}, collapsed: {}, cracking: {},
      laneLoad: new Array(ROWS).fill(0), laneQuiet: new Array(ROWS).fill(0), spawnCount: 0,
      waveLanes: [],
      // 0 = still caved in, 1 = open ground. Closed lanes are rubble you cannot build on.
      laneReveal: new Array(ROWS).fill(0)
        .map((_, r) => CFG.chamber > 1 || LANE_ORDER.indexOf(r) < 3 ? 1 : 0),
      // ground being open and heroes being allowed down it are two different things
      laneLive: new Array(ROWS).fill(0)
        .map((_, r) => CFG.chamber > 1 || LANE_ORDER.indexOf(r) < 3 ? 1 : 0),
      laneFlash: new Array(ROWS).fill(0),
      selUnit: null, selGob: null, walkers: [],
      // What the run has built, what it has lost, and which lanes did the work. The
      // ending is made of these.
      seen: {}, goblinDeaths: 0, killLanes: {}, chuckerLanes: {}, marches: 0,
      shake: 0, freeze: 0, flash: 0, banner: 0, bannerText: "",
      over: false, won: false, paused: false, t: 0, killed: 0, mined: 0, rate: 0,
    };
  }

  newRun();

  const cellOf = g => ({ x: OX + g.col * CELL, y: OY + g.row * CELL });
  const laneY = r => OY + r * CELL;
  // How much you have standing in each lane, in bodies. The Reeve reads this and goes
  // where the answer is "not much".
  function laneWeight(r) {
    return S.goblins.reduce((a, g) => a + (g.row === r && g.hp > 0 ? g.parts.length : 0), 0);
  }
  function emptiestLane() {
    let best = null;
    for (let r = 0; r < ROWS; r++) {
      if (!laneIsOpen(r)) continue;
      const w = laneWeight(r);
      if (!best || w < best.w) best = { r, w };
    }
    return best ? best.r : 2;
  }
  const gobAt = (c, r) => S.goblins.find(g => g.col === c && g.row === r && g.hp > 0);
  const maxHpOf = g => g.parts.reduce((a, t) => a + UNITS[t].hp, 0)
                       * (g.parts.length > 1 ? 0.72 : 1)
                       * (gobHas(g, "braced") ? 1.5 : 1)
                       * (1 + 0.3 * gobSmall(g, "tough"));
  const spentOn = g => g.parts.reduce((a, t) => a + UNITS[t].cost, 0);
  function tintOf(g) {
    if (g.parts.length === 1) return UNITS[g.parts[0]].tint;
    const rgb = g.parts.map(t => UNITS[t].tint)
      .map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
    const avg = [0, 1, 2].map(i => Math.round(rgb.reduce((s, c) => s + c[i], 0) / rgb.length));
    return "#" + avg.map(v => v.toString(16).padStart(2, "0")).join("");
  }

  const kick = a => { S.shake = Math.min(12, Math.max(S.shake, a)); };
  const stop = s => { S.freeze = Math.max(S.freeze, s); };
  const flash = a => { S.flash = Math.max(S.flash, a); };

  function burst(x, y, n, opt = {}) {
    const { spread = 190, life = [0.3, 0.7], size = [2, 4.5], colors = ["#a89b8c"],
            gravity = 620, dir = null, cone = 6.283 } = opt;
    for (let i = 0; i < n; i++) {
      const a = dir === null ? Math.random() * 6.283 : dir + rnd(-cone / 2, cone / 2);
      const sp = rnd(spread * 0.35, spread);
      S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rnd(0, 90),
                     life: rnd(life[0], life[1]), r: rnd(size[0], size[1]),
                     c: pick(colors), g: gravity, spin: rnd(-9, 9), rot: rnd(0, 6.3) });
    }
  }
  const ring = (x, y, r, c, w = 3, life = 0.34) => S.rings.push({ x, y, r0: 5, r1: r, t: 0, life, c, w });
  const popText = (x, y, text, c) => S.pops.push({ x, y, text, c, t: 0, life: 0.8 });

  // Gold takes itself home. Collecting by hand was a chore, not a decision.
  function spill(x, y, value, colors) {
    const n = clamp(Math.round(value / 9), 1, 5);
    for (let i = 0; i < n; i++) {
      S.loot.push({
        x: x + rnd(-7, 7), y: y + rnd(-5, 5),
        vx: rnd(-90, 130), vy: rnd(-230, -120),
        value: i === n - 1 ? value - Math.round(value / n) * (n - 1) : Math.round(value / n),
        t: 0, hop: rnd(0.28, 0.46), spin: rnd(0, 6.3), spinV: rnd(-9, 9),
        c: colors || ["#e8c05a"],
      });
    }
  }

  // ===================================================================== waves
  // A chamber runs a slice of the wave table; deeper chapters run more of it, and the
  // heroes themselves get tougher. Three chambers to a chapter.
  // Six chambers of roughly two minutes, not three of five. The old ramp
  // (3 + chamber*2) put the entire wave table in chamber 2 - survivable only because
  // you walked in with a board already standing.
  const CHAMBER_WAVE_COUNT = [3, 3, 4, 4, 4, 3];
  // A column, not a crowd. Front-loaded single-target damage kills the front rank very
  // well and the queue behind it keeps walking, so the answer is anything that reaches
  // past it - splash, a shove, a slow, or a wall bought with what a Digger earned. Every
  // one of those is a body made of more than one kind of goblin, which is the behaviour
  // the fusion system needs and cannot otherwise ask for.
  const COLUMN = { name: "Down one throat", list: [S_,G_,S_,S_,G_,S_,G_,S_,S_,G_,S_,G_], stack: 1 };
  const BOSS   = { name: "The Reeve", list: [B_], boss: true };
  function wavesForChamber() {
    const c = Math.min(CFG.chamber, CHAMBERS);
    const n = CHAMBER_WAVE_COUNT[c - 1] || 3;
    const out = WAVES.slice(0, Math.min(WAVES.length, n));
    // The column is chamber 5's lesson and the Reeve is chamber 6's exam. Running both
    // in the last chamber meant a column, then another column, then the boss, with no
    // room to rebuild in between - which is what it felt like.
    if (c === CHAMBERS - 1) out.push(COLUMN);
    if (c === CHAMBERS) out.push(BOSS);
    return out;
  }
  let CHAMBER_WAVES = WAVES;
  // The board carries across a chapter, so each chamber has to ask a good deal more
  // than the last or the second and third are a victory lap.
  // Four chapters now, so the per-chapter step is smaller than it was across three -
  // the ladder ends in the same place, it just has more rungs.
  const hpScale = () => 1 + (CFG.chamber - 1) * 0.17;

  function startWave() {
    S.waveIx++;
    if (S.waveIx >= CHAMBER_WAVES.length) { victory(); return; }
    const w = CHAMBER_WAVES[S.waveIx];
    let t = 0;
    const gap = w.stack ? 0.42 : Math.max(0.5, 1.6 - S.waveIx * 0.17);
    // Deeper CHAPTERS send more bodies; deeper chambers do not. Stacking extra spawns
    // on top of the per-chamber hp ramp and the price markup made chamber three
    // unwinnable rather than hard — measured at 0% held across every wave multiplier
    // tried, while the markup alone left it contested.
    const extra = Math.round((CFG.chapter - 1) * 0.25 * w.list.length);
    const list = w.list.concat(Array.from({ length: extra }, () => pick(w.list)));
    S.queue = list.map(type => {
      t += rnd(gap * 0.65, gap * 1.5);
      if (w.stack && t < 3.2) t = 3.2 + t * 0.4;      // the warning has to land first
      // deeper chapters send leapers in place of scouts — a different problem, not a
      // bigger one, which is the whole point of going down
      let swap = type;
      if (CFG.chapter >= 2 && type === C_ && Math.random() < 0.55) swap = L_;
      if (CFG.chapter >= 3 && type === G_ && Math.random() < 0.5) swap = P_;
      if (S.waveIx >= 3 && type === S_ && Math.random() < 0.3) swap = R_;
      return { type: swap, at: t };
    });
    S.waveLanes = [];
    S.waveStack = w.stack || 0;
    if (w.stack) {
      // Name it, mark the lane, and give the player the breath to answer it. A column
      // that turns up unannounced is indistinguishable from a bug.
      S.callLane = emptiestLane();
      S.callT = 3.2;
      popText(W - 120, laneY(S.callLane) + CELL * 0.4, "THEY MASS HERE", "#d1553f");
      ring(W - 90, laneY(S.callLane) + CELL * 0.5, 190, "rgba(209,85,63,.8)", 5, 0.8);
      kick(7); stop(0.06);
    } else { S.callLane = -1; S.callT = 0; }
    for (let r = 0; r < ROWS; r++) { S.laneLoad[r] *= 0.7; if (S.laneQuiet[r] > 0) S.laneQuiet[r]--; }
    S.phase = "fight"; S.phaseT = 0;
    S.bannerText = "WAVE " + (S.waveIx + 1) + " — " + w.name.toUpperCase();
    S.banner = 2.1;
    Sound.play("wave"); kick(2.5); renderPips();
  }

  function chooseLane() {
    let open = LANE_ORDER.slice(0, lanesOpen(S.waveIx)).filter(r => S.laneLive[r]);
    if (!open.length) open = LANE_ORDER.slice(0, lanesOpen(S.waveIx));
    const cap = Math.min(S.waveStack || laneBudget(S.waveIx), open.length);
    // Once a wave has spent its lane allowance it keeps coming down the lanes it already
    // opened with, rather than picking a fresh one you have nothing standing in.
    const pool = S.waveLanes.length >= cap ? S.waveLanes : open;
    const take = r => { if (!S.waveLanes.includes(r)) S.waveLanes.push(r); return r; };
    // a column goes down the lane you have least in, so it cannot be pre-answered
    if (S.waveStack && !S.waveLanes.length) return take(emptiestLane());
    if (S.spawnCount < 2 && pool === open) return take(pick(pool));
    const w = pool.map(r => S.laneQuiet[r] > 0 ? 1e-6 : 1 / (1 + S.laneLoad[r]));
    const tot = w.reduce((a, b) => a + b, 0);
    let x = Math.random() * tot;
    for (let i = 0; i < pool.length; i++) { x -= w[i]; if (x <= 0) return take(pool[i]); }
    return take(pool[pool.length - 1]);
  }

  function spawnFoe(type, lane) {
    const d = FOES[type];
    const hp = Math.round(d.hp * hpScale());
    S.foes.push({ type, lane, x: W + 26, hp, maxHp: hp,
                  speed: d.speed * rnd(0.82, 1.18) * CFG.speedMul, hitT: 0, bleeding: false,
                  bob: rnd(0, 6.3), squash: 0, step: 0, dead: false });
    S.spawnCount++; S.laneLoad[lane] += d.pts;
  }

  let onChamberEnd = null;
  const survivors = () => S.goblins.filter(g => g.hp > 0).map(g => ({
    parts: g.parts.slice(), col: g.col, row: g.row, age: g.age || 0,
    hpFrac: clamp(g.hp / maxHpOf(g), 0.15, 1),
  }));
  // What the chamber is worth to the ending screen.
  function report() {
    const paid = Object.keys(S.killLanes)
                       .filter(r => !S.chuckerLanes[r]).map(Number);
    return { seen: Object.assign({}, S.seen), deaths: S.goblinDeaths,
             kills: S.killed, paidForItself: paid.length > 0,
             traps: S.traps.slice(), marches: S.marches || 0 };
  }

  function victory() {
    // Anyone still on the road when the last hero drops digs in where they are, rather
    // than being deleted by the timing of the win.
    for (const w of S.walkers) landWalker(w);
    S.walkers = [];
    S.over = true; S.won = true; Sound.play("win"); kick(14); flash(0.5);
    for (let i = 0; i < 5; i++)
      setTimeout(() => burst(rnd(250, 900), rnd(120, 380), 24,
        { colors: ["#e8c05a", "#fff3cf", "#8ed07a"], spread: 320 }), i * 170);
    if (onChamberEnd)
      setTimeout(() => onChamberEnd(true, Math.round(S.coins), survivors(),
                                    Object.assign({}, S.veins), SM, report()), 1500);
  }
  function defeat() {
    if (S.over) return;
    S.over = true; S.won = false; Sound.play("lose"); kick(20); stop(0.14); flash(0.55);
    burst(OX, H / 2, 40, { colors: ["#e8c05a", "#8a7134", "#d1553f"], spread: 420 });
    if (onChamberEnd)
      setTimeout(() => onChamberEnd(false, Math.round(S.coins), survivors(),
                                    Object.assign({}, S.veins), SM, report()), 1800);
  }

  // ==================================================================== update
  function update(dt) {
    S.t += dt;
    stepWalkers(dt);
    for (const k in S.cool) if (S.cool[k] > 0) S.cool[k] = Math.max(0, S.cool[k] - dt);
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 95);
    if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 3.4);
    if (S.banner > 0) S.banner -= dt;

    // Ground opens up as the level goes on. The rubble breaking is the only notice you
    // get that a new lane is live — no text, you just watch it cave in.
    for (let r = 0; r < ROWS; r++) {
      const want = laneIsOpen(r) ? 1 : 0;
      if (S.laneReveal[r] === 0 && want === 1) {
        const y = OY + r * CELL + CELL / 2;
        for (let i = 0; i < 9; i++)
          burst(OX + rnd(0, COLS * CELL), y + rnd(-20, 20), 8,
                { colors: ["#4a4150", "#3b3340", "#6b5f4a"], spread: 230,
                  size: [1.6, 4.6], gravity: 460, life: [0.3, 0.8] });
        ring(OX + COLS * CELL * 0.5, y, COLS * CELL * 0.6, "rgba(232,192,90,.7)", 5, 0.6);
        S.laneFlash[r] = 2.6;
        S.bannerText = "A LANE OPENS";
        S.banner = 2.0;
        kick(9); stop(0.06); Sound.play("wave");
      }
      if (S.laneReveal[r] !== want)
        S.laneReveal[r] = clamp(S.laneReveal[r] + (want ? dt : -dt) * 0.55, 0, 1);
      if (S.laneFlash[r] > 0) S.laneFlash[r] -= dt;
      // nothing comes down it until it has finished opening and you have had a beat
      if (S.laneReveal[r] >= 1 && S.laneFlash[r] <= 0) S.laneLive[r] = 1;
    }

    // ---- the world rule
    if (CFG.world === "scree" && S.phase !== "intro" && !S.over) {
      for (const k in S.buried) {
        S.buried[k] -= dt;
        if (S.buried[k] > 0) continue;
        delete S.buried[k];
        const [cc, rr] = k.split(",").map(Number);
        burst(OX + cc * CELL + CELL / 2, OY + rr * CELL + CELL / 2, 6,
              { colors: ["#4a4150", "#6b5f4a"], spread: 120, size: [1.2, 2.6], life: [0.2, 0.45] });
      }
      S.buryT -= dt;
      // never more than a few at once, or the board quietly disappears
      if (S.buryT <= 0 && Object.keys(S.buried).length < 3) {
        S.buryT = 12 * CFG.rubbleEvery;
        const free = [];
        for (let c = 1; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
          if (!laneIsOpen(r) || blocked(c, r)) continue;
          // occupied cells are fair game — burying a working goblin is the threat
          free.push([c, r]);
        }
        if (free.length) {
          const [c, r] = pick(free);
          S.buried[c + "," + r] = RUBBLE_LIFE;
          const bx = OX + c * CELL + CELL / 2, by = OY + r * CELL + CELL / 2;
          burst(bx, by, 14, { colors: ["#4a4150", "#3b3340", "#6b5f4a"], spread: 210,
                              size: [1.8, 4.4], gravity: 500 });
          ring(bx, by, 54, "rgba(120,110,130,.6)", 3, 0.35);
          kick(4); Sound.play("dig");
        }
      }
    }

    if (S.phase === "intro") { S.phaseT -= dt; if (S.phaseT <= 0) startWave(); }
    else if (S.phase === "fight") {
      S.phaseT += dt;
      while (S.queue.length && S.queue[0].at <= S.phaseT) {
        const e = S.queue.shift();
        spawnFoe(e.type, e.lane !== undefined ? e.lane : chooseLane());
      }
      // the next wave comes when this one is mostly broken, the way the original does it,
      // rather than after the board is clear and a long pause on top
      // The trigger pulls the NEXT wave forward. On the last one there is no next wave,
      // so it would end the chamber with heroes still walking — clear the board first.
      const last = S.waveIx >= CHAMBER_WAVES.length - 1;
      const spent = !last && !S.queue.length && S.foes.length &&
                    S.foes.reduce((a, f) => a + f.hp, 0) <
                    S.foes.reduce((a, f) => a + f.maxHp, 0) * 0.45;
      if (!S.queue.length && (!S.foes.length || spent)) {
        S.phase = "breath";
        // PvZ leaves 25-31s between waves. Ours end on a clear board rather than on a
        // health trigger, so the gap is shorter, but it still has to be long enough to
        // spend a purse in — 3s was not.
        S.phaseT = S.waveIx >= CHAMBER_WAVES.length - 1 ? 0.6 : 2.2;
      }
    } else if (S.phase === "breath") { S.phaseT -= dt; if (S.phaseT <= 0) startWave(); }

    // ---- goblins
    let rate = 0;
    for (const g of S.goblins) {
      if (g.hp <= 0) continue;
      if (countOf(g, "chucker") > 0) S.chuckerLanes[g.row] = true;
      const p = cellOf(g);
      // under a rockfall: still there, still soaks hits, but not working
      const ownKey = g.col + "," + g.row;
      if (S.buried[ownKey] && !gobHas(g, "packed") && !hasPair(g, "shored")) {
        g.entombed = 1;
        // Everything under a rockfall stops working - except the goblin whose whole job is
        // rubble. It digs itself out, and only itself, at half the speed it clears a
        // neighbour: a rockfall still costs the lane its Sapper for a few seconds, rather
        // than parking it for the full eighteen with no way to answer.
        if (countOf(g, "sapper") > 0) {
          g.dug = (g.dug || 0) + dt * countOf(g, "sapper");
          if (g.dug >= 4.4) {
            delete S.buried[ownKey];
            g.dug = 0; g.squash = 1.2;
            popText(p.x + CELL / 2, p.y + 6, "DUG OUT", "#e8c05a");
            burst(p.x + CELL / 2, p.y + CELL / 2, 12,
                  { colors: ["#4a4150", "#b98a4e", "#e8c05a"], spread: 220, size: [1.4, 3.4] });
            Sound.play("dig");
          }
        }
        continue;
      }
      g.dug = 0;
      g.entombed = 0;
      // Propped: props and shoring hold a wall up between attacks
      if (hasPair(g, "propped") && S.t - (g.lastHit || -99) > 2.5 && g.hp < maxHpOf(g)) {
        g.hp = Math.min(maxHpOf(g), g.hp + 9 * dt);
        if (Math.random() < dt * 1.4)
          burst(p.x + CELL * 0.5, p.y + CELL * 0.4, 1,
                { colors: ["#6fbf5b"], spread: 40, size: [1.2, 2.2], life: [0.3, 0.6] });
      }
      g.cd -= dt;
      if (g.squash > 0) g.squash -= dt * 3.4;
      if (g.hurtT > 0) g.hurtT -= dt;
      if (g.land > 0) g.land -= dt * 2.6;
      if (g.recoil > 0) g.recoil -= dt * 6;

      // How many Chuckers went into it decides the weapon: one arm throws a rock, two
      // share a bow too big for either, three crew a ballista.
      // A Sapper throws gravel — weaker than a rock, but it is not standing there idle.
      const cn = countOf(g, "chucker") + (countOf(g, "sapper") > 0 ? 1 : 0)
                                       + (countOf(g, "hollerer") > 0 ? 1 : 0);
      if (cn > 0) {
        const target = S.foes.find(f => f.lane === g.row && f.hp > 0 && f.x > p.x - 10);
        g.wind = target && g.cd < 0.32 ? clamp(1 - g.cd / 0.32, 0, 1) : 0;
        if (target && g.cd <= 0) {
          g.recoil = 1; g.wind = 0;
          // a body with no actual Chucker in it throws gravel, not rocks
          const weak = countOf(g, "chucker") === 0;
          let spec = cn === 1 ? { cd: weak ? 1.7 : 1.3, dmg: weak ? 12 : 22,
                                  pierce: 0, kind: "rock", snd: "throw" }
                   : cn === 2 ? { cd: 1.25, dmg: 42, pierce: 0, kind: "arrow", snd: "bow" }
                              : { cd: 1.2,  dmg: 61, pierce: 0, kind: "bolt",  snd: "bolt" };
          // the run's upgrades reshape the shot rather than scaling it
          if (gobHas(g, "quarryman")) spec = { ...spec, cd: spec.cd * 1.8,
                                               dmg: Math.round(spec.dmg * 2.6), kind: "bolt" };
          if (gobHas(g, "sling"))     spec = { ...spec, cd: spec.cd * 0.5,
                                               dmg: Math.round(spec.dmg * 0.55) };
          if (gobHas(g, "ricochet"))  spec = { ...spec, pierce: Math.max(spec.pierce, cn) };
          spec = { ...spec, dmg: spec.dmg + 7 * gobSmall(g, "sharp") };
          // what the body is made of decides what comes out of it
          if (countOf(g, "keg") > 0)
            spec = { ...spec, kind: "bomb", aoe: 46 + 14 * countOf(g, "keg"),
                     aoeDmg: Math.round(spec.dmg * 0.55), snd: "throw" };
          // A shove staggers. It used to be 12px a shot per Sapper, which against a
          // squire's 28px of walking beat the walk outright - three of them drove
          // heroes backwards off the right edge of the board and simply won.
          if (countOf(g, "hollerer") > 0) spec = { ...spec, slow: 1.1 };
          if (countOf(g, "sapper") > 0)
            spec = { ...spec, shove: Math.min(10, 4 * countOf(g, "sapper")) };
          if (hasPair(g, "tipped"))    spec = { ...spec, tipped: true };
          if (hasPair(g, "staggered")) spec = { ...spec, stagger: true };
          g.cd = spec.cd;
          S.shots.push({ x: p.x + CELL * 0.62, y: p.y + CELL * 0.46, lane: g.row,
                         dmg: spec.dmg, pierce: spec.pierce, kind: spec.kind, trail: [], spin: 0,
                         aoe: spec.aoe, aoeDmg: spec.aoeDmg, slow: spec.slow,
                         shove: spec.shove, bounty: spec.bounty,
                         tipped: spec.tipped, stagger: spec.stagger });
          if (cn === 3) kick(3);
          Sound.play(spec.snd);
          burst(p.x + CELL * 0.64, p.y + CELL * 0.46, 3,
                { colors: ["#cbbfa8"], spread: 70, size: [1.2, 2.2], dir: 0, cone: 1.1,
                  gravity: 260, life: [0.12, 0.25] });
        }
      }

      // A Powder Keg waits for something to reach it and takes the lane with it.
      if (countOf(g, "keg") > 0) {
        const near = S.foes.find(f => f.lane === g.row && f.hp > 0 &&
                                      f.x < p.x + CELL * 1.15 && f.x > p.x - CELL);
        if (near) {
          const bx = p.x + CELL / 2, by = p.y + CELL * 0.5;
          for (const f of S.foes) if (f.lane === g.row && f.hp > 0 && f.x > p.x - CELL * 0.5)
            f.hp -= 260 * countOf(g, "keg");
          g.hp = 0;
          ring(bx, by, 210, "rgba(232,192,90,.85)", 6, 0.45);
          ring(bx, by, 120, "rgba(209,85,63,.9)", 4, 0.3);
          burst(bx, by, 34, { colors: ["#e8c05a", "#fff3cf", "#d1553f", "#8a7134"], spread: 420 });
          popText(bx, p.y, "BOOM", "#e8c05a");
          kick(13); stop(0.09); flash(0.3); Sound.play("trap");
        }
      }

      // A Sapper keeps its own lane clear of rubble.
      if (countOf(g, "sapper") > 0) {
        g.scd = (g.scd || 0) - dt;
        if (g.scd <= 0) {
          g.scd = 2.2;
          for (const k in S.buried) {
            const [bc, br] = k.split(",").map(Number);
            if (br !== g.row) continue;
            delete S.buried[k];
            burst(OX + bc * CELL + CELL / 2, OY + br * CELL + CELL / 2, 9,
                  { colors: ["#4a4150", "#b98a4e"], spread: 190, size: [1.4, 3.2] });
            Sound.play("dig");
            break;
          }
        }
      }

      // The further forward it stands, the more it pulls out — and the more exposed
      // it is. That trade is the entire economic decision.
      const dn = countOf(g, "digger");
      if (dn > 0) {
        g.age = (g.age || 0) + dt;
        // more picks means a faster shaft as well as a bigger pull
        const warm = DIG_FLOOR + (1 - DIG_FLOOR) * Math.min(1, g.age * dn / DIG_WARM);
        const seam = world().dig;
        const vk = g.col + "," + g.row;
        if (S.veins[vk] === undefined) S.veins[vk] = 1;
        const left = S.veins[vk];
        // Prospector cashes in on fresh ground, which pushes you to keep moving
        const rich = gobHas(g, "prospect") && left > 0.92 ? 3 : 1;
        const shored = hasPair(g, "shored") ? 1.25 : 1;   // a propped shaft works faster
        const take = Math.max(0, Math.round(yieldAt(g.col) * warm * (1 + (dn - 1) * 0.85)
                                            * seam * left * rich * shored));
        rate += take / DIG_EVERY;
        if (g.dcd === undefined) g.dcd = 1.2;
        g.dcd -= dt;
        if (g.dcd <= 0) {
          g.dcd = DIG_EVERY;
          // every pull takes a bite out of the pocket under it
          const bore = world().bore * (gobHas(g, "deepbore") ? 0.5 : 1)
                       * Math.pow(0.71, gobSmall(g, "reseam"));
          S.veins[vk] = Math.max(0, S.veins[vk] - (1 / VEIN_PULLS) * dn * bore);
          if (take <= 0) {
            g.squash = 0.6;
            popText(p.x + CELL / 2, p.y + 8, "DRY", "#8a8095");
            continue;
          }
          S.mined += take;
          // Strongbox: a wall around a mine is somewhere to put the takings
          if (hasPair(g, "strongbox")) g.banked = (g.banked || 0) + Math.round(take * 0.5);
          g.squash = 1;
          spill(p.x + CELL / 2, p.y + CELL * 0.55, take);
          // a richer pull throws more rock, so the gradient is visible in the payout
          const heft = take / RICH_MAX();
          burst(p.x + CELL / 2, p.y + CELL * 0.72, Math.round(4 + heft * 9),
                { colors: ["#6b5a52", "#8a7768", "#c9a24a"], spread: 110 + heft * 130,
                  size: [1.3, 2.4 + heft * 2.4], gravity: 460, life: [0.22, 0.5] });
          ring(p.x + CELL / 2, p.y + CELL * 0.6, 20 + heft * 34,
               "rgba(232,192,90," + (0.2 + heft * 0.4) + ")", 2, 0.3);
          Sound.play("dig");
        }
      }
    }
    S.rate = rate;
    for (const g of S.goblins) if (g.hp <= 0 && !g.mourned) {
      g.mourned = true; S.goblinDeaths++;
      if (g.banked > 0) {                       // Strongbox: the takings survive it
        const gp = cellOf(g);
        spill(gp.x + CELL / 2, gp.y + CELL * 0.5, g.banked);
        popText(gp.x + CELL / 2, gp.y - 2, "+" + g.banked + " SPILLED", "#e8c05a");
      }
    }
    S.goblins = S.goblins.filter(g => g.hp > 0);
    if (S.selGob && S.selGob.hp <= 0) S.selGob = null;

    // ---- shots
    for (const s of S.shots) {
      s.x += 430 * dt; s.spin += dt * 16;
      s.trail.push({ x: s.x, y: s.y });
      if (s.trail.length > 6) s.trail.shift();
      const f = S.foes.find(f => f.lane === s.lane && f.hp > 0 && Math.abs(f.x - s.x) < 22
                                 && !(s.hitSet && s.hitSet.has(f)));
      if (f) {
        const soak = FOES[f.type].soak || 0;
        f.hp -= Math.max(4, s.dmg - soak); f.hitT = 0.12; f.squash = 1;
        f.x += 3 + (s.shove || 0);
        if (s.slow) f.slowT = Math.max(f.slowT || 0, s.slow);
        if (s.bounty) f.bounty = (f.bounty || 0) + s.bounty;
        if (s.tipped) f.tipped = true;
        // Staggering: the shove does not just move it, it interrupts. Whatever it was
        // chewing on gets a breath, which is what makes a Trencher worth building.
        if (s.stagger) {
          f.stunT = Math.max(f.stunT || 0, 0.55);
          burst(f.x, laneY(f.lane) + CELL * 0.4, 3,
                { colors: ["#e8c05a", "#fff3cf"], spread: 130, size: [1.2, 2.6], life: [0.1, 0.3] });
        }
        if (s.aoe) {
          // a little bomb: everything close by in the lane catches some of it
          for (const o of S.foes) {
            if (o === f || o.lane !== s.lane || o.hp <= 0) continue;
            if (Math.abs(o.x - s.x) > s.aoe) continue;
            o.hp -= Math.max(3, s.aoeDmg - (FOES[o.type].soak || 0));
            o.hitT = 0.1; o.squash = 0.7;
          }
          ring(s.x, s.y, s.aoe * 1.6, "rgba(232,192,90,.7)", 3, 0.22);
          burst(s.x, s.y, 9, { colors: ["#e8c05a", "#fff3cf", "#d1553f"], spread: 260,
                               size: [1.4, 3.2], life: [0.14, 0.36] });
          kick(2.4); Sound.play("hit");
        }
        if (soak && s.dmg <= soak + 4)
          burst(s.x, s.y, 3, { colors: ["#d9cdb4", "#8d8496"], spread: 90,
                               size: [1.2, 2.2], life: [0.1, 0.25] });
        if (s.pierce > 0) {
          (s.hitSet = s.hitSet || new Set()).add(f);
          s.pierce--;
        } else s.dead = true;
        burst(s.x, s.y, 7, { colors: ["#d8cbb4", "#8f8577"], spread: 220, size: [1.4, 3],
                             dir: Math.PI, cone: 2.2, gravity: 420, life: [0.14, 0.36] });
        ring(s.x, s.y, 22, "rgba(255,255,255,.5)", 2, 0.16);
        Sound.play("hit");
      }
      if (s.x > W + 30) s.dead = true;
    }
    S.shots = S.shots.filter(s => !s.dead);

    // ---- foes
    for (const f of S.foes) {
      if (f.hp <= 0) continue;
      const d = FOES[f.type];
      const prev = f.x;
      // A Hollerer's lane crawls, because everyone in it stops to argue.
      if (f.slowT > 0) f.slowT -= dt;
      const jeering = S.goblins.some(g => g.row === f.lane &&
                                     (countOf(g, "hollerer") > 0 || gobHas(g, "loud")));
      // The two slows do not multiply. A Loud lane at half speed times a Hollerer's
      // shot at 0.55 left heroes at a quarter pace with nothing to do about it.
      const jeer = Math.min(jeering ? 0.82 : 1, f.slowT > 0 ? 0.62 : 1);
      if (jeering && Math.random() < dt * 2.2)
        burst(f.x, laneY(f.lane) + CELL * 0.3, 2,
              { colors: ["#9a7fc4", "#c9b6e8"], spread: 60, size: [1.4, 2.6],
                dir: -1.57, cone: 1.2, gravity: -40, life: [0.3, 0.6] });
      f.bob += dt * (f.type === "scout" ? 11 : 7);
      if (f.hitT > 0) f.hitT -= dt;
      if (f.squash > 0) f.squash -= dt * 4;
      if (!f.bleeding && f.hp / f.maxHp <= 0.33) {
        f.bleeding = true;
        burst(f.x, laneY(f.lane) + 20, 8, { colors: ["#c9ced8", "#8b93a2"], spread: 180, size: [1.4, 3] });
      }
      if (f.bleeding && !d.boss) f.hp -= 11 * dt;

      // ---- The Reeve steers and shouts
      if (d.boss) {
        if (f.laneF === undefined) { f.laneF = f.lane; f.dir = f.lane < 2 ? 1 : -1; }
        // It walks the width of the board, not a lane: a steady sweep up and down while it
        // advances. Two earlier versions failed. Hunting the emptiest lane on a timer made
        // it unkillable - there is always a softest lane and it just walked down it - and
        // flinching away from damage did the same thing for the same reason. A sweep is
        // indifferent to your board, which is what makes your board the thing being tested:
        // guns in one lane only touch it a fifth of the time, and the four lanes you left
        // empty are where it is calling everyone else.
        f.sweepT = (f.sweepT === undefined ? 2.2 : f.sweepT) - dt;
        if (f.sweepT <= 0) {
          f.sweepT = 2.6;
          let next = f.lane + f.dir;
          if (next < 0 || next >= ROWS || !laneIsOpen(next)) {
            f.dir *= -1;
            next = f.lane + f.dir;
          }
          if (next >= 0 && next < ROWS && laneIsOpen(next)) {
            f.lane = next; f.squash = 1.2;
            ring(f.x, laneY(f.lane) + CELL * 0.5, 62, "rgba(209,85,63,.55)", 3, 0.36);
          }
        }
        f.laneF += (f.lane - f.laneF) * Math.min(1, dt * 3.4);
        f.callT = (f.callT === undefined ? 6 : f.callT) - dt;
        if (f.callT <= 0) {
          f.callT = 15;
          const into = emptiestLane();
          popText(f.x, laneY(f.lane) - 4, "TO ME!", "#d1553f");
          ring(f.x, laneY(f.lane) + CELL * 0.5, 150, "rgba(209,85,63,.75)", 4, 0.5);
          kick(6); Sound.play("wave");
          for (let i = 0; i < 2; i++)
            S.queue.push({ type: i === 1 ? G_ : S_, at: S.phaseT + 0.25 + i * 0.35, lane: into });
          S.queue.sort((a, b) => a.at - b.at);
        }
      }

      const col = Math.floor((f.x - OX) / CELL);
      const wall = col >= 0 && col < COLS ? gobAt(col, f.lane) : null;

      // A Leaper vaults the first thing in its way, once, and lands clear of it.
      if (wall && FOES[f.type].leaps && !f.leapt) {
        f.leapt = true; f.vault = 0; f.vaultFrom = f.x;
        f.vaultTo = OX + col * CELL - 24;
        Sound.play("throw");
      }
      if (f.vault !== undefined && f.vault < 1) {
        f.vault = Math.min(1, f.vault + dt * 1.6);
        f.x = f.vaultFrom + (f.vaultTo - f.vaultFrom) * f.vault;
        if (f.vault >= 1) {
          f.vault = undefined;
          burst(f.x, laneY(f.lane) + CELL * 0.82, 8,
                { colors: ["#3b3340", "#8d8496"], spread: 150, size: [1.4, 3] });
          kick(2);
        }
        continue;
      }

      if (f.stunT > 0) { f.stunT -= dt; continue; }
      if (wall) {
        // Loopholed: a shooter behind a wall is hard to get at while it is looking at you
        const soak = hasPair(wall, "loophole") && wall.cd < 0.9 ? 0.66 : 1;
        wall.hp -= d.dps * soak * dt; wall.hurtT = 0.13; wall.lastHit = S.t;
        // Spiked bites back, which turns a wall into a slow weapon
        if (gobHas(wall, "spiked")) {
          f.hp -= d.dps * 0.85 * dt;
          if (Math.random() < dt * 3)
            burst(f.x - 8, laneY(f.lane) + CELL * 0.5, 2,
                  { colors: ["#d1553f", "#e8c05a"], spread: 90, size: [1.2, 2.4],
                    life: [0.1, 0.28] });
        }
        if (Math.random() < dt * 5)
          burst(cellOf(wall).x + CELL * 0.4, cellOf(wall).y + CELL * 0.6, 2,
                { colors: ["#6fbf5b", "#3f8a4a"], spread: 110, size: [1.2, 2.4], life: [0.2, 0.4] });
        if (wall.hp <= 0) {
