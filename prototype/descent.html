<title>Hoard — The Descent</title>

<style>
  :root {
    --cave-deep: #0b0910; --cave: #141119; --stone: #241f26; --stone-lit: #2f2833;
    --gold: #e8c05a; --gold-dim: #8a7134; --goblin: #6fbf5b; --alarm: #d1553f;
    --ink: #e6dfd4; --ink-dim: #9a9089; --line: #3b3340;
    --display: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    --body: "Trebuchet MS", "Segoe UI", Candara, sans-serif;
    --data: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background:
      radial-gradient(1100px 600px at 50% -10%, #221b2c 0%, rgba(34,27,44,0) 60%),
      var(--cave-deep);
    color: var(--ink); font-family: var(--body); line-height: 1.5; min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  .shell { max-width: 1000px; margin: 0 auto; padding: 18px 14px 60px;
           display: flex; flex-direction: column; gap: 14px; }

  h1 { font-family: var(--display); font-size: clamp(26px, 6vw, 44px); margin: 0;
       color: var(--gold); text-transform: uppercase; letter-spacing: .02em; line-height: .95;
       text-shadow: 0 2px 0 #4a3a12, 0 0 30px rgba(232,192,90,.24); }
  h2 { font-family: var(--display); font-size: 21px; margin: 0; text-transform: uppercase;
       letter-spacing: .03em; color: var(--ink); }
  .kicker { font-size: 11.5px; text-transform: uppercase; letter-spacing: .15em; color: var(--ink-dim); }

  .bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
         background: linear-gradient(180deg, var(--stone-lit), var(--stone));
         border: 1px solid var(--line); border-radius: 4px; padding: 8px 13px; }
  .stat { display: flex; flex-direction: column; }
  .stat-l { font-size: 9px; text-transform: uppercase; letter-spacing: .16em; color: var(--ink-dim); }
  .stat-v { font-family: var(--display); font-size: 22px; line-height: 1.06;
            font-variant-numeric: tabular-nums; }
  .stat-v.gold { color: var(--gold); }
  .stat-v.risk { color: var(--alarm); }
  .spacer { margin-left: auto; }

  .panel { background: linear-gradient(180deg, rgba(47,40,51,.7), rgba(36,31,38,.7));
           border: 1px solid var(--line); border-radius: 5px; padding: 15px;
           display: flex; flex-direction: column; gap: 12px; }
  .muted { color: var(--ink-dim); font-size: 13.5px; margin: 0; }
  .muted b { color: var(--ink); }

  .btn { background: var(--stone-lit); border: 1px solid var(--line); color: var(--ink);
         font-family: var(--body); font-size: 13px; padding: 8px 15px; border-radius: 3px;
         cursor: pointer; text-transform: uppercase; letter-spacing: .09em;
         transition: transform .1s, filter .12s, border-color .12s; }
  .btn:hover:not(:disabled) { filter: brightness(1.25); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .38; cursor: not-allowed; }
  .btn.go { border-color: var(--gold); color: var(--gold); }
  .btn.danger { border-color: var(--alarm); color: var(--alarm); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- goblin chips ---- */
  .crew { display: grid; gap: 9px; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
  .gob { background: var(--stone); border: 1px solid var(--line); border-left: 3px solid var(--role);
         border-radius: 4px; padding: 9px 11px; display: flex; flex-direction: column; gap: 2px;
         cursor: pointer; text-align: left; color: var(--ink); font-family: var(--body);
         transition: transform .1s, filter .12s; position: relative; }
  .gob:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.16); }
  .gob:disabled { opacity: .4; cursor: not-allowed; }
  .gob.picked { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .gob-name { font-family: var(--display); font-size: 16px; letter-spacing: .02em;
              text-transform: uppercase; line-height: 1.1; }
  .gob-role { font-family: var(--data); font-size: 10px; color: var(--role); letter-spacing: .08em;
              text-transform: uppercase; }
  .gob-note { font-size: 11.5px; color: var(--ink-dim); line-height: 1.35; }
  .gob-runs { position: absolute; top: 7px; right: 9px; font-family: var(--data);
              font-size: 9.5px; color: var(--gold-dim); }
  .gob-kit { font-family: var(--data); font-size: 10px; color: var(--gold); }

  /* ---- worlds ---- */
  .worlds { display: grid; gap: 11px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .world { background: var(--stone); border: 1px solid var(--line); border-radius: 4px;
           padding: 13px; display: flex; flex-direction: column; gap: 7px; cursor: pointer;
           text-align: left; color: var(--ink); font-family: var(--body);
           transition: transform .1s, filter .12s, border-color .12s; }
  .world:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.18);
                                border-color: var(--gold-dim); }
  .world:disabled { opacity: .35; cursor: not-allowed; }
  .world-name { font-family: var(--display); font-size: 20px; text-transform: uppercase;
                letter-spacing: .02em; color: var(--gold); line-height: 1.05; }
  .world-rule { font-size: 12.5px; color: var(--ink); }
  .world-fix { font-size: 11.5px; color: var(--goblin); font-family: var(--data); }
  .world-tier { font-family: var(--data); font-size: 10px; color: var(--ink-dim);
                letter-spacing: .1em; text-transform: uppercase; }

  /* ---- map ---- */
  .map-wrap { overflow-x: auto; }
  .map { display: flex; gap: 0; align-items: stretch; min-width: 560px; }
  .col { display: flex; flex-direction: column; justify-content: center; gap: 9px;
         flex: 1 1 0; padding: 0 3px; }
  .node { background: var(--stone); border: 1px solid var(--line); border-radius: 4px;
          padding: 8px 9px; display: flex; flex-direction: column; gap: 2px; cursor: pointer;
          text-align: left; color: var(--ink); font-family: var(--body); font-size: 12px;
          transition: transform .1s, filter .12s, border-color .12s; }
  .node:disabled { opacity: .3; cursor: not-allowed; }
  .node.open { border-color: var(--gold); animation: breathe 1.9s ease-in-out infinite; }
  .node.done { border-color: var(--goblin); opacity: .68; }
  .node.done.failed { border-color: var(--alarm); }
  .node:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.2); }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 rgba(232,192,90,.34); }
                       50% { box-shadow: 0 0 0 5px rgba(232,192,90,0); } }
  .node-kind { font-family: var(--data); font-size: 9px; letter-spacing: .1em;
               text-transform: uppercase; color: var(--ink-dim); }
  .node-name { font-family: var(--display); font-size: 14px; text-transform: uppercase;
               letter-spacing: .02em; line-height: 1.1; }
  .node-gain { font-size: 10.5px; color: var(--gold); font-family: var(--data); }
  .node.boss .node-name { color: var(--alarm); }

  /* ---- fight readout ---- */
  .track { position: relative; height: 30px; background: #191420; border: 1px solid var(--line);
           border-radius: 3px; overflow: hidden; }
  .track-fill { position: absolute; inset: 0 auto 0 0; background:
                linear-gradient(90deg, rgba(111,191,91,.5), rgba(111,191,91,.16)); width: 0%; }
  .track-mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--alarm); left: 100%; }
  .track-txt { position: absolute; inset: 0; display: flex; align-items: center;
               justify-content: center; font-family: var(--data); font-size: 11px;
               letter-spacing: .08em; }
  .log { font-family: var(--data); font-size: 11.5px; color: var(--ink-dim);
         display: flex; flex-direction: column; gap: 3px; max-height: 148px; overflow-y: auto; }
  .log b { color: var(--ink); }
  .log .ok { color: var(--goblin); }
  .log .bad { color: var(--alarm); }

  .row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  .loot { display: flex; gap: 7px; flex-wrap: wrap; }
  .item { font-family: var(--data); font-size: 11px; border: 1px solid var(--gold-dim);
          color: var(--gold); border-radius: 3px; padding: 3px 7px; background: #221b12; }
  .item.spent { opacity: .4; border-color: var(--line); color: var(--ink-dim); background: none; }

  .hide { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="shell">
  <div>
    <h1 id="title">The Warren</h1>
    <span class="kicker" id="sub">meta progression prototype &middot; the fight is abstracted</span>
  </div>

  <div class="bar">
    <div class="stat"><span class="stat-l">Scrip</span><span class="stat-v gold" id="s-scrip">0</span></div>
    <div class="stat"><span class="stat-l">Carried</span><span class="stat-v risk" id="s-carry">0</span></div>
    <div class="stat"><span class="stat-l">Warren</span><span class="stat-v" id="s-goblins">0</span></div>
    <div class="stat"><span class="stat-l">Chapter</span><span class="stat-v" id="s-chapter">&mdash;</span></div>
    <div class="spacer"></div>
    <button class="btn" id="reset" type="button">Wipe save</button>
  </div>

  <div id="view"></div>
</div>

<script>
(() => {
  "use strict";

  // ============================================================ content tables
  // Roles are deliberately few. Unlocks are sidegrades: each is simply better against
  // one world rule, and none of them is required — a Chucker and a Digger can finish
  // any world, the way a Peashooter can finish the roof, just worse.
  const ROLES = {
    chucker:  { name: "Chucker",   tint: "#6fbf5b", dmg: 10, gold: 0,  wall: 0,
                note: "Throws rocks. The baseline.", start: true },
    digger:   { name: "Digger",    tint: "#c9d45f", dmg: 0,  gold: 10, wall: 0,
                note: "Pulls gold out of the ground.", start: true },
    barricade:{ name: "Barricade", tint: "#3f8a4a", dmg: 0,  gold: 0,  wall: 12,
                note: "Doesn't fight. Won't move.", start: true },
    tollkeep: { name: "Tollkeeper",tint: "#d8b45a", dmg: 5,  gold: 7,  wall: 0,
                note: "Takes a cut off everything it kills.", answers: "rot",
                unlock: "Finish a chapter in The Rot" },
    lantern:  { name: "Lanternbearer", tint: "#e8d98a", dmg: 4, gold: 0, wall: 3,
                note: "Carries a light nobody asked it to carry.", answers: "deep",
                unlock: "Reach chapter 2 of The Deep" },
    sapper:   { name: "Sapper",    tint: "#b98a4e", dmg: 8,  gold: 2,  wall: 4,
                note: "Digs out a buried cell before anyone notices.", answers: "scree",
                unlock: "Finish a chapter in The Scree" },
    hollerer: { name: "Hollerer",  tint: "#9a7fc4", dmg: 6,  gold: 4,  wall: 2,
                note: "Loud. The heroes come to it instead.", answers: null,
                unlock: "Bank 60 scrip in one trip" },
  };

  // Each world breaks a default and names the goblin that answers it. Straight out of
  // PvZ: night takes the sky sun away and hands you a Sun-shroom.
  const WORLDS = {
    scree: { name: "The Scree", tier: 1,
             rule: "Rockfall buries a cell between waves. Anything standing there is lost.",
             fix: "A Sapper digs it back out.",
             hits: g => g.wall,  penalty: 0.55, mul: 1.0 },
    rot:   { name: "The Rot", tier: 2,
             rule: "Nothing worth mining. Diggers pull almost nothing out of this ground.",
             fix: "A Tollkeeper earns off kills instead.",
             hits: g => g.gold,  penalty: 0.25, mul: 1.15 },
    deep:  { name: "The Deep", tier: 3,
             rule: "No light. You cannot see a hero until it is halfway down the lane.",
             fix: "A Lanternbearer sees them coming.",
             hits: g => g.dmg,   penalty: 0.6,  mul: 1.3 },
  };

  const NODES = {
    fight:  { kind: "Chamber",      gain: "+1 scrip",     scrip: 1, threat: 1.0 },
    deepc:  { kind: "Deep chamber", gain: "+3 scrip, kit", scrip: 3, threat: 1.45, item: true },
    pour:   { kind: "The Pour",     gain: "+2 scrip",     scrip: 2, threat: 0, safe: true },
    reeve:  { kind: "The Reeve",    gain: "trade",        scrip: 0, threat: 0, safe: true, trade: true },
    boss:   { kind: "Chapter boss", gain: "+5 scrip, kit", scrip: 5, threat: 1.55, boss: true, item: true },
  };

  const ITEMS = [
    { id: "whetstone", name: "Whetstone",     note: "+9 to every throw",  dmg: 9 },
    { id: "ledger",    name: "Greasy Ledger",  note: "+9 to every take",   gold: 9 },
    { id: "plate",     name: "Door Plate",     note: "+12 hide",           wall: 12 },
    { id: "horn",      name: "Cracked Horn",   note: "+4 all round",       dmg: 4, gold: 4, wall: 4 },
  ];

  const FIRST = ["Grub", "Nix", "Pell", "Odd", "Wex", "Tunk", "Mib", "Sorrel", "Krug", "Fen",
                 "Bristle", "Nog", "Vetch", "Hob", "Clatter", "Muck", "Pip", "Snell"];
  const LAST  = ["the Patient", "Two-Thumbs", "of the Shelf", "Nobody's Son", "the Loud",
                 "Half-Ear", "the Third", "who Waits", "Longshanks", "the Unpaid"];
  const rnd = a => a[(Math.random() * a.length) | 0];
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ==================================================================== state
  const SAVE = "hoard.descent.v1";
  let M, R = null;           // M = meta (persists), R = run (does not)

  function freshMeta() {
    return {
      scrip: 0, unlocked: ["chucker", "digger", "barricade"], trophies: [],
      warren: [], bankedItems: [], deepest: {}, banks: 0,
    };
  }
  function newGoblin(role) {
    return { id: Math.random().toString(36).slice(2, 8), role,
             name: rnd(FIRST) + " " + rnd(LAST), runs: 0, item: null };
  }
  function load() {
    try { M = JSON.parse(localStorage.getItem(SAVE)) || freshMeta(); }
    catch (e) { M = freshMeta(); }
    if (!M.warren || !M.warren.length) {
      M = freshMeta();
      // Three of each, so a starting crew of five can actually clear chapter one of a
      // tier-1 world. If that ever stops being true the unlocks have become power.
      for (const r of M.unlocked) for (let i = 0; i < 3; i++) M.warren.push(newGoblin(r));
    }
    return M;
  }
  const save = () => { try { localStorage.setItem(SAVE, JSON.stringify(M)); } catch (e) {} };

  // ========================================================== unlock checking
  // Feats, not a counter filling up. A run that died still moved the game forward.
  function checkUnlocks(events) {
    const got = [];
    const want = {
      tollkeep: () => events.chapterIn === "rot",
      sapper:   () => events.chapterIn === "scree",
      lantern:  () => events.world === "deep" && events.chapter >= 2,
      hollerer: () => events.banked >= 60,
    };
    for (const key in want) {
      if (M.unlocked.includes(key)) continue;
      if (!want[key]()) continue;
      M.unlocked.push(key);
      M.warren.push(newGoblin(key)); M.warren.push(newGoblin(key));
      got.push(ROLES[key].name);
    }
    return got;
  }

  // ===================================================== the abstracted fight
  // Not a real chamber — this prototype is testing the choices around the fight,
  // not the fight. It reads the same numbers a real chamber would.
  function power(crew, world) {
    let dmg = 0, gold = 0, wall = 0;
    for (const g of crew) {
      const r = ROLES[g.role];
      const it = g.item ? ITEMS.find(i => i.id === g.item) : null;
      dmg  += r.dmg  + (it && it.dmg  || 0);
      gold += r.gold + (it && it.gold || 0);
      wall += r.wall + (it && it.wall || 0);
    }
    const w = WORLDS[world];
    // the world rule bites the stat it targets, unless somebody in the crew answers it
    const answered = crew.some(g => ROLES[g.role].answers === world);
    let note = null;
    if (!answered) {
      const before = { dmg, gold, wall };
      if (world === "scree") wall = Math.round(wall * (1 - w.penalty));
      if (world === "rot")   gold = Math.round(gold * w.penalty);
      if (world === "deep")  dmg  = Math.round(dmg  * (1 - w.penalty));
      note = { before, after: { dmg, gold, wall } };
    }
    return { dmg, gold, wall, answered, note };
  }

  function resolve(node, crew, world, chapter) {
    const p = power(crew, world);
    // a chamber is held if damage plus what the walls buy beats the wave's demand
    const demand = Math.round(20 * node.threat * WORLDS[world].mul * (1 + (chapter - 1) * 0.45));
    const held = p.dmg + p.wall * 0.6 + p.gold * 0.25;
    const margin = Math.round((held - demand) * 10) / 10;
    return { ...p, demand, held: Math.round(held), margin, win: margin >= 0 };
  }

  // ======================================================== map generation
  function buildMap(chapter) {
    const cols = [];
    const pool = ["fight", "fight", "deepc", "pour", "reeve"];
    for (let c = 0; c < 4; c++) {
      const n = c === 0 ? 1 : 2;
      const col = [];
      for (let i = 0; i < n; i++) {
        let k = c === 0 ? "fight" : rnd(pool);
        if (c === 1 && i === 0) k = "deepc";
        if (c === 2 && i === 1) k = "pour";
        col.push({ k, done: false, failed: false, id: c + "-" + i });
      }
      // never a column where both roads are the dangerous one
      if (col.length > 1 && col.every(x => x.k === "deepc")) col[1].k = "fight";
      cols.push(col);
    }
    cols.push([{ k: "boss", done: false, failed: false, id: "boss" }]);
    return cols;
  }

  // ================================================================== views
  const view = document.getElementById("view");
  const el = (tag, cls, txt) => { const d = document.createElement(tag);
    if (cls) d.className = cls; if (txt != null) d.textContent = txt; return d; };

  function hud() {
    document.getElementById("s-scrip").textContent = M.scrip;
    document.getElementById("s-carry").textContent = R ? R.scrip : 0;
    document.getElementById("s-goblins").textContent = M.warren.length;
    document.getElementById("s-chapter").textContent =
      R ? R.chapter + " · " + WORLDS[R.world].name : "—";
  }

  function show(title, subtitle, node) {
    document.getElementById("title").textContent = title;
    document.getElementById("sub").textContent = subtitle;
    view.replaceChildren(node);
    hud();
  }

  // ---------------------------------------------------------------- the warren
  function viewWarren() {
    R = null;
    const wrap = el("div"); wrap.style.display = "flex";
    wrap.style.flexDirection = "column"; wrap.style.gap = "14px";

    const p = el("div", "panel");
    p.append(el("h2", null, "Everyone who lives here"));
    const m = el("p", "muted");
    m.innerHTML = "Scrip is what you carry home. It buys nothing yet &mdash; it is the "
      + "<b>unlock track</b>, so losing it costs you time to new content, never the ability "
      + "to win. Every world is beatable with the three goblins you started with.";
    p.append(m);

    const crew = el("div", "crew");
    for (const g of M.warren) {
      const b = el("button", "gob");
      b.style.setProperty("--role", ROLES[g.role].tint);
      b.append(el("span", "gob-role", ROLES[g.role].name));
      b.append(el("span", "gob-name", g.name));
      b.append(el("span", "gob-note", ROLES[g.role].note));
      if (g.item) b.append(el("span", "gob-kit", "⌁ " + ITEMS.find(i => i.id === g.item).name));
      if (g.runs) b.append(el("span", "gob-runs", g.runs + " run" + (g.runs > 1 ? "s" : "")));
      b.title = "Rename";
      b.onclick = () => { const n = prompt("Name this goblin", g.name);
        if (n && n.trim()) { g.name = n.trim().slice(0, 26); save(); viewWarren(); } };
      crew.append(b);
    }
    p.append(crew);
    wrap.append(p);

    if (M.bankedItems.length) {
      const kp = el("div", "panel");
      kp.append(el("h2", null, "Kit brought home"));
      const lm = el("p", "muted");
      lm.textContent = "Equip these on the muster screen before a run.";
      kp.append(lm);
      const loot = el("div", "loot");
      for (const id of M.bankedItems) {
        const it = ITEMS.find(i => i.id === id);
        loot.append(el("span", "item", it.name + " — " + it.note));
      }
      kp.append(loot); wrap.append(kp);
    }

    const locked = Object.keys(ROLES).filter(k => !M.unlocked.includes(k));
    if (locked.length) {
      const lp = el("div", "panel");
      lp.append(el("h2", null, "Not yet in the warren"));
      const g2 = el("div", "crew");
      for (const k of locked) {
        const b = el("button", "gob"); b.disabled = true;
        b.style.setProperty("--role", ROLES[k].tint);
        b.append(el("span", "gob-role", "???"));
        b.append(el("span", "gob-name", "— — —"));
        b.append(el("span", "gob-note", ROLES[k].unlock));
        g2.append(b);
      }
      lp.append(g2); wrap.append(lp);
    }

    const go = el("div", "row");
    const b = el("button", "btn go", "Muster a crew");
    b.onclick = viewMuster; go.append(b);
    wrap.append(go);

    show("The Warren", "meta progression prototype · the fight is abstracted", wrap);
  }

  // ---------------------------------------------------------------- muster
  let picked = [];
  function viewMuster() {
    picked = [];
    const wrap = el("div"); wrap.style.display = "flex";
    wrap.style.flexDirection = "column"; wrap.style.gap = "14px";

    const p = el("div", "panel");
    p.append(el("h2", null, "Pick five to take down"));
    const m = el("p", "muted");
    m.innerHTML = "You bring the <b>foremen</b>. In a chamber you place as many of each as you can "
      + "pay for &mdash; the crew comes out of the warren, but the foreman's kit and name go with "
      + "every one of them. That is how one named goblin fills five tiles.";
    p.append(m);

    const crew = el("div", "crew");
    const count = el("p", "muted");
    const redraw = () => {
      count.textContent = picked.length + " of 5 chosen"
        + (picked.length ? " — " + picked.map(g => g.name.split(" ")[0]).join(", ") : "");
      [...crew.children].forEach((b, i) => {
        const g = M.warren[i];
        b.classList.toggle("picked", picked.includes(g));
        b.disabled = !picked.includes(g) && picked.length >= 5;
      });
      next.disabled = picked.length === 0;
    };

    for (const g of M.warren) {
      const b = el("button", "gob");
      b.style.setProperty("--role", ROLES[g.role].tint);
      b.append(el("span", "gob-role", ROLES[g.role].name));
      b.append(el("span", "gob-name", g.name));
      const st = ROLES[g.role];
      b.append(el("span", "gob-note",
        [st.dmg && ("hit " + st.dmg), st.gold && ("gold " + st.gold), st.wall && ("hide " + st.wall)]
          .filter(Boolean).join(" · ")));
      if (g.item) b.append(el("span", "gob-kit", "⌁ " + ITEMS.find(i => i.id === g.item).name));
      b.onclick = () => {
        const i = picked.indexOf(g);
        if (i >= 0) picked.splice(i, 1);
        else if (picked.length < 5) {
          picked.push(g);
          if (M.bankedItems.length && !g.item) {
            const opts = M.bankedItems.map((id, n) =>
              (n + 1) + ") " + ITEMS.find(x => x.id === id).name + " — " + ITEMS.find(x => x.id === id).note);
            const ans = prompt("Give " + g.name + " something?\n\n" + opts.join("\n") + "\n\nnumber, or blank");
            const n = parseInt(ans, 10);
            if (n >= 1 && n <= M.bankedItems.length) {
              g.item = M.bankedItems[n - 1]; M.bankedItems.splice(n - 1, 1); save();
            }
          }
        }
        redraw();
      };
      crew.append(b);
    }
    p.append(crew); p.append(count);
    wrap.append(p);

    const row = el("div", "row");
    const back = el("button", "btn", "Back");
    back.onclick = viewWarren;
    const next = el("button", "btn go", "Choose a world");
    next.onclick = () => viewWorlds();
    row.append(back, next); wrap.append(row);
    redraw();

    show("Muster", "the foremen you take decide what you can answer", wrap);
  }

  // ---------------------------------------------------------------- worlds
  function viewWorlds() {
    const wrap = el("div"); wrap.style.display = "flex";
    wrap.style.flexDirection = "column"; wrap.style.gap = "14px";
    const p = el("div", "panel");
    p.append(el("h2", null, "Where to"));
    const m = el("p", "muted");
    m.innerHTML = "Each world breaks one thing you rely on and names the goblin that answers it. "
      + "You can go without the answer &mdash; it just costs you.";
    p.append(m);

    const ws = el("div", "worlds");
    for (const key in WORLDS) {
      const w = WORLDS[key];
      const b = el("button", "world");
      b.append(el("span", "world-tier", "Tier " + w.tier));
      b.append(el("span", "world-name", w.name));
      b.append(el("span", "world-rule", w.rule));
      const have = picked.some(g => ROLES[g.role].answers === key);
      const fix = el("span", "world-fix", (have ? "✓ answered — " : "✗ no answer — ") + w.fix);
      if (!have) fix.style.color = "var(--alarm)";
      b.append(fix);
      b.onclick = () => startRun(key);
      ws.append(b);
    }
    p.append(ws); wrap.append(p);

    const row = el("div", "row");
    const back = el("button", "btn", "Back");
    back.onclick = viewMuster; row.append(back); wrap.append(row);
    show("The way down", "pick the problem you would rather have", wrap);
  }

  // ---------------------------------------------------------------- the run
  function startRun(world) {
    R = { world, chapter: 1, scrip: 0, crew: picked.slice(), map: buildMap(1),
          col: 0, items: [], log: [] };
    for (const g of R.crew) g.runs++;
    save();
    viewMap();
  }

  function viewMap() {
    const wrap = el("div"); wrap.style.display = "flex";
    wrap.style.flexDirection = "column"; wrap.style.gap = "14px";
    const w = WORLDS[R.world];

    const p = el("div", "panel");
    p.append(el("h2", null, "Chapter " + R.chapter + " — " + w.name));
    const m = el("p", "muted");
    const answered = R.crew.some(g => ROLES[g.role].answers === R.world);
    m.innerHTML = "<b>" + w.rule + "</b> " + (answered
      ? "<span style='color:var(--goblin)'>Your crew has the answer.</span>"
      : "<span style='color:var(--alarm)'>Nobody here answers this.</span>");
    p.append(m);

    const mw = el("div", "map-wrap");
    const map = el("div", "map");
    R.map.forEach((col, ci) => {
      const c = el("div", "col");
      col.forEach(n => {
        const d = NODES[n.k];
        const b = el("button", "node" + (d.boss ? " boss" : ""));
        b.append(el("span", "node-kind", d.kind));
        b.append(el("span", "node-name", nodeName(n.k)));
        b.append(el("span", "node-gain", d.gain));
        if (n.done) b.classList.add("done", n.failed ? "failed" : "ok");
        if (ci === R.col && !n.done) { b.classList.add("open"); b.onclick = () => enter(n); }
        else b.disabled = true;
        c.append(b);
      });
      map.append(c);
    });
    mw.append(map); p.append(mw);
    wrap.append(p);

    if (R.items.length) {
      const kp = el("div", "panel");
      kp.append(el("h2", null, "Picked up on the way"));
      const loot = el("div", "loot");
      for (const id of R.items) loot.append(el("span", "item", ITEMS.find(i => i.id === id).name));
      kp.append(loot);
      const warn = el("p", "muted");
      warn.innerHTML = "Kit is only yours once you <b>walk out</b>. Die and it stays down here.";
      kp.append(warn); wrap.append(kp);
    }

    show("The Descent", "chapter " + R.chapter + " · " + R.scrip + " scrip carried", wrap);
  }

  const nodeName = k => ({ fight: "A chamber", deepc: "Something worse", pour: "The pour",
                           reeve: "The Reeve", boss: "It is waiting" })[k];

  // ---------------------------------------------------------------- a node
  function enter(node) {
    const d = NODES[node.k];
    if (d.trade) return viewReeve(node);
    if (d.safe)  return viewSafe(node);
    return viewFight(node);
  }

  function advance(node, failed) {
    node.done = true; node.failed = !!failed;
    R.col++;
    save();
  }

  function viewSafe(node) {
    const d = NODES[node.k];
    R.scrip += d.scrip;
    const wrap = el("div", "panel");
    wrap.append(el("h2", null, node.k === "pour" ? "The pour" : "Quiet ground"));
    const m = el("p", "muted");
    m.innerHTML = "No fight here. <b>+" + d.scrip + " scrip</b> carried.";
    wrap.append(m);
    const row = el("div", "row");
    const b = el("button", "btn go", "On");
    b.onclick = () => { advance(node); viewMap(); };
    row.append(b); wrap.append(row);
    show("The pour", "banked nothing yet — this is still down here with you", wrap);
  }

  function viewReeve(node) {
    const wrap = el("div", "panel");
    wrap.append(el("h2", null, "The Reeve wants a word"));
    const m = el("p", "muted");
    m.innerHTML = "He will take one of your five and pay in scrip. The crew gets smaller; "
      + "what you carry gets bigger.";
    wrap.append(m);
    const crew = el("div", "crew");
    for (const g of R.crew) {
      const b = el("button", "gob");
      b.style.setProperty("--role", ROLES[g.role].tint);
      b.append(el("span", "gob-role", ROLES[g.role].name));
      b.append(el("span", "gob-name", g.name));
      b.append(el("span", "gob-note", "Hand over for +7 scrip"));
      b.onclick = () => {
        R.crew = R.crew.filter(x => x !== g);
        R.scrip += 7;
        advance(node); viewMap();
      };
      crew.append(b);
    }
    wrap.append(crew);
    const row = el("div", "row");
    const b = el("button", "btn", "Tell him no");
    b.onclick = () => { advance(node); viewMap(); };
    row.append(b); wrap.append(row);
    show("The Reeve", "the only node that can take something from you", wrap);
  }

  function viewFight(node) {
    const d = NODES[node.k];
    const res = resolve(d, R.crew, R.world, R.chapter);
    const wrap = el("div", "panel");
    wrap.append(el("h2", null, d.boss ? "It is waiting" : d.kind));

    const track = el("div", "track");
    const fill = el("div", "track-fill");
    const txt = el("div", "track-txt", "…");
    track.append(fill, el("div", "track-mark"), txt);
    wrap.append(track);

    const log = el("div", "log");
    wrap.append(log);
    const line = (t, cls) => { const s = el("div", cls); s.innerHTML = t; log.append(s); };

    const w = WORLDS[R.world];
    line("The wave asks for <b>" + res.demand + "</b>.");
    if (res.answered) line("✓ " + w.fix + " The world rule does nothing to you.", "ok");
    else if (res.note) {
      const b4 = res.note.before, af = res.note.after;
      const which = R.world === "scree" ? ["hide", b4.wall, af.wall]
                  : R.world === "rot"   ? ["gold", b4.gold, af.gold]
                                        : ["hit",  b4.dmg,  af.dmg];
      line("✗ No answer to " + w.name + ". " + which[0] + " " + which[1] + " → <b>" + which[2] + "</b>.", "bad");
    }
    line("Your five bring <b>" + res.held + "</b>.");

    // animate the bar, then land the verdict
    const pct = clamp(res.held / res.demand * 100, 0, 100);
    requestAnimationFrame(() => { fill.style.transition = "width .7s ease-out"; fill.style.width = pct + "%"; });
    txt.textContent = res.held + " / " + res.demand;

    setTimeout(() => {
      if (res.win) {
        R.scrip += d.scrip;
        line("<b>Held</b> with " + res.margin + " to spare. +" + d.scrip + " scrip.", "ok");
        const after = () => {
          const row = el("div", "row");
          const b = el("button", "btn go", d.boss ? "Chapter cleared" : "On");
          b.onclick = () => { advance(node); d.boss ? viewChapterEnd() : viewMap(); };
          row.append(b); wrap.append(row);
        };
        if (d.item) {
          const it = rnd(ITEMS); R.items.push(it.id);
          line("Found <b>" + it.name + "</b> — " + it.note + ".", "ok");
          // Kit is usable the moment it is found. Without that, going deeper only
          // raises the demand and nothing answers it, so "one more chapter" is a trap
          // rather than a choice.
          viewEquip(wrap, it, after);
        } else after();
      } else {
        line("<b>Overrun</b>, short by " + Math.abs(res.margin) + ".", "bad");
        const row = el("div", "row");
        const b = el("button", "btn danger", "See what it cost");
        b.onclick = () => viewDeath();
        row.append(b); wrap.append(row);
      }
    }, 720);

    show(d.boss ? "The boss" : "A chamber", "the fight is abstracted — the choices around it are not", wrap);
  }

  // Hand the find to somebody. Kit rides on the foreman, so it applies to every goblin
  // of that role you place — which is also why it is worth thinking about.
  function viewEquip(wrap, it, then) {
    const h = el("h2", null, "Who carries it?");
    h.style.fontSize = "17px"; h.style.marginTop = "4px";
    wrap.append(h);
    const crew = el("div", "crew");
    for (const g of R.crew) {
      const b = el("button", "gob");
      b.style.setProperty("--role", ROLES[g.role].tint);
      b.append(el("span", "gob-role", ROLES[g.role].name));
      b.append(el("span", "gob-name", g.name));
      b.append(el("span", "gob-note", g.item
        ? "already carrying " + ITEMS.find(i => i.id === g.item).name + " — swap"
        : it.note));
      b.onclick = () => {
        if (g.item) { const back = g.item; R.items.push(back); }
        g.item = it.id;
        const ix = R.items.indexOf(it.id);
        if (ix >= 0) R.items.splice(ix, 1);
        crew.remove(); h.remove(); then();
      };
      crew.append(b);
    }
    wrap.append(crew);
  }

  // ---------------------------------------------------------------- endings
  function viewChapterEnd() {
    const wrap = el("div", "panel");
    wrap.append(el("h2", null, "Chapter " + R.chapter + " cleared"));
    const m = el("p", "muted");
    m.innerHTML = "You are carrying <b>" + R.scrip + " scrip</b>"
      + (R.items.length ? " and <b>" + R.items.length + " piece" + (R.items.length > 1 ? "s" : "")
         + " of kit</b>" : "") + ". Walk out with it, or go one chapter deeper — "
      + "every chamber down there asks for half again as much.";
    wrap.append(m);

    const row = el("div", "row");
    const out = el("button", "btn go", "Walk out with it");
    out.onclick = () => viewBank();
    const down = el("button", "btn danger", "One more chapter");
    down.onclick = () => {
      R.chapter++; R.map = buildMap(R.chapter); R.col = 0;
      const got = checkUnlocks({ world: R.world, chapter: R.chapter, banked: 0 });
      save();
      if (got.length) toastUnlock(got, viewMap); else viewMap();
    };
    row.append(out, down); wrap.append(row);
    show("Deeper?", "the only real decision in the run", wrap);
  }

  function viewBank() {
    const carried = R.scrip, kit = R.items.slice();
    M.scrip += carried;
    M.bankedItems.push(...kit);
    M.banks++;
    const deep = M.deepest[R.world] || 0;
    if (R.chapter > deep) M.deepest[R.world] = R.chapter;
    const got = checkUnlocks({ world: R.world, chapter: R.chapter,
                              chapterIn: R.world, banked: carried });
    save();

    const wrap = el("div", "panel");
    wrap.append(el("h2", null, "Home"));
    const m = el("p", "muted");
    m.innerHTML = "Banked <b>" + carried + " scrip</b>"
      + (kit.length ? " and " + kit.map(id => "<b>" + ITEMS.find(i => i.id === id).name + "</b>").join(", ") : "")
      + ". Everyone came back.";
    wrap.append(m);
    if (got.length) {
      const u = el("p", "muted");
      u.innerHTML = "<b style='color:var(--gold)'>New in the warren: " + got.join(", ") + "</b>";
      wrap.append(u);
    }
    const row = el("div", "row");
    const b = el("button", "btn go", "Back to the warren");
    b.onclick = viewWarren; row.append(b); wrap.append(row);
    show("Banked", "scrip is safe now — it never was before", wrap);
  }

  function viewDeath() {
    const lost = Math.round(R.scrip * 0.7), kept = R.scrip - lost;
    M.scrip += kept;
    // feats still count. A run that died still moved the game forward.
    const got = checkUnlocks({ world: R.world, chapter: R.chapter, banked: 0 });
    save();

    const wrap = el("div", "panel");
    wrap.append(el("h2", null, "They took the cart"));
    const m = el("p", "muted");
    m.innerHTML = "You were carrying <b>" + R.scrip + "</b>. You come home with <b>" + kept
      + "</b> — the rest is down there, along with "
      + (R.items.length ? "<b>" + R.items.length + " piece(s) of kit</b>." : "nothing else.");
    wrap.append(m);
    const m2 = el("p", "muted");
    m2.innerHTML = "Nobody died. The goblins are back in the warren, and what you had already "
      + "banked is untouched — <b>the next run is no harder than this one was</b>.";
    wrap.append(m2);
    if (got.length) {
      const u = el("p", "muted");
      u.innerHTML = "<b style='color:var(--gold)'>Still counted: " + got.join(", ") + " joined the warren.</b>";
      wrap.append(u);
    }
    const row = el("div", "row");
    const b = el("button", "btn", "Back to the warren");
    b.onclick = viewWarren; row.append(b); wrap.append(row);
    show("Lost", "70% of what you carried — none of what you banked", wrap);
  }

  function toastUnlock(names, then) {
    const wrap = el("div", "panel");
    wrap.append(el("h2", null, "Somebody new turned up"));
    const m = el("p", "muted");
    m.innerHTML = "<b style='color:var(--gold)'>" + names.join(", ") + "</b> is in the warren now. "
      + "Not stronger — just better at one particular problem.";
    wrap.append(m);
    const row = el("div", "row");
    const b = el("button", "btn go", "On");
    b.onclick = then; row.append(b); wrap.append(row);
    show("Unlocked", "variety, not power", wrap);
  }

  // ==================================================================== boot
  document.getElementById("reset").onclick = () => {
    if (!confirm("Wipe the save and start over?")) return;
    localStorage.removeItem(SAVE); load(); viewWarren();
  };
  // The host owns <head>, so claim the viewport at runtime.
  (function () {
    let m = document.querySelector('meta[name="viewport"]');
    if (!m) { m = document.createElement("meta"); m.name = "viewport"; document.head.appendChild(m); }
    m.content = "width=device-width, initial-scale=1, viewport-fit=cover";
  })();

  load();
  viewWarren();
})();
</script>
