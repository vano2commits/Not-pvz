        if (!flat) { cx.fillStyle = f.type === "scout" ? "#d1553f" : "#0e0c11"; cx.fillRect(-9, -12, 18, 4); }
      }
      cx.fillStyle = flat || "#5a5560";
      cx.fillRect(-9, 26, 6, 8 + Math.sin(f.bob) * 3);
      cx.fillRect(3, 26, 6, 8 - Math.sin(f.bob) * 3);
      if (f.type === "leaper" && !f.leapt) {
        cx.strokeStyle = flat || "#8a6234"; cx.lineWidth = 3.4; cx.lineCap = "round";
        cx.beginPath(); cx.moveTo(-14, -18); cx.lineTo(-2, 30); cx.stroke();
        cx.fillStyle = flat || "#d8c9a0";
        cx.beginPath(); cx.rect(-9, 2, 18, 5); cx.fill();
      }
      if (f.type === "runner" && !f.bleeding) {
        cx.fillStyle = flat || "#c2a45e";
        cx.beginPath(); cx.rect(-11, 2, 22, 4); cx.fill();
      }
      if (f.type === "pavise" && !f.bleeding) {
        cx.fillStyle = flat || "#5b6472";
        cx.beginPath(); cx.rect(-19, -14, 8, 38); cx.fill();
        cx.fillStyle = flat || "#8996a8";
        cx.beginPath(); cx.rect(-19, -14, 8, 8); cx.fill();
      }
      if (f.type === "sergeant" && !f.bleeding) {
        cx.fillStyle = flat || "#8a6234";
        cx.beginPath(); cx.moveTo(-10, -4); cx.lineTo(10, -4); cx.lineTo(8, 16); cx.lineTo(-8, 16); cx.closePath(); cx.fill();
        cx.fillStyle = flat || "#d3a468"; cx.fillRect(-10, -4, 20, 3);
      }
    };
    paint(null);
    if (f.hitT > 0.05) { cx.globalAlpha = clamp((f.hitT - 0.05) * 12, 0, 0.9); paint("#fffdf4"); cx.globalAlpha = 1; }
    cx.restore();

    const fr = clamp(f.hp / f.maxHp, 0, 1);
    if (fr < 1) {
      cx.fillStyle = "rgba(0,0,0,.55)"; cx.fillRect(f.x - 16, y + 32 * K, 32, 3.5);
      cx.fillStyle = "#d1553f"; cx.fillRect(f.x - 16, y + 32 * K, 32 * fr, 3.5);
    }
  }

  const FONT = "'Trebuchet MS', sans-serif";

  function render() {
    cx.clearRect(0, 0, W, H);
    cx.fillStyle = "#141119"; cx.fillRect(0, 0, W, H);
    cx.save();
    if (S.shake > 0.1) {
      const a = Math.random() * 6.283;
      cx.translate(Math.cos(a) * S.shake, Math.sin(a) * S.shake);
    }

    for (let r = 0; r < ROWS; r++) {
      cx.fillStyle = r % 2 ? "#241f26" : "#2a2430";
      cx.fillRect(OX, OY + r * CELL, COLS * CELL, CELL);
    }
    // Gold seamed through the rock, thickening toward the far end. Nothing says
    // "deeper pays more" — you can see it in the ground before you place anything.
    const rot = world().dig < 1;
    for (let c = 0; c < COLS; c++) {
      const depth = c / (COLS - 1);
      const warm = (0.012 + depth * 0.055) * (rot ? 0.25 : 1);
      for (let r = 0; r < ROWS; r++) {
        const lv = S.veins[c + "," + r];
        const dug = lv === undefined ? 1 : lv;
        cx.fillStyle = rot ? "rgba(150,150,160," + warm * dug + ")"
                           : "rgba(232,192,90," + warm * dug + ")";
        cx.fillRect(OX + c * CELL, OY + r * CELL, CELL, CELL);
      }
      const n = Math.round(depth * depth * 9);
      for (let r = 0; r < ROWS; r++) {
        const leftV = S.veins[c + "," + r];
        const dug = leftV === undefined ? 1 : leftV;
        const shown = Math.round(n * dug);
        if (dug <= 0.1) {
          // spent ground: a dark hatch you can read at any column
          cx.save();
          cx.beginPath(); cx.rect(OX + c * CELL, OY + r * CELL, CELL, CELL); cx.clip();
          cx.strokeStyle = "rgba(120,112,130,.28)"; cx.lineWidth = 2;
          for (let k = -CELL; k < CELL; k += 11) {
            cx.beginPath();
            cx.moveTo(OX + c * CELL + k, OY + r * CELL);
            cx.lineTo(OX + c * CELL + k + CELL, OY + r * CELL + CELL);
            cx.stroke();
          }
          cx.restore();
        }
        for (let i = 0; i < shown; i++) {
          const a = ((i * 2.399 + c * 1.7 + r * 0.31) % 1);
          const b = ((i * 4.771 + r * 2.3 + c * 0.53) % 1);
          const px = OX + c * CELL + 6 + a * (CELL - 12);
          const py = OY + r * CELL + 6 + b * (CELL - 12);
          const sz = 1 + depth * 2.4;
          cx.fillStyle = rot ? "rgba(120,116,126," + (0.22 + depth * 0.3) + ")"
                             : "rgba(201,162,74," + (0.3 + depth * 0.45) + ")";
          cx.beginPath(); cx.ellipse(px, py, sz, sz * 0.72, a * 3, 0, 6.284); cx.fill();
          if (depth > 0.55 && !rot) {
            cx.fillStyle = "rgba(255,244,206,.5)";
            cx.beginPath(); cx.arc(px - sz * 0.3, py - sz * 0.3, sz * 0.34, 0, 6.284); cx.fill();
          }
        }
      }
    }
    // Lanes that have not opened yet are packed rubble. They are drawn over the seams,
    // so a closed lane reads as "no gold here, nothing walks here" at a glance.
    for (let r = 0; r < ROWS; r++) {
      const shut = 1 - S.laneReveal[r];
      if (shut <= 0.001) continue;
      const y = OY + r * CELL;
      cx.save();
      cx.beginPath(); cx.rect(OX, y, COLS * CELL, CELL); cx.clip();
      cx.fillStyle = "rgba(16,13,20," + (0.9 * shut) + ")";
      cx.fillRect(OX, y, COLS * CELL, CELL);
      cx.globalAlpha = shut;
      for (let i = 0; i < 46; i++) {
        const a = (i * 2.399 + r * 1.13) % 1, b2 = (i * 4.771 + r * 0.61) % 1;
        const px = OX + a * COLS * CELL, py = y + 6 + b2 * (CELL - 12);
        const sz = 3 + ((i * 7) % 5);
        cx.fillStyle = i % 3 ? "#39323f" : "#453d4c";
        cx.beginPath();
        cx.moveTo(px, py - sz); cx.lineTo(px + sz, py); cx.lineTo(px, py + sz * 0.8);
        cx.lineTo(px - sz * 0.9, py + sz * 0.2); cx.closePath(); cx.fill();
      }
      cx.restore();
    }

    // Rubble from a rockfall. Same visual language as a caved-in lane, one cell wide.
    for (const k in S.buried) {
      const [bc, br] = k.split(",").map(Number);
      const x = OX + bc * CELL, y = OY + br * CELL;
      cx.save();
      cx.beginPath(); cx.rect(x, y, CELL, CELL); cx.clip();
      cx.fillStyle = "rgba(16,13,20,.86)"; cx.fillRect(x, y, CELL, CELL);
      for (let i = 0; i < 16; i++) {
        const a = (i * 2.399 + bc * 1.13 + br * 0.7) % 1, b2 = (i * 4.771 + br * 0.61) % 1;
        const px = x + 6 + a * (CELL - 12), py = y + 6 + b2 * (CELL - 12);
        const sz = 3.5 + ((i * 7) % 5);
        cx.fillStyle = i % 3 ? "#39323f" : "#4b4252";
        cx.beginPath();
        cx.moveTo(px, py - sz); cx.lineTo(px + sz, py); cx.lineTo(px, py + sz * 0.8);
        cx.lineTo(px - sz * 0.9, py + sz * 0.2); cx.closePath(); cx.fill();
      }
      const left = S.buried[k] / RUBBLE_LIFE;
      cx.fillStyle = "rgba(232,192,90,.5)";
      cx.fillRect(x + 8, y + CELL - 9, (CELL - 16) * clamp(left, 0, 1), 2.5);
      cx.restore();
    }

    // A lane that has just opened glows until it is live, so "new ground" and "heroes
    // are coming down here now" are two visibly different moments.
    for (let r = 0; r < ROWS; r++) {
      if (!S.laneFlash || S.laneFlash[r] <= 0) continue;
      const k = Math.min(1, S.laneFlash[r] / 2.6);
      const y = OY + r * CELL;
      const pulse = 0.25 + Math.abs(Math.sin(S.t * 5)) * 0.35;
      cx.fillStyle = "rgba(232,192,90," + (pulse * k * 0.5) + ")";
      cx.fillRect(OX, y, COLS * CELL, CELL);
      cx.strokeStyle = "rgba(232,192,90," + (0.5 + pulse * 0.5) * k + ")";
      cx.lineWidth = 3;
      cx.strokeRect(OX + 1.5, y + 1.5, COLS * CELL - 3, CELL - 3);
    }

    cx.strokeStyle = "rgba(0,0,0,.35)"; cx.lineWidth = 1;
    for (let c = 0; c <= COLS; c++) {
      cx.beginPath(); cx.moveTo(OX + c * CELL, OY); cx.lineTo(OX + c * CELL, OY + ROWS * CELL); cx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      cx.beginPath(); cx.moveTo(OX, OY + r * CELL); cx.lineTo(OX + COLS * CELL, OY + r * CELL); cx.stroke();
    }

    // Whatever is in your hand - a card from the rack or a goblin already standing on the
    // board - the bodies that will take it are marked the same way. Two indicators for one
    // idea taught players there were two different rules.
    if (!S.over) {
      const held = S.selGob ? S.selGob.parts.length
                 : (S.selUnit && S.coins >= costOf(S.selUnit) && S.cool[S.selUnit] <= 0) ? 1
                 : 0;
      if (held) {
        for (const g of S.goblins) {
          if (g === S.selGob || g.parts.length + held > MAX_PARTS) continue;
          // Out of step, so a full board reads as a scatter of hints rather than one throb.
          drawFuseSlot(cellOf(g), 0.5 + Math.sin(S.t * 3.1 + g.col * 0.7 + g.row * 1.3) * 0.5);
        }
      }
    }

    if ((S.selUnit || S.selGob) && hover.col >= 0 && !S.over) {
      // The hovered cell answers the same question for both hands: does what I am holding
      // go here, and what does it turn into.
      const carry = S.selGob ? S.selGob.parts : [S.selUnit];
      const on = gobAt(hover.col, hover.row);
      // An occupied cell is a legal target - that is where fusions come from - so it only
      // reads red when the body standing there has no room. A goblin lifted off the board
      // has nowhere to go but into another goblin, so bare ground is red for it.
      const ok = laneIsOpen(hover.row) && !S.buried[hover.col + "," + hover.row]
                 && (on ? on !== S.selGob && on.parts.length + carry.length <= MAX_PARTS
                        : !S.selGob)
                 && (S.selGob || (S.coins >= costOf(S.selUnit) && S.cool[S.selUnit] <= 0));
      cx.fillStyle = ok ? "rgba(111,191,91,.2)" : "rgba(209,85,63,.2)";
      cx.fillRect(OX + hover.col * CELL, OY + hover.row * CELL, CELL, CELL);
      cx.strokeStyle = ok ? "rgba(111,191,91,.75)" : "rgba(209,85,63,.75)";
      cx.lineWidth = 2;
      cx.strokeRect(OX + hover.col * CELL + 2, OY + hover.row * CELL + 2, CELL - 4, CELL - 4);
      // Hovering a body you can fuse names the creature you would get, so the trade is
      // legible before you commit to it.
      if (ok && on) {
        const would = nameOf({ parts: on.parts.concat(carry) }).toUpperCase();
        const tx = OX + hover.col * CELL + CELL / 2, ty = OY + hover.row * CELL - 5;
        cx.font = "bold 11px " + FONT; cx.textAlign = "center";
        const tw = cx.measureText(would).width + 10;
        cx.fillStyle = "rgba(11,9,16,.82)";
        cx.fillRect(tx - tw / 2, ty - 11, tw, 14);
        cx.fillStyle = "#f5dc9c";
        cx.fillText(would, tx, ty);
      }
      if (S.selUnit === "digger") {
        // worth shown as coins, not digits
        const pips = Math.max(1, Math.round(yieldAt(hover.col) / RICH_MAX * 5));
        const bx = OX + hover.col * CELL + CELL / 2, by = OY + hover.row * CELL + CELL - 12;
        for (let i = 0; i < pips; i++) {
          const px = bx - (pips - 1) * 5 + i * 10;
          cx.fillStyle = "#8a7134";
          cx.beginPath(); cx.ellipse(px, by, 4.2, 4.6, 0, 0, 6.284); cx.fill();
          cx.fillStyle = "#e8c05a";
          cx.beginPath(); cx.ellipse(px, by - 0.6, 3.2, 3.6, 0, 0, 6.284); cx.fill();
        }
      }
    }

    // caravan
    const baseY = H - 14;
    const grd = cx.createRadialGradient(44, baseY - 40, 4, 44, baseY - 40, 180);
    grd.addColorStop(0, "rgba(232,192,90,.2)"); grd.addColorStop(1, "transparent");
    cx.fillStyle = grd; cx.fillRect(0, 0, 240, H);
    cx.fillStyle = "#1b1720"; cx.fillRect(0, OY, OX, ROWS * CELL);
    cx.fillStyle = "#8a7134";
    cx.beginPath(); cx.moveTo(-10, baseY);
    cx.quadraticCurveTo(OX * 0.5, baseY - 190, OX + 12, baseY); cx.closePath(); cx.fill();
    cx.fillStyle = "#e8c05a";
    for (let i = 0; i < 24; i++) {
      const a = (i * 2.399) % 1, b = (i * 4.771) % 1;
      const px = 6 + a * (OX - 6);
      const py = baseY - b * 190 * (1 - Math.abs(px / OX - 0.5)) * 0.9;
      cx.beginPath(); cx.ellipse(px, py, 5, 3, 0.3, 0, 6.284); cx.fill();
    }
    cx.font = "10px " + FONT; cx.fillStyle = "#8a7134"; cx.textAlign = "center";
    cx.fillText("THE CARAVAN", OX / 2, OY - 12);
    if (S.cart > 0) {
      for (let i = 0; i < 3; i++) {
        cx.beginPath(); cx.arc(OX / 2 - 16 + i * 16, OY - 26, 5, 0, 6.284);
        cx.fillStyle = i < S.cart ? "#e8c05a" : "rgba(120,110,130,.35)";
        cx.fill();
      }
    }

    for (let r = 0; r < ROWS; r++) {
      const yy = laneY(r) + CELL * 0.66;
      // A caved-in lane has no last line of defence to show yet. Skip before touching
      // globalAlpha — bailing out with it still set leaks a transparent canvas onto
      // everything drawn after this loop.
      const a = (S.traps[r] ? 1 : 0.13) * S.laneReveal[r];
      if (a < 0.02) continue;
      cx.globalAlpha = a;
      cx.strokeStyle = "#8f8698"; cx.lineWidth = 2.2;
      cx.beginPath(); cx.arc(OX + 20, yy, 11, Math.PI, 0); cx.stroke();
      cx.beginPath();
      for (let i = 0; i <= 4; i++) {
        const tx = OX + 20 - 11 + i * 5.5;
        cx.moveTo(tx, yy - 1); cx.lineTo(tx + 2.7, yy - 7); cx.lineTo(tx + 5.5, yy - 1);
      }
      cx.stroke();
      cx.globalAlpha = 1;
    }

    S.goblins.forEach(drawGoblin);

    for (const s of S.shots) {
      s.trail.forEach((t, i) => {
        cx.globalAlpha = (i / s.trail.length) * 0.4;
        cx.fillStyle = "#a89b8c";
        cx.beginPath(); cx.arc(t.x, t.y, 1.6 + i * 0.4, 0, 6.284); cx.fill();
      });
      cx.globalAlpha = 1;
      cx.save(); cx.translate(s.x, s.y);
      if (s.kind === "bomb") {
        cx.rotate(s.spin);
        cx.fillStyle = "#2b2530";
        cx.beginPath(); cx.arc(0, 0, 6.5, 0, 6.284); cx.fill();
        cx.strokeStyle = "#6b5f4a"; cx.lineWidth = 2; cx.lineCap = "round";
        cx.beginPath(); cx.moveTo(4, -5); cx.lineTo(9, -10); cx.stroke();
        cx.fillStyle = "#e8c05a";
        cx.beginPath(); cx.arc(10, -11, 2.4 + Math.sin(S.t * 30) * 0.9, 0, 6.284); cx.fill();
        cx.fillStyle = "rgba(255,244,214,.5)";
        cx.beginPath(); cx.arc(-2, -2.4, 2, 0, 6.284); cx.fill();
      } else if (s.kind === "rock") {
        cx.rotate(s.spin);
        cx.fillStyle = "#c2b39c";
        cx.beginPath(); cx.moveTo(-5, -3.5); cx.lineTo(4, -5); cx.lineTo(6, 2.5); cx.lineTo(-2.5, 5); cx.closePath(); cx.fill();
      } else if (s.kind === "arrow") {
        cx.fillStyle = "#8a6234"; cx.fillRect(-14, -1.4, 22, 2.8);
        cx.fillStyle = "#e6dfd4";
        cx.beginPath(); cx.moveTo(8, -5); cx.lineTo(17, 0); cx.lineTo(8, 5); cx.closePath(); cx.fill();
        cx.fillStyle = "#c9a24a"; cx.fillRect(-15, -4, 5, 8);
      } else {
        cx.fillStyle = "#6b4e2c"; cx.fillRect(-22, -2.6, 34, 5.2);
        cx.fillStyle = "#f0e6cf";
        cx.beginPath(); cx.moveTo(12, -8); cx.lineTo(26, 0); cx.lineTo(12, 8); cx.closePath(); cx.fill();
        cx.fillStyle = "rgba(232,192,90,.35)";
        cx.beginPath(); cx.ellipse(-16, 0, 16, 5, 0, 0, 6.284); cx.fill();
      }
      cx.restore();
    }

    S.foes.forEach(drawFoe);
    S.walkers.forEach(drawWalker);

    for (const p of S.parts) {
      cx.globalAlpha = clamp(p.life * 2.6, 0, 1);
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r);
      cx.restore();
    }
    cx.globalAlpha = 1;

    for (const c of S.loot) {
      const w = Math.max(2, Math.abs(Math.cos(c.spin)) * 6);
      cx.fillStyle = "#8a7134";
      cx.beginPath(); cx.ellipse(c.x, c.y, w + 1.4, 7.4, 0, 0, 6.284); cx.fill();
      cx.fillStyle = "#e8c05a";
      cx.beginPath(); cx.ellipse(c.x, c.y - 0.6, w, 6, 0, 0, 6.284); cx.fill();
      cx.fillStyle = "rgba(255,250,228,.8)";
      cx.beginPath(); cx.arc(c.x - w * 0.3, c.y - 2, 1.4, 0, 6.284); cx.fill();
    }

    for (const r of S.rings) {
      const k = r.t / r.life;
      cx.globalAlpha = 1 - k;
      cx.strokeStyle = r.c; cx.lineWidth = r.w * (1 - k * 0.6);
      cx.beginPath(); cx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * ease(k), 0, 6.284); cx.stroke();
      cx.globalAlpha = 1;
    }
    for (const p of S.pops) {
      const k = p.t / p.life;
      cx.globalAlpha = 1 - k * k;
      cx.font = "bold 14px " + FONT; cx.fillStyle = p.c; cx.textAlign = "center";
      cx.fillText(p.text, p.x, p.y - ease(k) * 34);
      cx.globalAlpha = 1;
    }
    cx.restore();

    if (S.flash > 0.01) { cx.fillStyle = "rgba(255,244,214," + S.flash * 0.5 + ")"; cx.fillRect(0, 0, W, H); }

    cx.textAlign = "center";
    if (S.banner > 0 && !S.over) {
      const k = 1 - S.banner / 2.1;
      const inK = clamp(k / 0.14, 0, 1), outK = clamp((k - 0.75) / 0.25, 0, 1);
      cx.globalAlpha = (1 - outK) * (0.35 + ease(inK) * 0.65);
      cx.font = (26 + (1 - ease(inK)) * 20).toFixed(0) + "px Impact, sans-serif";
      cx.fillStyle = "#e8c05a";
      cx.fillText(S.bannerText, W / 2, OY - 14 + (1 - ease(inK)) * -22);
      cx.globalAlpha = 1;
    }
    if (S.over) {
      cx.fillStyle = "rgba(11,9,16,.86)"; cx.fillRect(0, 0, W, H);
      cx.font = "48px Impact, sans-serif";
      cx.fillStyle = S.won ? "#e8c05a" : "#d1553f";
      cx.fillText(S.won ? "THE SEAM IS OURS" : "THEY REACHED THE CARAVAN", W / 2, H / 2 - 14);
      cx.font = "17px " + FONT; cx.fillStyle = "#e6dfd4";
      cx.fillText(S.won
        ? S.killed + " left in the dirt, " + Math.round(S.mined) + " gold cut out of the rock."
        : "Wave " + (S.waveIx + 1) + " of " + WAVES.length + ".", W / 2, H / 2 + 18);
      cx.fillStyle = "#9a9089"; cx.font = "13px " + FONT;
      cx.fillText("Click anywhere for a fresh chamber.", W / 2, H / 2 + 46);
    }
    if (S.paused && !S.over) {
      cx.fillStyle = "rgba(11,9,16,.7)"; cx.fillRect(0, 0, W, H);
      cx.font = "40px Impact, sans-serif"; cx.fillStyle = "#e8c05a";
      cx.fillText("PAUSED", W / 2, H / 2);
    }
  }

  // ===================================================================== input
  const hover = { col: -1, row: -1 };
  const toBoard = ev => {
    const r = cv.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
  };
  cv.addEventListener("mousemove", ev => {
    const p = toBoard(ev);
    const c = Math.floor((p.x - OX) / CELL), r = Math.floor((p.y - OY) / CELL);
    const inside = c >= 0 && c < COLS && r >= 0 && r < ROWS;
    hover.col = inside ? c : -1; hover.row = inside ? r : -1;
  });
  cv.addEventListener("mouseleave", () => { hover.col = -1; hover.row = -1; });
  cv.addEventListener("contextmenu", ev => { ev.preventDefault(); clearSel(); });

  // One routine for both input styles. Returns true if something happened.
  function tryPlace(key, col, row) {
    const u = UNITS[key];
    if (!u) return false;
    const occ = gobAt(col, row);
    if (!laneIsOpen(row)) {
      Sound.play("deny");
      popText(OX + col * CELL + CELL / 2, OY + row * CELL + 12, "STILL CAVED IN", "#8a8095");
      burst(OX + col * CELL + CELL / 2, OY + row * CELL + CELL / 2, 8,
            { colors: ["#4a4150", "#3b3340"], spread: 150, size: [1.4, 3], life: [0.2, 0.4] });
      return false;
    }
    if (S.buried[col + "," + row]) {
      Sound.play("deny");
      popText(OX + col * CELL + CELL / 2, OY + row * CELL + 12, "UNDER RUBBLE", "#8a8095");
      return false;
    }
    if (S.cool[key] > 0) { Sound.play("deny"); denyCard(key); return false; }
    if (S.coins < costOf(key)) { Sound.play("deny"); denyCard(key); return false; }

    // Dropping a goblin onto a goblin fuses them, which is the only way to reach
    // anything past the three you can buy.
    if (occ) {
      if (occ.parts.length >= MAX_PARTS) {
        Sound.play("deny");
        popText(OX + col * CELL + CELL / 2, OY + row * CELL + 12, "NO ROOM IN THERE", "#d1553f");
        return false;
      }
      S.coins -= costOf(key);
      occ.parts.push(key);
      occ.hp = maxHpOf(occ); occ.squash = 1.4; occ.born = S.t;
      const gp = cellOf(occ);
      burst(gp.x + CELL / 2, gp.y + CELL / 2, 24,
            { colors: ["#fff3cf", "#e8c05a", tintOf(occ)], spread: 320, size: [1.8, 4.6] });
      ring(gp.x + CELL / 2, gp.y + CELL / 2, 96, "rgba(255,243,207,.85)", 4, 0.4);
      popText(gp.x + CELL / 2, gp.y + 4, nameOf(occ).toUpperCase(), "#fff3cf");
      kick(9); stop(0.08); flash(0.24); Sound.play("merge");
      S.cool[key] = rechargeOf(key);
      S.selUnit = null; renderRack();
      renderInspector();
      return true;
    }

    S.coins -= costOf(key);
    // hp has to come from maxHpOf, not the raw stat, or an upgraded body spawns hurt
    const born = { id: ++GID, parts: [key], col, row, hp: 0, born: S.t, age: 0,
                     cd: 0.5, dcd: 1.2,
                     squash: 0, land: 1, recoil: 0, hurtT: 0, wind: 0 };
    born.hp = maxHpOf(born);
    S.goblins.push(born);
    const gx = OX + col * CELL + CELL / 2, gy = OY + row * CELL + CELL * 0.6;
    burst(gx, gy + 18, 10, { colors: ["#4a4150", "#3b3340", "#5a5060"], spread: 180,
                             size: [1.4, 3.4], gravity: 520, life: [0.18, 0.4] });
    ring(gx, gy + 16, 40, "rgba(160,150,170,.4)", 2.2, 0.26);
    kick(3); stop(0.02); Sound.play("place");
    S.cool[key] = rechargeOf(key);
    S.selUnit = null; renderRack();
    return true;
  }

  // Carrying one goblin into another. Costs nothing — you already paid for both — and
  // it is the only way to recover a Digger whose pocket has run dry.
  // Merging two bodies already on the board is a march, not a teleport. The goblin
  // leaves its cell and walks the lanes to the one it is joining, and anything whose
  // lane it crosses gets a swing at it on the road. Recycling a worked-out Digger from
  // column 6 is therefore a decision about the map rather than a free tidy-up.
  const WALK_SPEED = 118;
  function fuseInPlace(src, dst) {
    if (src.parts.length + dst.parts.length > MAX_PARTS) {
      Sound.play("deny");
      popText(OX + dst.col * CELL + CELL / 2, OY + dst.row * CELL + 12,
              "NO ROOM IN THERE", "#d1553f");
      return false;
    }
    if (!laneIsOpen(dst.row) || S.buried[dst.col + "," + dst.row]) { Sound.play("deny"); return false; }
    const from = cellOf(src);
    S.goblins = S.goblins.filter(g => g !== src);
    S.walkers.push({ parts: src.parts.slice(), hp: src.hp, maxHp: maxHpOf(src),
                     age: src.age || 0, spent: spentOn(src),
                     x: from.x + CELL / 2, y: from.y + CELL * 0.55,
                     toId: dst.id, step: 0, hurtT: 0 });
    const gp = cellOf(dst);
    ring(from.x + CELL / 2, from.y + CELL / 2, 60, "rgba(232,192,90,.6)", 3, 0.3);
    ring(gp.x + CELL / 2, gp.y + CELL / 2, 70, "rgba(232,192,90,.5)", 2.5, 0.45);
    Sound.play("place");
    S.selGob = null;
    renderInspector();
    return true;
  }

  // The road. A walker is off the grid, so it does not shoot, does not dig and nothing
  // stands behind it - it is a body crossing open ground and that is the whole point.
  function stepWalkers(dt) {
    for (const w of S.walkers) {
      if (w.hurtT > 0) w.hurtT -= dt;
      const dst = S.goblins.find(g => g.id === w.toId && g.hp > 0);
      if (!dst) {                        // its destination died while it was on the way
        w.stranded = (w.stranded || 0) + dt;
        if (w.stranded > 0.35) { landWalker(w); w.gone = true; }
        continue;
      }
      const gp = cellOf(dst);
      const tx = gp.x + CELL / 2, ty = gp.y + CELL * 0.55;
      const dx = tx - w.x, dy = ty - w.y, d = Math.hypot(dx, dy);
      w.step += dt * 9;
      if (d > 3) { w.x += dx / d * WALK_SPEED * dt; w.y += dy / d * WALK_SPEED * dt; }
      const lane = Math.floor((w.y - OY) / CELL);
      for (const f of S.foes) {
        if (f.hp <= 0 || f.lane !== lane) continue;
        if (Math.abs(f.x - w.x) > CELL * 0.55) continue;
        w.hp -= FOES[f.type].dps * dt;
        w.hurtT = 0.14;
        if (Math.random() < dt * 6)
          burst(w.x, w.y, 2, { colors: ["#d1553f", "#e8c05a"], spread: 110,
                               size: [1.2, 2.4], life: [0.12, 0.3] });
      }
      if (w.hp <= 0) {
        popText(w.x, w.y - 8, "LOST ON THE ROAD", "#d1553f");
        burst(w.x, w.y, 16, { colors: ["#d1553f", "#8b93a2", "#4a4150"], spread: 260 });
        Sound.play("kill"); kick(4);
        w.gone = true;
        continue;
      }
      if (d <= 3) { arrive(w, dst); w.gone = true; }
    }
    S.walkers = S.walkers.filter(w => !w.gone);
  }

  // Its destination died under it. There is no wagon to climb back into here, so it digs
  // in where it stands rather than evaporating - the nearest open cell to the spot it
  // reached. Losing the goblin you were merging into should not lose you both.
  function landWalker(w) {
    const lane = clamp(Math.floor((w.y - OY) / CELL), 0, ROWS - 1);
    const col = clamp(Math.round((w.x - OX - CELL / 2) / CELL), 0, COLS - 1);
    let best = null;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!laneIsOpen(r) || S.buried[c + "," + r] || gobAt(c, r)) continue;
      const d = Math.abs(c - col) + Math.abs(r - lane) * 1.5;
      if (!best || d < best.d) best = { c, r, d };
    }
    if (!best) {                        // nowhere at all to stand: pay it out instead
      const back = Math.round(w.spent * 0.5);
      S.coins += back;
      popText(w.x, w.y - 6, "+" + back, "#e8c05a");
      bumpCoins();
      return;
    }
    const g = { id: ++GID, parts: w.parts.slice(), col: best.c, row: best.r, hp: 0,
                born: S.t, age: w.age, cd: 0.5, dcd: 1.2, squash: 1.2, land: 1,
                recoil: 0, hurtT: 0, wind: 0 };
    g.hp = clamp(w.hp, 12, maxHpOf(g));
    S.goblins.push(g);
    const gp = cellOf(g);
    popText(gp.x + CELL / 2, gp.y + 4, "DUG IN", "#e8c05a");
    ring(gp.x + CELL / 2, gp.y + CELL / 2, 54, "rgba(232,192,90,.6)", 2.5, 0.34);
    Sound.play("place");
  }

  function arrive(w, dst) {
    const keptFrac = clamp(w.hp / w.maxHp, 0.2, 1);
    for (const t of w.parts) dst.parts.push(t);
    // the one that walked over arrives as hurt as it was
    dst.hp = Math.max(dst.hp, maxHpOf(dst) * Math.min(1, (dst.hp / maxHpOf(dst) + keptFrac) / 2));
    dst.hp = clamp(dst.hp, 12, maxHpOf(dst));
    dst.squash = 1.4; dst.born = S.t;
    const gp = cellOf(dst);
    burst(gp.x + CELL / 2, gp.y + CELL / 2, 22,
          { colors: ["#fff3cf", "#e8c05a", tintOf(dst)], spread: 300, size: [1.8, 4.4] });
    ring(gp.x + CELL / 2, gp.y + CELL / 2, 92, "rgba(255,243,207,.8)", 4, 0.4);
    popText(gp.x + CELL / 2, gp.y + 4, nameOf(dst).toUpperCase(), "#fff3cf");
    kick(8); stop(0.07); Sound.play("merge");
    renderInspector();
  }

  // Dig one up. Free for a moment in case of a misclick, then half back.
  const GRACE = 3;
  function refundOf(g) {
    const spent = spentOn(g);
    return (S.t - g.born <= GRACE) ? spent : Math.round(spent * 0.5);
  }
  function removeGoblin(g) {
    const back = refundOf(g), gp = cellOf(g);
    S.coins += back;
    S.goblins = S.goblins.filter(x => x !== g);
    if (S.selGob === g) S.selGob = null;
    popText(gp.x + CELL / 2, gp.y + 10, "+" + back, "#e8c05a");
    burst(gp.x + CELL / 2, gp.y + CELL * 0.6, 10,
          { colors: ["#4a4150", "#c9a24a"], spread: 170, size: [1.4, 3], life: [0.2, 0.45] });
    Sound.play("dig");
    bumpCoins();
  }

  cv.addEventListener("click", ev => {
    Sound.wake();
    if (S.over) { newRun(); renderAll(); return; }
    if (S.paused) return;
    const p = toBoard(ev);
    const col = Math.floor((p.x - OX) / CELL), row = Math.floor((p.y - OY) / CELL);
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;

    if (S.selUnit) { tryPlace(S.selUnit, col, row); return; }
    const occ = gobAt(col, row);
    // A goblin already on the board can be folded into another one. This is how a
    // worked-out Digger gets reused instead of dug up for half its gold.
    if (S.selGob && occ && occ !== S.selGob && fuseInPlace(S.selGob, occ)) return;
    S.selGob = (occ && S.selGob !== occ) ? occ : null;
    if (S.selGob) Sound.play("select");
    renderInspector();
  });

  function clearSel() { S.selUnit = null; S.selGob = null; renderRack(); }
  addEventListener("keydown", e => { if (e.key === "Escape") clearSel(); });

  // ==================================================================== chrome
  const DESC = {
    chucker:  "Throws rocks.",
    digger:   "Mines. Deeper is richer.",
    barricade:"Soaks hits.",
    sapper:   "Clears rubble in its lane.",
    tollkeep: "Extra gold from kills in its lane.",
    keg:      "Blows up the lane. Once.",
    hollerer: "Slows its lane.",
  };
  let drag = null;
  function cellUnder(clientX, clientY) {
    const r = cv.getBoundingClientRect();
    if (clientX < r.left || clientX > r.right || clientY < r.top || clientY > r.bottom) return null;
    const x = (clientX - r.left) * (W / r.width), y = (clientY - r.top) * (H / r.height);
    const col = Math.floor((x - OX) / CELL), row = Math.floor((y - OY) / CELL);
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
    return { col, row };
  }
  const rack = document.getElementById("rack");
  function denyCard(key) {
    const el = rack.querySelector('[data-unit="' + key + '"]');
    if (!el) return;
    el.classList.remove("deny"); void el.offsetWidth; el.classList.add("deny");
  }
  function renderRack() {
    rack.innerHTML = "";
    for (const key of ROSTER) {
      const u = UNITS[key];
      const b = document.createElement("button");
      b.className = "card"; b.type = "button"; b.dataset.unit = key;
      b.style.setProperty("--unit", u.tint);
      b.disabled = S.coins < costOf(key) || S.cool[key] > 0;
      b.setAttribute("aria-pressed", String(S.selUnit === key));
      b.innerHTML = '<span class="card-name">' + u.name + "</span>" +
                    '<span class="card-cost">' + costOf(key) + "</span>" +
                    '<span class="card-desc">' + DESC[key] + "</span>" +
                    '<span class="cd" data-cd="' + key + '"></span>';
      b.addEventListener("mouseenter", () => { if (!b.disabled) Sound.play("hover"); });
      // Drag-to-place alongside tap-to-select, as the phone version of the original
      // offers both. A tap must fall through to the click handler untouched — treating
      // every pointerdown as a drag silently cancelled every selection.
      b.addEventListener("pointerdown", ev => {
        if (b.disabled) return;
        Sound.wake();
        drag = { key, id: ev.pointerId, sx: ev.clientX, sy: ev.clientY, moved: false };
        b.setPointerCapture(ev.pointerId);
      });
      b.addEventListener("pointermove", ev => {
        if (!drag || drag.id !== ev.pointerId) return;
        if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 9) {
          drag.moved = true;
          b.classList.add("drag");
          S.selUnit = drag.key;            // so the ghost previews the right thing
        }
        if (!drag.moved) return;
        const c = cellUnder(ev.clientX, ev.clientY);
        hover.col = c ? c.col : -1; hover.row = c ? c.row : -1;
      });
      b.addEventListener("pointerup", ev => {
        if (!drag || drag.id !== ev.pointerId) return;
        const wasDrag = drag.moved, key = drag.key;
        drag = null;
        b.classList.remove("drag");
        if (!wasDrag) return;              // a tap: the click handler selects as usual
        const c = cellUnder(ev.clientX, ev.clientY);
        hover.col = -1; hover.row = -1;
        if (c) tryPlace(key, c.col, c.row);
        else { S.selUnit = null; renderRack(); }
      });
      b.addEventListener("pointercancel", () => { b.classList.remove("drag"); drag = null; });
      b.addEventListener("click", () => {
        Sound.wake();
        S.selUnit = S.selUnit === key ? null : key;
        S.selGob = null; Sound.play("select"); renderRack();
      });
      rack.appendChild(b);
    }
  }

  const inspEmpty = document.getElementById("insp-empty");
  const inspBody = document.getElementById("insp-body");
  const inspName = document.getElementById("insp-name");
  const inspMeta = document.getElementById("insp-meta");
  function renderInspector() {
    const g = S.selGob;
    if (!g || g.hp <= 0) { inspEmpty.hidden = false; inspBody.hidden = true; return; }
    inspEmpty.hidden = true; inspBody.hidden = false;
    inspName.textContent = nameOf(g);
    const bits = [g.parts.map(t => UNITS[t].name).join(" + "),
                  Math.round(g.hp) + "/" + Math.round(maxHpOf(g)) + " hp"];
    const dn = countOf(g, "digger");
    if (dn > 0) {
      const warm = DIG_FLOOR + (1 - DIG_FLOOR) * Math.min(1, (g.age || 0) * dn / DIG_WARM);
      bits.push("shaft " + Math.round(warm * 100) + "%");
      bits.push("+" + Math.max(1, Math.round(yieldAt(g.col) * warm * (1 + (dn - 1) * 0.85))) + " per pull");
    }
    if (g.parts.length < MAX_PARTS) bits.push("room for " + (MAX_PARTS - g.parts.length) + " more");
    const free = S.t - g.born <= GRACE;
    bits.push(free ? "dig up: full refund" : "dig up: half back");
    inspMeta.textContent = bits.join("  ·  ");
  }
  document.getElementById("insp-dig").addEventListener("click", () => {
    if (S.selGob) removeGoblin(S.selGob);
    renderInspector();
  });

  const pipsEl = document.getElementById("pips");
  function renderPips() {
    pipsEl.innerHTML = "";
    for (let i = 0; i < WAVES.length; i++) {
      const d = document.createElement("div");
      d.className = "pip" + (i < S.waveIx ? " done" : i === S.waveIx ? " now" : "");
      pipsEl.appendChild(d);
    }
  }

  const coinsEl = document.getElementById("hud-coins");
  const rateEl = document.getElementById("hud-rate");
  const waveEl = document.getElementById("hud-wave");
  const veinsEl = document.getElementById("hud-veins");
  let bumpT = null;
  function bumpCoins() {
    coinsEl.classList.add("bump");
    clearTimeout(bumpT);
    bumpT = setTimeout(() => coinsEl.classList.remove("bump"), 100);
  }

  document.getElementById("restart").addEventListener("click", () => { newRun(); renderAll(); });
  const pauseBtn = document.getElementById("pause");
  pauseBtn.addEventListener("click", () => {
    S.paused = !S.paused;
    pauseBtn.textContent = S.paused ? "Resume" : "Pause";
    pauseBtn.classList.toggle("on", S.paused);
  });
  const muteBtn = document.getElementById("mute");
  muteBtn.addEventListener("click", () => {
    Sound.wake();
    const on = Sound.toggle();
    muteBtn.textContent = on ? "Sound on" : "Sound off";
    muteBtn.classList.toggle("on", on);
  });
  function renderAll() { renderRack(); renderPips(); renderInspector(); }

  // ====================================================================== loop
  let last = performance.now(), affordSig = null;
  function frame(now) {
    let dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (S.freeze > 0) { S.freeze -= dt; dt = 0; }
    if (!S.paused && !S.over) update(dt);
    render();

    coinsEl.textContent = Math.round(S.coins);
    rateEl.textContent = "+" + S.rate.toFixed(1) + " / sec";
    waveEl.textContent = S.over ? (S.won ? "clear" : "lost")
      : S.waveIx < 0 ? "—" : (S.waveIx + 1) + "/" + CHAMBER_WAVES.length;
    veinsEl.textContent = S.goblins.filter(g => countOf(g, "digger") > 0).length + " digging";

    if (S.selGob) renderInspector();
    for (const k in S.cool) {
      const el = rack.querySelector('[data-cd="' + k + '"]');
      if (el) el.style.height = (S.cool[k] / rechargeOf(k) * 100).toFixed(1) + "%";
    }
    const sig = ROSTER.map(k => (S.coins >= costOf(k)) + ":" + (S.cool[k] > 0)).join("");
    if (sig !== affordSig) { affordSig = sig; renderRack(); }
    requestAnimationFrame(frame);
  }

  window.__hoard = {
    get state() { return S; },
    wave: n => { S.waveIx = n - 2; S.phase = "breath"; S.phaseT = 0.1; },
    nameOf, maxHpOf, yieldAt, WAVES, UNITS, WORLDS, ROUTE, UPGRADES, SMALLS, place: tryPlace,
    costOf,
    smallPrice: (role, id) => Math.round(SMALLS[id].base * (1 + smallOf(role, id) * 0.7)),
    smallCount: (role, id) => smallOf(role, id),
    remove: removeGoblin,
    fuse: fuseInPlace,
    veinAt: (c, r) => S.veins[c + "," + r] === undefined ? 1 : S.veins[c + "," + r],
    get cfg() { return CFG; },
    // Start a chamber for the meta layer. cfg = { world, chapter, chamber, roles }.
    begin(cfg, done) {
      CFG = Object.assign({ world: null, chapter: 1, chamber: 1 }, cfg);
      ROSTER = cfg.roles && cfg.roles.length ? cfg.roles.slice() : ROSTER;
      UPS = cfg.upgrades || {};
      SM = cfg.smalls ? JSON.parse(JSON.stringify(cfg.smalls)) : {};
      onChamberEnd = done;
      newRun();
      // A chapter is one continuous defence. Whatever lived through the last chamber is
      // still standing where you left it, at the health it survived on, and the gold you
      // did not spend is still in your pocket.
      if (cfg.board && cfg.board.length) {
        for (const b of cfg.board) {
          const g = { id: ++GID, parts: b.parts.slice(), col: b.col, row: b.row, hp: 0, born: -99,
                      age: b.age || 0, cd: 0.5, dcd: 1.2, squash: 0, land: 0,
                      recoil: 0, hurtT: 0, wind: 0 };
          g.hp = Math.max(12, maxHpOf(g) * (b.hpFrac === undefined ? 1 : b.hpFrac));
          S.goblins.push(g);
        }
      }
      if (cfg.carryGold !== undefined) S.coins = cfg.carryGold;
      // Opening gold rides the shop's own markup, so what 400 buys in chapter 1 is what a
      // chapter-3 opening buys too. The old +50% a chapter outran the +25% price rise, so
      // the deepest chapter started a third richer than the first while everything else
      // about it was meant to be harder.
      else S.coins = Math.round(START_COINS * (1 + (CFG.chapter - 1) * 0.2));
      if (cfg.veins) S.veins = Object.assign({}, cfg.veins);
      CHAMBER_WAVES = wavesForChamber();
      S.bannerText = "CHAMBER " + CFG.chamber + " OF 3";
      S.banner = 2.4;
      const w = WORLDS[CFG.world];
      if (w) {
        document.querySelector("h1").textContent = w.name;
        document.querySelector(".kicker").textContent =
          "chapter " + CFG.chapter + " · chamber " + CFG.chamber + " of 3 · " + w.rule;
      }
      renderAll();
    },
    // Balance harness: advance the simulation without waiting on real frames.
    step: dt => { if (!S.over) update(dt); },
    reset: () => { newRun(); renderAll(); },
  };
  renderAll();
  requestAnimationFrame(frame);
})();
</script>

<script>
// ============================================================== the meta layer
// Wraps the real chamber above. Nothing here simulates a fight — it hands the chamber
// a roster, a world rule and a depth, and waits to hear how it went.
(() => {
  "use strict";
  const V = window.__hoard;
  const metaEl = document.getElementById("meta");
  const gameEl = document.getElementById("game-shell");

  const ROLES = {
    chucker:  { note: "Throws rocks. The baseline.", start: true },
    digger:   { note: "Pulls gold out of the ground.", start: true },
    barricade:{ note: "Doesn't fight. Won't move.", start: true },
    sapper:   { note: "Shovels rubble out of its lane.", meets: "scree" },
    tollkeep: { note: "Takes a cut off every kill in its lane.", meets: "rot" },
    keg:      { note: "Goes off when something reaches it. Takes the lane with it.", meets: "deep" },
    hollerer: { note: "Jeers. Heroes in its lane slow to shout back.",
                unlock: "Clear chapter 2 of any world" },
  };
  const FIRST = ["Grub","Nix","Pell","Odd","Wex","Tunk","Mib","Sorrel","Krug","Fen",
                 "Bristle","Nog","Vetch","Hob","Clatter","Muck","Pip","Snell"];
  const LAST = ["the Patient","Two-Thumbs","of the Shelf","Nobody's Son","the Loud",
                "Half-Ear","the Third","who Waits","Longshanks","the Unpaid"];
  const rnd = a => a[(Math.random() * a.length) | 0];
  const el = (t, c, x) => { const d = document.createElement(t);
    if (c) d.className = c; if (x != null) d.textContent = x; return d; };

  // Everything on the bench is a sidegrade you can already beat the game without.
  const BENCH = [
    { role: "sapper",   cost: 14 },
    { role: "tollkeep", cost: 14 },
    { role: "keg",      cost: 16 },
    { role: "hollerer", cost: 22 },
  ];
  const CHAPTERS = V.ROUTE.length;      // one route down, four chapters
  const SAVE = "hoard.v5";
  let M, R = null;
  const newGob = role => ({ id: Math.random().toString(36).slice(2,8), role,
                            name: rnd(FIRST) + " " + rnd(LAST), runs: 0 });
  function fresh() {
    const m = { scrip: 0, unlocked: ["chucker","digger","barricade"], warren: [], deepest: 0 };
    for (const r of m.unlocked) for (let i = 0; i < 3; i++) m.warren.push(newGob(r));
    return m;
  }
  function load() {
    try { M = JSON.parse(localStorage.getItem(SAVE)); } catch (e) { M = null; }
    if (!M || !M.warren || !M.warren.length) M = fresh();
    return M;
  }
  const save = () => { try { localStorage.setItem(SAVE, JSON.stringify(M)); } catch (e) {} };

  function unlockCheck(ev) {
    const want = {
      hollerer: () => ev.clearedIn && ev.chapter >= 2,
    };
    const got = [];
    for (const k in want) {
      if (M.unlocked.includes(k) || !want[k]()) continue;
      M.unlocked.push(k);
      for (let i = 0; i < 3; i++) M.warren.push(newGob(k));
      got.push(V.UNITS[k].name);
    }
    return got;
  }

  // ------------------------------------------------------------------ chrome
  function bar() {
    const b = el("div", "m-bar");
    const stat = (l, v, cls) => { const d = el("div", "readout");
      d.append(el("span", "readout-label", l));
      const s2 = el("span", "readout-value" + (cls ? " " + cls : ""), String(v));
      d.append(s2); b.append(d); };
    stat("Scrip", M.scrip, "gold");
    if (R) stat("Carried", R.scrip, "risk");
    stat("Warren", M.warren.length);
    if (R) stat("Depth", R.chapter + "-" + R.chamber, "gold");
    else stat("Deepest", (M.deepest || 0) + "/" + CHAPTERS);
    const sp = el("span"); sp.style.marginLeft = "auto";
    const wipe = el("button", "btn", "Wipe save");
    // Native confirm() is suppressed inside the sandboxed frame the game is viewed in,
    // so it silently answered "no" and the button did nothing. Two taps on the button
    // itself instead — no dialogs anywhere in the game.
    let armed = false;
    wipe.onclick = () => {
      if (!armed) {
        armed = true;
        wipe.textContent = "Tap again to wipe";
        wipe.classList.add("danger");
        setTimeout(() => { if (!armed) return;
          armed = false; wipe.textContent = "Wipe save"; wipe.classList.remove("danger"); }, 3000);
        return;
      }
      localStorage.removeItem(SAVE); load(); warren();
    };
    sp.append(wipe); b.append(sp);
    return b;
  }
  function show(nodes) {
    gameEl.hidden = true; metaEl.hidden = false;
    metaEl.replaceChildren(bar(), ...nodes);
    window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------------ warren
  // ---------------------------------------------------------------- home
  // One screen, three jobs: where you can go, what you can spend on, and who you have.
  // It used to be a roster with a button that opened a list with a button.
  function warren() {
    R = null;
    const out = [];

    // 1. the route, first and largest. There used to be three worlds to choose between,
    // which meant the first decision of the game was between three things you had not
    // seen yet. It is one line down now, and the panel's whole job is to show what is
    // waiting on it - each chapter's rule, and which goblin answers it.
    const wp = el("div", "m-panel");
    wp.append(el("h2", null, "The descent"));
    const ws = el("div", "worlds");
    V.ROUTE.forEach((key, i) => {
      const w = V.WORLDS[key], ch = i + 1;
      const b = el("button", "world");
      const reached = M.deepest >= ch;
      const head = el("span", "world-tier");
      head.textContent = "Chapter " + ch + " of " + CHAPTERS + " · 3 chambers"
        + (M.deepest > ch ? " · cleared" : reached ? " · reached" : "");
      if (M.deepest > ch) head.style.color = "var(--goblin)";
      b.append(head);
      b.append(el("span", "world-name", w.name));
      b.append(el("span", "world-rule", w.rule));
      if (w.answer) {
        const known = M.unlocked.includes(w.answer);
        const f = el("span", "world-fix",
          (known ? "✓ " : "✦ meets you there · ") + V.UNITS[w.answer].name);
        if (!known) f.style.color = "var(--gold)";
        b.append(f);
      }
      // The route is a map, not a menu: every run starts at the top of it.
      b.disabled = true;
      ws.append(b);
    });
    wp.append(ws);
    const go = el("button", "btn on", "Descend");
    go.onclick = () => muster();
    const gr = el("div", "m-row"); gr.append(go);
    wp.append(gr);
    out.push(wp);

    // 2. the only thing scrip is for
    const buyable = BENCH.filter(x => !M.unlocked.includes(x.role));
    if (buyable.length) {
      const lp = el("div", "m-panel");
      const h = el("h2", null, "The bench");
      lp.append(h);
      const lc = el("div", "crew");
      for (const x of buyable) {
        const b = el("button", "gob");
        b.style.setProperty("--role", V.UNITS[x.role].tint);
        b.append(el("span", "gob-role", "Bench"));
        b.append(el("span", "gob-name", V.UNITS[x.role].name));
        b.append(el("span", "gob-note", ROLES[x.role].note));
        const free = ROLES[x.role].meets
          ? "or free in " + V.WORLDS[ROLES[x.role].meets].name : "";
        if (free) { const fr = el("span", "gob-note", free);
                    fr.style.color = "var(--goblin)"; b.append(fr); }
        b.append(el("span", "gob-kit", x.cost + " scrip"));
        b.disabled = M.scrip < x.cost;
        b.onclick = () => {
          if (M.scrip < x.cost) return;
          M.scrip -= x.cost; M.unlocked.push(x.role);
          for (let i = 0; i < 3; i++) M.warren.push(newGob(x.role));
          save(); warren();
        };
        lc.append(b);
      }
      lp.append(lc); out.push(lp);
    }

    // 3. who lives here, as a quiet strip rather than the main event
    const rp = el("div", "m-panel");
    rp.append(el("h2", null, "The warren"));
    const strip = el("div", "roster");
    const byRole = {};
    for (const g of M.warren) (byRole[g.role] = byRole[g.role] || []).push(g);
    for (const role in byRole) {
      const t = el("span", "tile");
      t.style.setProperty("--role", V.UNITS[role].tint);
      t.append(el("b", null, V.UNITS[role].name));
      t.append(el("i", null, "×" + byRole[role].length));
      strip.append(t);
    }
    rp.append(strip); out.push(rp);
    show(out);
  }

  // ---------------------------------------------------------------- muster
  const worldFor = ch => V.ROUTE[Math.min(ch, CHAPTERS) - 1];
  let picked = [];
  const CREW_MAX = 4;   // three locals join along the way
  function muster() {
    picked = [];
    const w = V.WORLDS[worldFor(1)];
    const p = el("div", "m-panel");
    p.append(el("h2", null, "Who comes down"));

    // You are packing for the whole descent now, not for one world, so the panel names
    // what is coming rather than one rule you will have forgotten by chapter three.
    const rule = el("p", "m-note");
    rule.innerHTML = "Four chapters. <b>" + V.ROUTE.slice(1).map(k => V.WORLDS[k].name).join(", ")
      + "</b> each want a different goblin, and each hands you theirs when you get there.";
    p.append(rule);

    const seen = {}, c = el("div", "crew");
    const uniq = M.warren.filter(g => seen[g.role] ? false : (seen[g.role] = 1));
    const go = el("button", "btn on", "Descend");
    const redraw = () => {
      [...c.children].forEach((b, i) => {
        b.classList.toggle("picked", picked.includes(uniq[i]));
        b.disabled = !picked.includes(uniq[i]) && picked.length >= CREW_MAX;
      });
      go.disabled = !picked.length;
      go.textContent = picked.length ? "Descend with " + picked.length : "Pick your crew";
    };
    for (const g of uniq) {
      const b = el("button", "gob");
      b.style.setProperty("--role", V.UNITS[g.role].tint);
      b.append(el("span", "gob-role", V.UNITS[g.role].cost + " gold to place"));
      b.append(el("span", "gob-name", V.UNITS[g.role].name));
      b.append(el("span", "gob-note", ROLES[g.role].note));
      const answers = V.UNITS[g.role].answers;
      if (answers && V.ROUTE.includes(answers)) {
        b.append(el("span", "gob-kit", "✦ answers " + V.WORLDS[answers].name));
      }
      b.onclick = () => {
        const i = picked.indexOf(g);
        if (i >= 0) picked.splice(i, 1); else if (picked.length < CREW_MAX) picked.push(g);
        redraw();
      };
      c.append(b);
    }
    p.append(c);

    const row = el("div", "m-row");
    const back = el("button", "btn", "Back"); back.onclick = warren;
    go.onclick = () => { begin(); enterChamber(); };
    row.append(back, go);
    show([p, row]); redraw();
  }

  // A chapter hands you its answer the moment you arrive, and that goblin joins the run
  // in progress. On a single route the crew is packed before you have seen chapters two
  // through four, so a local who only turns up between runs would be a local you could
  // never use where they matter.
  function meetLocal(world) {
    const role = V.WORLDS[world].answer;
    if (!role) return null;
    if (R && !R.crew.some(g => g.role === role)) R.crew.push(newGob(role));
    if (M.unlocked.includes(role)) return null;
    M.unlocked.push(role);
    for (let i = 0; i < 3; i++) M.warren.push(newGob(role));
    save();
    return V.UNITS[role].name;
  }

  function begin() {
    R = { world: worldFor(1), chapter: 1, chamber: 1, scrip: 0, crew: picked.slice(),
          upgrades: {}, smalls: {}, board: null, gold: undefined, veins: null, cleared: false };
    for (const g of R.crew) g.runs++;
    save();
  }

  function enterChamber() {
    R.world = worldFor(R.chapter);
    meetLocal(R.world);
    metaEl.hidden = true; gameEl.hidden = false;
    window.scrollTo(0, 0);
    V.begin({ world: R.world, chapter: R.chapter, chamber: R.chamber,
              roles: R.crew.map(g => g.role), upgrades: R.upgrades,
              board: R.board, carryGold: R.gold, veins: R.veins,
              smalls: R.smalls }, chamberDone);
  }

  // Three offers between chambers, Mewgenics-ish: each one bends a foreman rather than
  // adding a number, so a run's crew comes out shaped differently every time.
  // The workbench moved out of the fight and sits here instead, with the rest of the
  // decisions. Cheap, several of them, and priced up each time you buy the same one.
  function minorShop(p) {
    const roles = [...new Set(R.crew.map(g => g.role))];
    const pool = [];
    for (const id in V.SMALLS) {
      const sm = V.SMALLS[id];
      for (const role of roles) {
        if (sm.on && !sm.on.includes(role)) continue;
        pool.push({ id, role });
      }
    }
    const offers = [];
    while (offers.length < 4 && pool.length)
      offers.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
    if (!offers.length) return;

    const shop = el("div", "m-panel");
    shop.append(el("h2", null, "The workbench"));
    const note = el("p", "m-note");
    shop.append(note);
    const c = el("div", "crew");
    const paint = () => {
      note.innerHTML = "<b>" + (R.gold || 0) + " gold</b> in hand. "
        + "About a third of it comes with you into the next chamber.";
      [...c.children].forEach((b, i) => {
        const o = offers[i];
        b.disabled = o.bought || (R.gold || 0) < o.price;
        b.querySelector(".gob-kit").textContent = o.bought ? "fitted" : o.price + " gold";
      });
    };
    for (const o of offers) {
      const sm = V.SMALLS[o.id];
      o.price = V.smallPrice(o.role, o.id);
      const b = el("button", "gob");
      b.style.setProperty("--role", V.UNITS[o.role].tint);
      b.append(el("span", "gob-role", V.UNITS[o.role].name));
      b.append(el("span", "gob-name", sm.name));
      b.append(el("span", "gob-note", sm.note));
      b.append(el("span", "gob-kit", o.price + " gold"));
      b.onclick = () => {
        if (o.bought || (R.gold || 0) < o.price) return;
        R.gold -= o.price; o.bought = true;
        R.smalls = R.smalls || {};
        R.smalls[o.role] = R.smalls[o.role] || {};
        R.smalls[o.role][o.id] = (R.smalls[o.role][o.id] || 0) + 1;
        save(); paint();
      };
      c.append(b);
    }
    shop.append(c);
    p.append(shop);
    paint();
  }

  function offerUpgrades(then) {
    const roles = [...new Set(R.crew.map(g => g.role))];
    const pool = [];
    for (const id in V.UPGRADES) {
      const u = V.UPGRADES[id];
      for (const role of roles) {
        if (R.upgrades[role] && R.upgrades[role].includes(id)) continue;
        if (u.on[0] !== "*" && !u.on.includes(role)) continue;
        pool.push({ id, role });
      }
    }
    if (!pool.length) return then();
    const offers = [];
    while (offers.length < 3 && pool.length) offers.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);

    const p = el("div", "m-panel");
    p.append(el("h2", null, "Something rubbed off down there"));
    const c = el("div", "crew");
    for (const o of offers) {
      const u = V.UPGRADES[o.id];
      const btn = el("button", "gob");
      btn.style.setProperty("--role", V.UNITS[o.role].tint);
      btn.append(el("span", "gob-role", V.UNITS[o.role].name));
      btn.append(el("span", "gob-name", u.name));
      btn.append(el("span", "gob-note", u.note));
      btn.onclick = () => {
        (R.upgrades[o.role] = R.upgrades[o.role] || []).push(o.id);
        save();
      };
      c.append(btn);
    }
    p.append(c);
    show([p]);
  }

  function chamberDone(won, goldLeft, board, veins, smalls) {
    R.smalls = smalls || R.smalls;
    R.gold = goldLeft;
    if (!won) return lost();
    R.scrip += (1 + Math.round(goldLeft / 400)) * R.chapter;

    // The last chamber of a chapter goes straight to the chapter screen — the workbench
    // is there too, as the bigger forge, so stopping at both would be a screen for
    // nothing.
    if (R.chamber >= 3) {
      R.board = null; R.veins = null;
      return chapterCleared();
    }
    betweenChambers(() => {
      R.chamber++;
      // the chapter continues: keep what lived and what you did not spend, plus a
      // small wage so a wiped-out lane can be answered
      R.board = board;
      R.veins = veins;
      R.gold = Math.round(goldLeft * 0.45) + 60;
      save();
    });
  }

  // One screen between chambers: the workbench. Minor things, bought with gold.
  function betweenChambers(then) {
    const host = [];
    const p = el("div", "m-panel");
    p.append(el("h2", null, "Chamber " + R.chamber + " of 3 held"));
    const st = el("p", "m-note");
    st.innerHTML = (R.board && R.board.length
      ? "<b>" + R.board.length + "</b> still standing. " : "")
      + "Chamber " + (R.chamber + 1) + " asks more.";
    p.append(st);
    const owned = Object.entries(R.upgrades || {});
    if (owned.length) {
      const line = el("div", "roster");
      for (const [role, ids] of owned) for (const id of ids) {
        const t = el("span", "tile");
        t.style.setProperty("--role", V.UNITS[role].tint);
        t.append(el("b", null, V.UPGRADES[id].name));
        t.append(el("i", null, V.UNITS[role].name));
        line.append(t);
      }
      p.append(line);
    }
    host.push(p);
    minorShop({ append: n => host.push(n) });
    const row = el("div", "m-row");
    const on = el("button", "btn on", "Into chamber " + (R.chamber + 1));
    // straight back into the fight — this used to hand off to a map with one button
    on.onclick = () => { then(); enterChamber(); };
    row.append(on);
    host.push(row);
    show(host);
  }

  function chapterCleared() {
    const got = unlockCheck({ world: R.world, chapter: R.chapter, clearedIn: R.world });
    if (R.chapter > (M.deepest || 0)) M.deepest = R.chapter;
    save();
    const p = el("div", "m-panel");
    p.append(el("h2", null, "Chapter " + R.chapter + " cleared"));
    const n = el("p", "m-note");
    n.innerHTML = "Carrying <b>" + R.scrip + "</b>. Deeper chapters send different heroes.";
    p.append(n);
    if (got.length) {
      const u = el("p", "m-note");
      u.innerHTML = "<b style='color:var(--gold)'>" + got.join(", ") + " joined the warren.</b>";
      p.append(u);
    }
    // Gold is wiped when a chapter ends, so this is the one place it buys something
    // fundamental. Expensive on purpose.
    const purse = R.gold || 0;
    const roles = [...new Set(R.crew.map(g => g.role))];
    const big = [];
    for (const id in V.UPGRADES) {
      const u = V.UPGRADES[id];
      for (const role of roles) {
        if (R.upgrades[role] && R.upgrades[role].includes(id)) continue;
        if (u.on[0] !== "*" && !u.on.includes(role)) continue;
        big.push({ id, role, cost: u.on[0] === "*" ? 780 : 640 });
      }
    }
    if (big.length) {
      const shop = el("div", "m-panel");
      shop.append(el("h2", null, "The forge, before you go up"));
      const sn = el("p", "m-note");
      sn.innerHTML = "<b>" + purse + " gold</b> in hand. It does not survive the climb.";
      shop.append(sn);
      const sc = el("div", "crew");
      const offers = [];
      while (offers.length < 3 && big.length)
        offers.push(big.splice((Math.random() * big.length) | 0, 1)[0]);
      const paint = () => {
        [...sc.children].forEach((b, i) => {
          const o = offers[i];
          b.disabled = o.bought || (R.gold || 0) < o.cost;
          b.querySelector(".gob-kit").textContent = o.bought ? "fitted" : o.cost + " gold";
        });
        sn.innerHTML = "<b>" + (R.gold || 0) + " gold</b> in hand. It does not survive the climb.";
      };
      for (const o of offers) {
        const u = V.UPGRADES[o.id];
        const b = el("button", "gob");
        b.style.setProperty("--role", V.UNITS[o.role].tint);
        b.append(el("span", "gob-role", V.UNITS[o.role].name));
        b.append(el("span", "gob-name", u.name));
        b.append(el("span", "gob-note", u.note));
        b.append(el("span", "gob-kit", o.cost + " gold"));
        b.onclick = () => {
          if (o.bought || (R.gold || 0) < o.cost) return;
          R.gold -= o.cost; o.bought = true;
          (R.upgrades[o.role] = R.upgrades[o.role] || []).push(o.id);
          save(); paint();
        };
        sc.append(b);
      }
      shop.append(sc);
      p.append(shop);
      paint();
    }

    const row = el("div", "m-row");
    const out = el("button", "btn on", "Walk out with it"); out.onclick = bank;
    if (R.chapter < CHAPTERS) {
      const nxt = V.WORLDS[worldFor(R.chapter + 1)];
      // Naming what is below makes banking a real decision instead of a coin flip.
      const tease = el("p", "m-note");
      tease.innerHTML = "Below: <b>" + nxt.name + "</b> — " + nxt.rule;
      p.append(tease);
      const down = el("button", "btn danger", "Into " + nxt.name);
      down.onclick = () => {
        R.chapter++; R.chamber = 1; R.board = null; R.gold = undefined; R.veins = null; save();
        enterChamber();
      };
      row.append(out, down);
    } else {
      // the bottom of the world. There is nowhere further to go, and it says so.
      const fin = el("p", "m-note");
      fin.innerHTML = "<b style='color:var(--gold)'>You are at the bottom of "
        + V.WORLDS[R.world].name + ".</b> Nothing below this.";
      p.append(fin);
      const done = el("button", "btn on", "Carry it home");
      done.onclick = () => { R.cleared = true; bank(); };
      row.replaceChildren(done);
    }
    show([p, row]);
  }

  function bank() {
    let bonus = 0;
    if (R.cleared) {
      bonus = 20;
      M.cleared = true;
    }
    M.scrip += R.scrip + bonus; save();
    const p = el("div", "m-panel");
    p.append(el("h2", null, R.cleared ? "The descent is finished" : "Home"));
    const n = el("p", "m-note");
    n.innerHTML = "Banked <b>" + R.scrip + "</b>"
      + (bonus ? " and <b style='color:var(--gold)'>" + bonus + " for the bottom</b>" : "")
      + ". Everyone came back.";
    p.append(n);
    const row = el("div", "m-row");
    const b = el("button", "btn on", "Back to the warren"); b.onclick = warren;
    row.append(b); show([p, row]);
  }

  function lost() {
    const kept = Math.round(R.scrip * 0.3);
    M.scrip += kept;
    const got = unlockCheck({ world: R.world, chapter: R.chapter });
    save();
    const p = el("div", "m-panel");
    p.append(el("h2", null, "They took the cart"));
    const n = el("p", "m-note");
    n.innerHTML = "Carried <b>" + R.scrip + "</b>, kept <b>" + kept + "</b>.";
    p.append(n);
    if (got.length) {
      const u = el("p", "m-note");
      u.innerHTML = "<b style='color:var(--gold)'>" + got.join(", ") + " joined the warren.</b>";
      p.append(u);
    }
    const row = el("div", "m-row");
    const b = el("button", "btn", "Back to the warren"); b.onclick = warren;
    row.append(b); show([p, row]);
  }

  window.__meta = { get run() { return R; }, get meta() { return M; },
                    warren, muster, begin, enterChamber };
  load(); warren();
})();
</script>
